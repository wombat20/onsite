<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONSITE — 지원자 (모바일)</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22512%22%20height%3D%22512%22%20viewBox%3D%220%200%20512.00%20512.00%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22139%22%20fill%3D%22%232466E0%22%2F%3E%3Cg%20transform%3D%22translate%28256%20256%29%20scale%281.75%29%20translate%28-88.3%20-80%29%22%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2280%22%20r%3D%2240%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2234%22%2F%3E%3Cpath%20d%3D%22M88.3%2051.7%20L143.9%20107.3%20Q156.6%20120%20156.6%20102%20L156.6%2040%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2234%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<style>
  /* ONSITE 공통 토큰 v2 */
  :root{
    --pri:#2466E0;--pri-h:#1D56C4;--pri-weak:#EEF3FE;--pri-line:#C9D8F7;--navy:#0F1E45;--sky:#7FA6F0;
    --tx:#0F1E45;--tx2:#5A6684;--tx3:#98A2B8;
    --line:#ECEEF3;--line2:#DFE3EB;
    --bg:#FFFFFF;--bg-sub:#F5F7FB;--hover:#EEF1F7;
    --ok:#1F9254;--warn:#B8740F;--err:#E5383B;--err-weak:#FDF1F1;--warn-weak:#FDF6EA;
    --r:14px;--r-sm:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Wanted Sans Variable','Wanted Sans','Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    letter-spacing:-0.01em;color:var(--tx);line-height:1.5;background:#EDEEF1;
    min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 0 34px;-webkit-font-smoothing:antialiased;}
  button,input{font:inherit;color:inherit;letter-spacing:inherit;border:0;background:none;}
  button{cursor:pointer;}
  .ico{stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;}

  /* 데모 컨트롤 (프레임 밖) */
  .doc-tag{font-size:12px;color:#8A8F99;margin-bottom:10px;text-align:center;}
  .doc-tag b{color:var(--tx);font-weight:700;}
  .demo{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap;justify-content:center;max-width:560px;}
  .demo .dl{font-size:11px;color:#8A8F99;font-weight:600;}
  .demo .seg{display:inline-flex;background:#DFE1E6;border-radius:8px;padding:2px;gap:2px;}
  .demo .seg button{height:28px;padding:0 11px;border-radius:6px;font-size:11.5px;font-weight:600;color:#6A6E79;}
  .demo .seg button.on{background:#fff;color:var(--tx);}
  .dbtn{height:32px;padding:0 12px;border-radius:8px;background:#fff;border:1px solid #DFE1E6;font-size:11.5px;font-weight:600;color:var(--tx);display:inline-flex;align-items:center;gap:5px;}
  .dbtn:disabled{opacity:.45;cursor:default;}

  /* 프레임 */
  .frame{width:392px;height:866px;background:var(--bg);border:1px solid #E1E3E8;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative;
    box-shadow:0 14px 30px rgba(22,22,29,.06),0 44px 88px rgba(22,22,29,.08);}
  .statusbar{height:50px;flex-shrink:0;background:var(--bg);position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 9px;z-index:3;}
  .statusbar .sb-time{font-size:14px;font-weight:600;}
  .statusbar .sb-sys{display:flex;align-items:center;gap:6px;}
  .island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:104px;height:30px;background:#0b0b0e;border-radius:16px;}
  .main{flex:1;overflow-y:auto;position:relative;}
  .main::-webkit-scrollbar{width:0;}
  .page{padding:8px 20px 28px;animation:fin .18s ease;}
  @keyframes fin{from{opacity:0;transform:translateY(4px);}}

  /* 헤더 */
  .phead{display:flex;align-items:center;gap:6px;margin:0 -8px 20px;}
  .pback{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:10px;color:var(--tx);}
  .pback:hover{background:var(--hover);}
  .ptitle{font-size:18px;font-weight:700;letter-spacing:-0.02em;}
  .hint{font-size:13px;color:var(--tx2);line-height:1.55;margin:-10px 0 24px;}

  /* 섹션 · 리스트 (카드 대신) */
  .sec{margin-top:32px;}
  .sec-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin-bottom:6px;}
  .sec-h .meta{font-size:12.5px;font-weight:500;color:var(--tx3);}
  .sec-h .r{margin-left:auto;}
  .row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
  .row:last-child{border-bottom:0;}
  .row .k{width:68px;flex-shrink:0;font-size:13px;color:var(--tx3);}
  .row .v{flex:1;font-size:14px;font-weight:500;line-height:1.5;}
  .row .v small{display:block;font-size:12.5px;color:var(--tx3);font-weight:400;margin-top:2px;}
  .note{font-size:12.5px;color:var(--tx3);line-height:1.55;margin-top:10px;display:flex;gap:6px;}
  .note .ico{width:14px;height:14px;margin-top:2px;}
  .divider{height:8px;background:var(--bg-sub);margin:28px -20px 0;}

  /* 상태 (점 + 텍스트) */
  .st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--tx3);white-space:nowrap;}
  .st::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
  .st.pri{color:var(--pri);} .st.ok{color:var(--ok);} .st.warn{color:var(--warn);} .st.err{color:var(--err);} .st.mute{color:var(--tx2);}

  .btn{width:100%;height:52px;border-radius:12px;font-size:15.5px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--pri);color:#fff;transition:.12s;}
  .btn:hover{background:var(--pri-h);}
  .btn:disabled{background:#C7D5F2;cursor:default;}
  .btn.ghost{background:var(--bg-sub);color:var(--tx);}
  .btn.ghost:hover{background:var(--hover);}
  .btn.danger{background:var(--err);}
  .btn.sm{height:46px;font-size:14.5px;}
  .btns{display:flex;gap:8px;}
  .txtbtn{font-size:13px;font-weight:600;color:var(--tx2);display:inline-flex;align-items:center;gap:4px;}

  /* 로그인 */
  .login{padding:24px 24px 26px;min-height:100%;display:flex;flex-direction:column;}
  .brand{margin-bottom:44px;}
  .brand .logo-svg{height:24px;width:auto;display:block;}
  .appbar{display:flex;align-items:center;height:44px;margin:0 0 14px;}
  .appbar .logo-sym{height:22px;width:auto;display:block;}
  .doc-tag .logo-sym{height:12px;width:auto;display:inline-block;vertical-align:-1px;margin-right:5px;}

  .lg-h{font-size:24px;font-weight:700;letter-spacing:-0.025em;line-height:1.4;margin-bottom:10px;}
  .lg-s{font-size:14px;color:var(--tx2);margin-bottom:32px;line-height:1.55;}
  .steps{font-size:12.5px;font-weight:600;color:var(--pri);margin-bottom:10px;}
  .steps span{color:var(--tx3);font-weight:500;}
  .fl{font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:8px;display:block;}
  .inp{width:100%;height:52px;background:var(--bg-sub);border:1.5px solid transparent;border-radius:12px;padding:0 16px;font-size:16px;font-weight:600;outline:none;transition:.12s;margin-bottom:6px;}
  .inp::placeholder{color:var(--tx3);font-weight:500;}
  .inp:focus{border-color:var(--pri);background:#fff;}
  .inp.err{border-color:var(--err);background:#fff;}
  .ferr{font-size:12.5px;color:var(--err);min-height:18px;margin-bottom:12px;}
  .pin{display:flex;gap:10px;margin-bottom:6px;}
  .pin input{flex:1;min-width:0;height:62px;text-align:center;font-size:24px;font-weight:700;background:var(--bg-sub);border:1.5px solid transparent;border-radius:12px;outline:none;}
  .pin input:focus{border-color:var(--pri);background:#fff;}
  .phone-mask{font-size:14px;color:var(--tx2);margin-bottom:22px;}
  .phone-mask b{color:var(--tx);letter-spacing:.03em;font-weight:600;}
  .lg-foot{margin-top:auto;padding-top:22px;}
  .lg-help{font-size:12.5px;color:var(--tx3);text-align:center;margin-top:16px;line-height:1.6;}
  .lg-help a{color:var(--tx2);font-weight:600;text-decoration:underline;cursor:pointer;}

  /* 홈 */
  .top{margin-bottom:28px;}
  .top .org{font-size:13px;color:var(--tx3);font-weight:500;margin-bottom:4px;}
  .top .job{font-size:15px;font-weight:600;letter-spacing:-0.02em;line-height:1.45;color:var(--tx2);}
  .palarm{margin-left:auto;width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;color:var(--tx2);margin-right:-8px;}
  .palarm:hover{background:var(--hover);}
  .palarm .nd{position:absolute;top:9px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--pri);}
  .hero .hi{font-size:14px;color:var(--tx2);margin-bottom:6px;}
  .hero .big{font-size:26px;font-weight:700;letter-spacing:-0.03em;line-height:1.35;}
  .hero .big em{font-style:normal;color:var(--pri);}
  .facts{display:flex;margin-top:22px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
  .fact{flex:1;}
  .fact+.fact{padding-left:16px;border-left:1px solid var(--line);margin-left:16px;}
  .fact span{display:block;font-size:12px;color:var(--tx3);margin-bottom:3px;}
  .fact b{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;}

  .att{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
  .att button{height:60px;border-radius:12px;background:var(--bg-sub);border:1.5px solid transparent;font-size:14.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;transition:.12s;}
  .att button small{font-size:11.5px;font-weight:500;color:var(--tx3);}
  .att button.on{border-color:var(--pri);background:var(--pri-weak);color:var(--pri);}
  .att button.on small{color:var(--pri);}
  .att button:disabled{opacity:.45;cursor:default;}
  .att-state{margin-top:10px;font-size:12.5px;color:var(--tx3);}
  .absent{margin-top:10px;padding:14px 16px;border-radius:12px;background:var(--err-weak);}
  .absent b{font-size:14px;color:var(--err);display:block;margin-bottom:3px;}
  .absent p{font-size:12.5px;color:var(--tx2);line-height:1.55;}

  .li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:16px 0;border-bottom:1px solid var(--line);}
  .li:last-child{border-bottom:0;}
  .li .lb{flex:1;min-width:0;}
  .li .lt{font-size:15px;font-weight:600;margin-bottom:2px;}
  .li .ls{font-size:12.5px;color:var(--tx3);}
  .li .chev{color:var(--tx3);}
  .li.off .lt{color:var(--tx3);}
  .li.off{cursor:default;}
  .foot{display:flex;justify-content:space-between;align-items:center;margin-top:32px;font-size:12px;color:var(--tx3);}
  .foot button{color:var(--tx2);font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px;}

  /* 안내 */
  .map{height:150px;border-radius:12px;overflow:hidden;margin:10px 0 4px;position:relative;background:#EEF1F5;}
  .map svg{width:100%;height:100%;display:block;}
  .map .mbtn{position:absolute;right:10px;bottom:10px;height:30px;padding:0 10px;border-radius:8px;background:#fff;font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px;box-shadow:0 1px 3px rgba(22,22,29,.12);}
  .copy{font-size:12px;font-weight:600;color:var(--pri);margin-left:8px;}
  .chk{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;width:100%;text-align:left;}
  .chk:last-of-type{border-bottom:0;}
  .cbox{width:22px;height:22px;border:1.6px solid var(--line2);border-radius:6px;flex-shrink:0;position:relative;transition:.12s;}
  .chk.on .cbox{background:var(--pri);border-color:var(--pri);}
  .chk.on .cbox::after{content:"";position:absolute;width:10px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);top:5px;left:4.5px;}
  .chk .ct{flex:1;font-weight:500;} .chk .ct small{display:block;font-size:12.5px;color:var(--tx3);font-weight:400;}
  .chk.on .ct{color:var(--tx3);}
  .req{font-size:11.5px;font-weight:600;color:var(--err);margin-left:5px;}
  .prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:6px 0 4px;}
  .prog i{display:block;height:100%;background:var(--pri);border-radius:2px;transition:.25s;}
  .tl{position:relative;padding:8px 0 0 22px;}
  .tl::before{content:'';position:absolute;left:5px;top:16px;bottom:8px;width:1.5px;background:var(--line2);}
  .tli{position:relative;padding-bottom:16px;}
  .tli:last-child{padding-bottom:0;}
  .tli::before{content:'';position:absolute;left:-21px;top:5px;width:9px;height:9px;border-radius:50%;background:#fff;border:1.5px solid var(--tx3);}
  .tli.on::before{border-color:var(--pri);background:var(--pri);}
  .tli b{font-size:14px;font-weight:600;display:block;} .tli span{font-size:12.5px;color:var(--tx3);}
  .rule{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:13.5px;line-height:1.55;}
  .rule:last-child{border-bottom:0;}
  .rule .n{width:16px;flex-shrink:0;font-size:13px;font-weight:700;color:var(--tx3);}

  /* QR */
  .qr-wrap{text-align:center;padding:8px 0 4px;}
  .qr-top{font-size:13px;color:var(--tx3);margin-bottom:14px;display:flex;justify-content:center;gap:10px;align-items:center;}
  .qr-box{width:212px;height:212px;margin:0 auto 18px;padding:12px;border-radius:16px;border:1px solid var(--line2);background:#fff;position:relative;}
  .qr-box svg{width:100%;height:100%;display:block;}
  .qr-box.done>svg{opacity:.08;}
  .qr-done{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;}
  .qr-done .ok{width:52px;height:52px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;}
  .qr-done .ok .ico{width:26px;height:26px;stroke-width:2.6;}
  .qr-done b{font-size:14px;color:var(--pri);}
  .qr-num{font-size:26px;font-weight:700;letter-spacing:.01em;font-variant-numeric:tabular-nums;}
  .qr-sub{font-size:13px;color:var(--tx2);margin-top:2px;}
  .qr-timer{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:12px;color:var(--tx3);}
  .qr-timer .ring{width:14px;height:14px;}
  .locker{display:flex;align-items:center;gap:16px;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:24px;}
  .locker .ln{font-size:32px;font-weight:700;color:var(--pri);letter-spacing:-0.03em;min-width:44px;}
  .locker b{font-size:14px;display:block;} .locker span{font-size:12.5px;color:var(--tx3);}
  .wait{text-align:center;padding:56px 12px 40px;}
  .wait .wi{color:var(--tx3);display:flex;justify-content:center;margin-bottom:14px;}
  .wait .wi .ico{width:28px;height:28px;}
  .wait b{font-size:17px;display:block;margin-bottom:6px;letter-spacing:-0.02em;}
  .wait p{font-size:13.5px;color:var(--tx2);line-height:1.6;}
  .wait .when{display:inline-block;margin-top:14px;font-size:13px;font-weight:600;color:var(--pri);}

  /* 결과 */
  .res{padding:28px 0 8px;}
  .res .rl{font-size:13.5px;color:var(--tx3);margin-bottom:6px;}
  .res .rs{font-size:28px;font-weight:700;letter-spacing:-0.03em;line-height:1.3;}
  .res .rs em{font-style:normal;color:var(--pri);}
  .res .rsub{font-size:14px;color:var(--tx2);margin-top:10px;line-height:1.6;}

  /* 만료 */
  .expired{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 30px;text-align:center;}
  .expired .wi{color:var(--tx3);margin-bottom:16px;}
  .expired b{font-size:19px;margin-bottom:8px;letter-spacing:-0.02em;}
  .expired p{font-size:13.5px;color:var(--tx2);line-height:1.6;margin-bottom:22px;}

  /* 시트 / 얼럿 */
  .dim{position:absolute;inset:0;background:rgba(22,24,32,.4);z-index:20;display:flex;align-items:flex-end;animation:fade .15s;}
  .dim.center{align-items:center;justify-content:center;padding:0 26px;}
  @keyframes fade{from{opacity:0}}
  .sheet{width:100%;background:#fff;border-radius:22px 22px 0 0;padding:10px 22px 26px;animation:up .22s ease;max-height:80%;overflow-y:auto;}
  @keyframes up{from{transform:translateY(40px);opacity:.5}}
  .sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 18px;}
  .sheet h3{font-size:18px;font-weight:700;margin-bottom:6px;letter-spacing:-0.02em;}
  .sheet .sp{font-size:13.5px;color:var(--tx2);margin-bottom:18px;line-height:1.55;}
  .alert{width:100%;background:#fff;border-radius:18px;padding:26px 22px 18px;text-align:center;animation:pop .18s ease;}
  @keyframes pop{from{transform:scale(.95);opacity:0}}
  .alert b{font-size:17px;display:block;margin-bottom:8px;letter-spacing:-0.02em;}
  .alert p{font-size:13.5px;color:var(--tx2);line-height:1.6;margin-bottom:22px;}
  .reasons{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
  .reasons button{height:36px;padding:0 14px;border-radius:18px;background:var(--bg-sub);font-size:13px;font-weight:600;color:var(--tx2);border:1.5px solid transparent;}
  .reasons button.on{border-color:var(--pri);background:var(--pri-weak);color:var(--pri);}
  .noti{padding:14px 0;border-bottom:1px solid var(--line);}
  .noti:last-of-type{border-bottom:0;}
  .noti .nh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:3px;}
  .noti b{font-size:14px;font-weight:600;} .noti p{font-size:13px;color:var(--tx2);line-height:1.5;} .noti .nm{font-size:11.5px;color:var(--tx3);white-space:nowrap;margin-left:8px;}
  .noti .fail{color:var(--err);}

  .toast{position:absolute;left:50%;top:58px;transform:translateX(-50%);background:rgba(31,33,40,.94);color:#fff;font-size:13px;font-weight:500;padding:11px 16px;border-radius:12px;z-index:40;white-space:nowrap;display:flex;align-items:center;gap:7px;animation:up .2s;}
  .toast .ico{width:15px;height:15px;}

/* ===== v8 테마 · 박스 없이 타이포·여백·구분선으로 위계 · 클린 화이트 + 비비드 블루 1색 + 레드(문제만) ===== */
:root{
  --pri:#1F6BFF;--pri-h:#1557E6;--pri-weak:#EBF2FF;--pri-line:#C7DAFF;--sky:#8DB4FF;--navy:#191F28;
  --tx:#191F28;--tx2:#4E5968;--tx3:#8B95A1;--line:#EEF0F3;--line2:#E2E5EA;
  --bg:#FFFFFF;--canvas:#F4F5F7;--bg-sub:#F7F8FA;--hover:#F2F4F6;
  --ok:#1F6BFF;--ok-weak:#EBF2FF;--warn:#4E5968;--warn-weak:#F2F4F6;--err:#F04452;--err-weak:#FFEEEF;
  --card-sh:0 1px 2px rgba(25,31,40,.04),0 4px 16px rgba(25,31,40,.05);
}
body{color:var(--tx);}
.st{padding:3px 10px 3px 8px;border-radius:999px;background:#F2F4F6;color:var(--tx2);font-weight:600;line-height:1.45;}
.st::before{background:currentColor;}
.st.pri,.st.ok{background:var(--pri-weak);color:var(--pri);}
.st.warn{background:#F2F4F6;color:var(--tx);}
.st.err{background:var(--err-weak);color:var(--err);}

function qrSvg(seed){
  const N=25;let s=0;for(const c of seed)s=(s*31+c.charCodeAt(0))>>>0;
  const rnd=()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};
  const inF=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  let r='';for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(inF(x,y))continue;if(rnd()<.48)r+=`<rect x="${x}" y="${y}" width="1.02" height="1.02"/>`;}
  const f=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" rx="1.2"/><rect x="${x+1}" y="${y+1}" width="5" height="5" rx=".8" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" rx=".5"/>`;
  return `<svg viewBox="0 0 ${N} ${N}" shape-rendering="crispEdges"><g fill="#0F1E45">${r}${f(0,0)}${f(N-7,0)}${f(0,N-7)}</g></svg>`;
}
function pgQR(){
  if(absent())return `<div class="page">${head('출석 QR')}<div class="wait"><div class="wi">${ic('lock',28)}</div><b>불참 처리된 지원자예요</b><p>QR을 사용할 수 없어요</p></div></div>`;
  if(!isDay())return `<div class="page">${head('출석 QR')}<div class="wait"><div class="wi">${ic('lock',28)}</div><b>${S.stage==='before'?'QR은 면접 당일에만 열려요':'QR 사용 기간이 끝났어요'}</b><p>${S.stage==='before'?'개인정보 보호를 위해 면접 당일<br>00시부터 QR을 보여드려요':'면접일이 지나 QR이 만료됐어요'}</p>${S.stage==='before'?`<span class="when">${JOB.date} (${JOB.dow}) 공개</span>`:''}</div></div>`;
  return `<div class="page">${head('출석 QR')}
    <div class="hint">${S.checked?'접수가 끝났어요. 보관번호를 확인해 주세요':'접수처에서 신분증과 함께 아래 QR을 보여주세요'}</div>
    <div class="qr-wrap">
      <div class="qr-top"><span>${JOB.org}</span>${S.checked?'<span class="st ok">접수 완료</span>':'<span class="st pri">사용 가능</span>'}</div>
      <div class="qr-box ${S.checked?'done':''}" id="qrBox">${qrSvg(ME.no+'|'+qrTick)}${S.checked?`<div class="qr-done"><span class="ok">${ic('check',26)}</span><b>${S.checkAt} 접수</b></div>`:''}</div>
      <div class="qr-num">${ME.no}</div>
      <div class="qr-sub">수험번호 · ${ME.field} · ${ME.name}</div>
      ${S.checked?'':`<div class="qr-timer"><svg class="ring" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="none" stroke="#E1E3E8" stroke-width="3"/><circle id="ringFg" cx="10" cy="10" r="8" fill="none" stroke="#2466E0" stroke-width="3" stroke-dasharray="50.3" stroke-dashoffset="${50.3*(1-qrLeft/30)}" transform="rotate(-90 10 10)" stroke-linecap="round"/></svg><span id="qrLeft">${qrLeft}</span>초 후 자동 갱신 · 캡처한 QR은 사용 불가</div>`}
    </div>
    ${S.checked?`<div class="locker"><span class="ln">${S.locker}</span><div><b>전자기기 보관번호</b><span>퇴실할 때 이 번호로 휴대폰을 돌려받아요</span></div></div>`:''}
    <div class="sec">
      <div class="row"><span class="k">상태</span><span class="v">${S.checked?'<span class="st ok">접수</span>':'<span class="st">접수 예정</span>'}</span></div>
      <div class="row"><span class="k">도착 시간</span><span class="v">${JOB.arrive}</span></div>
      <div class="row"><span class="k">장소</span><span class="v">${S.checked?'본관 3층 대기실로 이동해 주세요':JOB.place}</span></div>
      <div class="row"><span class="k">사용일</span><span class="v">${JOB.date} 면접 당일에만 사용</span></div>
    </div>
    ${S.checked?'':`<div class="note">${ic('sun',14)}화면 밝기를 높이면 더 빨리 인식돼요</div>`}
  </div>`;
}

/* 결과 */
function pgResult(){
  const pass=released()&&!absent();
  return `<div class="page">${head('면접 결과')}
    <div class="hint">${JOB.org} · ${JOB.title} ${JOB.round}</div>
    ${absent()?`<div class="wait"><b>불참 처리로 결과가 없어요</b><p>다음 전형 안내는 채용 공고를 확인해 주세요</p></div>`
    :pass?`<div class="res"><div class="rl">${JOB.round} 결과</div><div class="rs"><em>합격</em>을 축하해요</div><div class="rsub">최종 전형 일정은 별도 안내 문자로<br>보내드릴 예정이에요</div></div>`
    :`<div class="wait"><div class="wi">${ic('clock',28)}</div><b>아직 발표 전이에요</b><p>결과는 이 페이지와 알림톡으로 알려드려요</p><span class="when">${JOB.resultAt} 공개</span></div>`}
    <div class="sec">
      <div class="sec-h">전형 진행</div>
      <div class="row"><span class="k">서류</span><span class="v"><span class="st ok">합격</span></span></div>
      <div class="row"><span class="k">${JOB.round}</span><span class="v">${absent()?'<span class="st">불참</span>':pass?'<span class="st ok">합격</span>':S.stage==='before'?'<span class="st">예정</span>':'<span class="st warn">결과 대기</span>'}</span></div>
      <div class="row"><span class="k">최종</span><span class="v"><span class="st">${pass?'안내 예정':'예정'}</span></span></div>
    </div>
    <div class="note">지원자 페이지는 ${JOB.expireAt}까지 열람할 수 있어요</div>
  </div>`;
}

/* 렌더 */
function render(){
  const st=STAGES[S.stage];$('#sbTime').textContent=st.time;
  document.querySelectorAll('#stageSeg button').forEach(b=>b.classList.toggle('on',b.dataset.st===S.stage));
  $('#scanBtn').disabled=!(S.auth&&isDay()&&!S.checked&&!absent());
  closeOv();
  let h;
  if(S.stage==='expired')h=pgExpired();
  else if(!S.auth)h=pgLogin();
  else h={home:pgHome,info:pgInfo,qr:pgQR,result:pgResult}[S.page]();
  main.innerHTML=h;
  bindPin();
  clearInterval(qrTimer);
  if(S.auth&&S.page==='qr'&&isDay()&&!S.checked&&!absent()){
    qrTimer=setInterval(()=>{qrLeft--;if(qrLeft<=0){qrLeft=30;qrTick++;const b=$('#qrBox');if(b)b.innerHTML=qrSvg(ME.no+'|'+qrTick);}
      const l=$('#qrLeft');if(l)l.textContent=qrLeft;const r=$('#ringFg');if(r)r.setAttribute('stroke-dashoffset',(50.3*(1-qrLeft/30)).toFixed(1));},1000);
  }
}
function go(p){S.page=p;render();main.scrollTop=0;}
function bindPin(){
  const ins=[...document.querySelectorAll('#pin input')];
  ins.forEach((el,i)=>{
    el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(-1);if(el.value&&ins[i+1])ins[i+1].focus();if(ins.every(x=>x.value))doLogin2();});
    el.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!el.value&&ins[i-1])ins[i-1].focus();});
  });
  if(ins[0])setTimeout(()=>ins[0].focus(),50);
}
function doLogin2(){
  const v=[...document.querySelectorAll('#pin input')].map(x=>x.value).join('');
  if(v.length<4){S.err={pin:'4자리를 모두 입력해 주세요'};render();return;}
  if(v!==ME.last4){S.err={pin:'등록된 번호와 일치하지 않아요'};render();return;}
  S.err={};S.auth=1;S.page='home';render();toast(`${ME.name}님, 반가워요`);
}

/* 이벤트 */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;
  switch(a){
    case 'fill':
      if(S.step===1){$('#inNo').value=ME.no;$('#inBirth').value=ME.birth;}
      else{document.querySelectorAll('#pin input').forEach((x,i)=>x.value=ME.last4[i]);doLogin2();}
      break;
    case 'login1':{
      const no=$('#inNo').value.trim(),b=$('#inBirth').value.trim();S.err={};
      if(!/^[A-Za-z]-\d{3}$/.test(no))S.err.no='수험번호 형식을 확인해 주세요 (예: A-041)';
      else if(no!==ME.no)S.err.no='일치하는 수험번호가 없어요';
      if(!/^\d{8}$/.test(b))S.err.birth='생년월일 8자리를 입력해 주세요';
      else if(!S.err.no&&b!==ME.birth)S.err.birth='생년월일이 일치하지 않아요';
      if(Object.keys(S.err).length){render();$('#inNo').value=no;$('#inBirth').value=b;return;}
      S.step=2;render();break;}
    case 'login2':doLogin2();break;
    case 'loginBack':S.step=1;S.err={};render();break;
    case 'logout':S.auth=0;S.step=1;S.page='home';render();toast('로그아웃했어요');break;
    case 'home':go('home');break;
    case 'go':go(t.dataset.p);break;
    case 'qrLocked':toast(S.stage==='before'?'QR은 면접 당일에만 열려요':'면접일이 지나 QR이 만료됐어요','lock');break;
    case 'attYes':S.att='yes';render();toast('참석으로 응답했어요');break;
    case 'attNo':
      overlay(`<div class="sheet"><div class="grab"></div><h3>참석이 어려우신가요?</h3><div class="sp">사유를 선택해 주세요. 채용 담당자에게만 전달돼요 (선택)</div>
        <div class="reasons">${['개인 일정','타 기업 입사','건강 문제','기타'].map(r=>`<button data-act="reason" data-r="${r}" class="${S.absentReason===r?'on':''}">${r}</button>`).join('')}</div>
        <div class="btns"><button class="btn ghost sm" data-act="closeOv">취소</button><button class="btn danger sm" data-act="absentAsk">불참하기</button></div></div>`);break;
    case 'reason':S.absentReason=S.absentReason===t.dataset.r?null:t.dataset.r;document.querySelectorAll('.reasons button').forEach(b=>b.classList.toggle('on',b.dataset.r===S.absentReason));break;
    case 'absentAsk':
      overlay(`<div class="alert"><b>정말 불참하시겠어요?</b><p>이후에는 번복이 어려울 수 있어요.<br>불참 확정 시 출석 QR도 사용할 수 없어요.</p>
        <div class="btns"><button class="btn ghost sm" data-act="closeOv">돌아가기</button><button class="btn danger sm" data-act="absentOk">불참 확정</button></div></div>`,true);break;
    case 'absentOk':S.att='no';render();toast('불참이 확정됐어요','info');break;
    case 'closeOv':closeOv();break;
    case 'noti':
      overlay(`<div class="sheet"><div class="grab"></div><h3>받은 안내</h3><div class="sp">알림톡 우선 발송 · 실패 시 문자로 보내드려요</div>
        ${released()?`<div class="noti"><div class="nh"><b>${JOB.round} 결과 발표</b><span class="nm">06.12 18:00 · 알림톡</span></div><p>결과가 발표됐어요. 지원자 페이지에서 확인해 주세요.</p></div>`:''}
        ${S.stage!=='before'?`<div class="noti"><div class="nh"><b>오늘 면접 안내</b><span class="nm">${MD(0)} 07:00 · 알림톡</span></div><p>${JOB.arrive}까지 ${JOB.place}로 와 주세요. 신분증 필수.</p></div>`:''}
        <div class="noti"><div class="nh"><b>면접 안내 (재발송)</b><span class="nm">${MD(-7)} 10:02 · 문자</span></div><p>알림톡 수신이 안 돼 문자로 다시 보내드려요.</p></div>
        <div class="noti"><div class="nh"><b>${JOB.round} 안내</b><span class="nm fail">05.27 10:00 · 알림톡 실패</span></div><p>도착 시간 ${MD(0)} (${JOB.dow}) ${JOB.arrive} · 장소·준비물은 지원자 페이지에서 확인</p></div>
        <button class="btn ghost sm" style="margin-top:16px" data-act="closeOv">닫기</button></div>`);break;
    case 'item':S.items[t.dataset.k]=!S.items[t.dataset.k];{const y=main.scrollTop;render();main.scrollTop=y;}break;
    case 'copy':try{navigator.clipboard.writeText(JOB.addr);}catch(_){}toast('주소를 복사했어요');break;
    case 'map':toast('지도 앱으로 연결해요','nav');break;
    case 'call':toast(`${JOB.contact}로 연결해요`,'phone');break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!S.auth){S.step===1?document.querySelector('[data-act="login1"]').click():doLogin2();}});

/* 데모 컨트롤 */
document.querySelectorAll('#stageSeg button').forEach(b=>b.addEventListener('click',()=>{
  S.stage=b.dataset.st;
  if(S.page==='qr'&&!isDay())S.page='home';render();
}));
$('#scanBtn').addEventListener('click',()=>{
  if(!isDay()||S.checked||absent())return;
  S.checked=true;S.checkAt='08:3'+(5+Math.floor(Math.random()*4));S.locker=17;render();toast('접수 완료 · 보관번호 17번');
});
$('#resetBtn').addEventListener('click',()=>{Object.assign(S,{auth:0,stage:'before',page:'home',att:null,absentReason:null,checked:false,checkAt:null,locker:null,items:{id:false,no:false,dev:false,pen:false},step:1,err:{}});qrLeft=30;render();});

render();
</script>
</body>
</html>
