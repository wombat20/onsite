<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONSITE · 마스터 관리자</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22512%22%20height%3D%22512%22%20viewBox%3D%220%200%20512.00%20512.00%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22139%22%20fill%3D%22%232466E0%22%2F%3E%3Cg%20transform%3D%22translate%28256%20256%29%20scale%281.75%29%20translate%28-88.3%20-80%29%22%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2280%22%20r%3D%2240%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2234%22%2F%3E%3Cpath%20d%3D%22M88.3%2051.7%20L143.9%20107.3%20Q156.6%20120%20156.6%20102%20L156.6%2040%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2234%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="fonts/wanted-sans/WantedSansVariable.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --pri:#2466E0;--pri-h:#1D56C4;--pri-weak:#EEF3FE;--pri-line:#C9D8F7;--navy:#0F1E45;--sky:#7FA6F0;
  --tx:#0F1E45;--tx2:#5A6684;--tx3:#98A2B8;--line:#ECEEF3;--line2:#DFE3EB;
  --bg:#FFFFFF;--bg-sub:#F5F7FB;--hover:#EEF1F7;
  --ok:#1F9254;--warn:#B8740F;--err:#E5383B;--err-weak:#FDF1F1;--warn-weak:#FDF6EA;--ok-weak:#EAF6EF;
  --r:10px;--r-sm:6px;--sh-pop:0 12px 32px -8px rgba(15,30,69,.18),0 2px 6px rgba(15,30,69,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:"Wanted Sans Variable","Wanted Sans",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5;color:var(--tx);background:#fff;letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit;}
button{cursor:pointer;background:none;border:0;}
svg.i{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
svg.i.s14{width:14px;height:14px;}

/* 레이아웃 */
.app{display:flex;min-height:100vh;}
.nav{width:240px;flex-shrink:0;background:var(--bg-sub);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.nav-logo{height:60px;display:flex;align-items:center;padding:0 20px;}
.nav-logo .logo-svg{height:26px;width:auto;display:block;}
.nav-body{flex:1;padding:4px 10px 12px;overflow-y:auto;}
.nav-back{width:100%;display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border-radius:6px;font-size:13px;color:var(--tx3);margin-bottom:6px;}
.nav-back:hover{background:var(--hover);color:var(--tx);}
.nav-job{padding:6px 10px 14px;}
.nav-job .o{font-size:11.5px;color:var(--tx3);display:block;margin-bottom:2px;}
.nav-job .n{font-size:13px;font-weight:600;line-height:1.4;display:block;}
.nav-job .m{font-size:11.5px;color:var(--tx2);margin-top:4px;display:block;}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--tx2);margin-bottom:1px;text-align:left;}
.nav-item:hover{background:var(--hover);color:var(--tx);}
.nav-item.on{background:var(--pri-weak);color:var(--pri);font-weight:600;}
.nav-item .tail{margin-left:auto;font-size:12px;color:var(--tx3);font-weight:500;display:flex;}
.nav-item.on .tail{color:var(--pri);}
.nav-sub{width:100%;text-align:left;height:30px;padding:0 10px 0 36px;border-radius:6px;font-size:13px;color:var(--tx2);}
.nav-sub:hover{background:var(--hover);color:var(--tx);}
.nav-sub.on{color:var(--tx);font-weight:600;}
.nav-foot{border-top:1px solid var(--line);padding:12px 10px;}
.me{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:6px;cursor:pointer;}
.me:hover{background:var(--hover);}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--line);color:var(--tx2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:700;}
.me .nm{font-size:13px;font-weight:600;} .me .rl{font-size:11.5px;color:var(--tx3);}

.main{flex:1;min-width:0;padding:36px 40px 80px;max-width:1480px;}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px;}
.phead h1{font-size:24px;font-weight:700;letter-spacing:-0.025em;line-height:1.3;margin-bottom:6px;}
.phead p{font-size:13.5px;color:var(--tx2);}
.phead .pr{display:flex;gap:8px;align-items:center;flex-shrink:0;}

/* 섹션 */
.sec{margin-top:40px;}
.sec:first-child{margin-top:0;}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:32px;}
.sec-h h2{font-size:15px;font-weight:700;letter-spacing:-0.015em;}
.sec-h .meta{font-size:12.5px;color:var(--tx3);}
.sp{flex:1;}
.cols{display:grid;gap:44px;align-items:start;}
.muted{color:var(--tx2);} .faint{color:var(--tx3);} .strong{font-weight:600;} .num{font-variant-numeric:tabular-nums;}
.note{font-size:12px;color:var(--tx3);margin-top:10px;line-height:1.55;}
.row{display:flex;align-items:center;gap:8px;}
.mt8{margin-top:8px;}.mt12{margin-top:12px;}.mt16{margin-top:16px;}.mt24{margin-top:24px;}.mb12{margin-bottom:12px;}.mb16{margin-bottom:16px;}

/* 숫자 요약 */
.kpis{display:flex;margin-bottom:36px;flex-wrap:wrap;row-gap:16px;}
.kpi{padding:0 32px;border-left:1px solid var(--line);}
.kpi:first-child{padding-left:0;border-left:0;}
.kpi .lb{font-size:12.5px;color:var(--tx3);margin-bottom:4px;}
.kpi .vl{font-size:24px;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1.2;}
.kpi .vl small{font-size:13px;color:var(--tx3);font-weight:500;margin-left:3px;}
.kpi .vl.err{color:var(--err);} .kpi .vl.warn{color:var(--warn);}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:6px;font-size:13px;font-weight:600;border:1px solid var(--line2);background:#fff;color:var(--tx);white-space:nowrap;transition:background .12s;}
.btn:hover{background:var(--hover);}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;}
.btn.pri:hover{background:var(--pri-h);}
.btn.ghost{border-color:transparent;background:none;color:var(--tx2);}
.btn.ghost:hover{background:var(--hover);color:var(--tx);}
.btn.danger{color:var(--err);}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;}
.btn.xs{height:26px;padding:0 9px;font-size:12px;font-weight:500;}
.btn.block{width:100%;height:40px;}
.btn[disabled]{opacity:.4;pointer-events:none;}

/* 상태 */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--tx2);white-space:nowrap;}
.st::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--tx3);flex-shrink:0;}
.st.pri{color:var(--pri);} .st.pri::before{background:var(--pri);}
.st.ok{color:var(--ok);} .st.ok::before{background:var(--ok);}
.st.warn{color:var(--warn);} .st.warn::before{background:var(--warn);}
.st.err{color:var(--err);} .st.err::before{background:var(--err);}
.st.off{color:var(--tx3);}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:5px;background:var(--bg-sub);color:var(--tx2);border:1px solid var(--line);white-space:nowrap;}
.tag.pri{background:var(--pri-weak);color:var(--pri);border-color:var(--pri-line);}
.tag.ai{background:var(--pri-weak);color:var(--pri);border-color:transparent;}

/* 입력 */
.input,.textarea,.select{width:100%;border:1px solid var(--line2);border-radius:6px;background:#fff;padding:0 10px;height:34px;font-size:13px;outline:none;transition:.12s;}
.textarea{height:auto;min-height:80px;padding:9px 10px;resize:vertical;line-height:1.55;}
.input:focus,.textarea:focus,.select:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(36,102,224,.12);}
.input[disabled],.select[disabled],.textarea[disabled]{background:var(--bg-sub);color:var(--tx2);}
.input.sm,.select.sm{height:28px;font-size:12.5px;padding:0 8px;}
.input.err{border-color:var(--err);}
.field{margin-bottom:14px;} .field label{display:block;font-size:12.5px;color:var(--tx2);margin-bottom:6px;font-weight:500;}
.field .hint{font-size:11.5px;color:var(--tx3);margin-top:4px;}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;}
.search{position:relative;} .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx3);} .search .input{padding-left:32px;height:32px;font-size:12.5px;background:var(--bg-sub);border-color:transparent;}
.search .input:focus{background:#fff;}
.chk{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;}
.chk input{width:16px;height:16px;accent-color:var(--pri);cursor:pointer;}
.tg{width:36px;height:20px;border-radius:10px;background:var(--line2);position:relative;transition:.2s;flex-shrink:0;}
.tg::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.2s;}
.tg.on{background:var(--pri);} .tg.on::after{left:18px;}

/* 표 */
table{width:100%;border-collapse:collapse;}
.tbl{border-top:1px solid var(--line2);}
.tbl th{text-align:left;font-size:12px;font-weight:500;color:var(--tx3);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
.tbl td{font-size:13px;padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}
.tbl th:first-child,.tbl td:first-child{padding-left:4px;}
.tbl tbody tr.click{cursor:pointer;} .tbl tbody tr.click:hover td{background:var(--bg-sub);}
.tbl tbody tr.sel td{background:var(--pri-weak);}
.tbl tr.bad td{background:var(--err-weak);}
.tbl tr.block td{background:var(--bg-sub);color:var(--tx3);font-size:12.5px;padding-top:7px;padding-bottom:7px;}
.tbl tr.now td{background:#F7FAFF;}
.tbl tr.now td:first-child{box-shadow:inset 3px 0 0 var(--pri);}
.tbl tr.gsep td{border-top:1px solid var(--line2);}
.tbl td.r,.tbl th.r{text-align:right;} .tbl td.c,.tbl th.c{text-align:center;}
.tbl-wrap{overflow-x:auto;}
.board td,.board th{white-space:nowrap;padding-left:8px;padding-right:8px;}
.tbl td[rowspan]{vertical-align:top;padding-top:13px;}

/* 콜아웃 */
.callout{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:8px;font-size:13px;background:var(--bg-sub);color:var(--tx2);margin-bottom:20px;}
.callout b{color:var(--tx);font-weight:600;}
.callout.pri{background:var(--pri-weak);color:var(--pri);} .callout.pri b{color:var(--pri);}
.callout.warn{background:var(--warn-weak);color:var(--warn);} .callout.warn b{color:var(--warn);}
.callout.err{background:var(--err-weak);color:var(--err);} .callout.err b{color:var(--err);}
.callout.ok{background:var(--ok-weak);color:var(--ok);} .callout.ok b{color:var(--ok);}

/* 패널 */
.panel{border:1px solid var(--line2);border-radius:var(--r);padding:20px;background:#fff;}
.panel-h{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.panel-h h3{font-size:15px;font-weight:700;}
.sticky{position:sticky;top:24px;}

/* 탭·세그먼트 */
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:24px;}
.tab{padding:10px 0;font-size:13.5px;font-weight:500;color:var(--tx3);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px;}
.tab:hover{color:var(--tx);}
.tab.on{color:var(--tx);font-weight:600;border-bottom-color:var(--tx);}
.seg{display:inline-flex;background:var(--bg-sub);border-radius:7px;padding:2px;gap:2px;}
.seg button{height:26px;padding:0 11px;border-radius:5px;font-size:12.5px;font-weight:500;color:var(--tx2);}
.seg button.on{background:#fff;color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(15,30,69,.08);}

/* 준비 단계 진행선 */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:24px;margin-bottom:36px;}
.step{position:relative;text-align:left;padding-top:14px;}
.step .bar{position:absolute;top:0;left:0;right:0;height:3px;border-radius:2px;background:var(--line);}
.step.done .bar{background:var(--tx3);}
.step.on .bar{background:var(--pri);}
.step .t{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;}
.step .t b{font-size:14.5px;font-weight:700;}
.step.on .t b{color:var(--pri);}
.step .d{font-size:12.5px;color:var(--tx3);}
.step:hover .t b{text-decoration:underline;text-underline-offset:3px;}

/* 업로드 */
.drop{border:1px dashed var(--line2);border-radius:var(--r);background:var(--bg-sub);padding:28px 16px;text-align:center;cursor:pointer;transition:.12s;}
.drop:hover,.drop.over{border-color:var(--pri);background:var(--pri-weak);}
.drop b{display:block;font-size:13.5px;margin-bottom:3px;}
.drop span{font-size:12px;color:var(--tx3);}

/* 시간표 */
.rooms{display:grid;gap:28px;}
.room-h{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.room-h b{font-size:14px;}
.sess-t{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
.sess-t small{font-weight:500;color:var(--tx3);margin-left:4px;}
.dly{font-size:11.5px;font-weight:700;color:var(--err);margin-left:4px;}
.shr{font-size:11.5px;font-weight:700;color:var(--ok);margin-left:4px;}
.hist{font-size:12.5px;}
.hist div{padding:7px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;}
.hist span{color:var(--tx3);white-space:nowrap;font-variant-numeric:tabular-nums;}

/* AI 초안 */
.drafts{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px;}
.draft{border:1px solid var(--line2);border-radius:var(--r);padding:14px 16px;text-align:left;background:#fff;}
.draft:hover{border-color:var(--pri-line);}
.draft.on{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri) inset;}
.draft b{font-size:13.5px;display:block;margin-bottom:4px;}
.draft p{font-size:12.5px;color:var(--tx2);line-height:1.5;}
.qedit{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line);}
.qedit .n{width:22px;font-size:12.5px;color:var(--tx3);padding-top:7px;font-weight:600;}
.qedit .textarea{min-height:36px;height:36px;padding:7px 10px;}

/* 마스킹 문서 */
.doc{border:1px solid var(--line2);border-radius:var(--r);padding:22px 24px;background:#fff;font-size:13.5px;line-height:1.75;}
.doc h5{font-size:12.5px;color:var(--tx3);font-weight:600;margin:16px 0 4px;}
.doc h5:first-child{margin-top:0;}
.mk{white-space:nowrap;display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--tx3);padding:0 7px;border-radius:4px;background:#EEF0F3;line-height:1.7;vertical-align:1px;}
.hl-miss{background:var(--warn-weak);color:var(--warn);border-radius:3px;padding:0 2px;font-weight:600;}

/* 발송 미리보기 */
.msg{background:var(--bg-sub);border-radius:12px;padding:16px 18px;font-size:13px;line-height:1.7;white-space:pre-line;}
.msg b{display:block;font-size:13.5px;margin-bottom:6px;}

/* 이슈 */
.iss{padding:12px 0;border-bottom:1px solid var(--line);}
.iss:last-child{border-bottom:0;}
.iss.open{border-left:3px solid var(--warn);padding-left:10px;}
.iss .t{font-size:13.5px;font-weight:600;margin-bottom:3px;}
.iss .m{font-size:12px;color:var(--tx3);display:flex;gap:8px;align-items:center;}
.conduct{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;}
.conduct .tm{width:44px;font-weight:700;font-variant-numeric:tabular-nums;}
.conduct.late .tm{color:var(--err);}
.conduct .tx{flex:1;}
.conduct.done .tx,.conduct.done .tm{color:var(--tx3);}

/* 점수 */
.ev-row{padding:16px 0;border-bottom:1px solid var(--line);}
.ev-row:first-child{padding-top:0;}
.ev-h{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.ev-h b{font-size:13.5px;}
.ev-sc{display:grid;gap:8px;}
.ev-sc div{background:var(--bg-sub);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--tx3);}
.ev-sc div b{display:block;font-size:14px;color:var(--tx);font-variant-numeric:tabular-nums;}
.ev-cm{font-size:13px;color:var(--tx2);margin-top:8px;}
.big-score{font-size:28px;font-weight:700;color:var(--pri);font-variant-numeric:tabular-nums;letter-spacing:-0.02em;}
.plist{display:flex;flex-direction:column;gap:1px;max-height:560px;overflow-y:auto;}
.prow{width:100%;text-align:left;padding:8px 10px;border-radius:6px;}
.prow:hover{background:var(--hover);}
.prow.on{background:var(--pri-weak);}
.prow .r1{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:13.5px;font-weight:600;}
.prow.on .r1{color:var(--pri);}
.prow .r2{font-size:12px;color:var(--tx3);display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;}

/* 캘린더 */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.cal-h b{font-size:14px;}
.cal-h button{width:26px;height:26px;border-radius:6px;background:var(--bg-sub);display:flex;align-items:center;justify-content:center;color:var(--tx2);}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;}
.cal .w{font-size:11.5px;color:var(--tx3);padding:2px 0;}
.cal button{aspect-ratio:1;border-radius:50%;font-size:12.5px;color:var(--tx2);position:relative;}
.cal button:hover{background:var(--hover);}
.cal button.has{color:var(--tx);font-weight:700;}
.cal button.has::after{content:'';position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--pri);}
.cal button.sel{box-shadow:inset 0 0 0 1.5px var(--pri);}
.cal button.today{background:var(--pri);color:#fff;font-weight:700;}
.cal button.today::after{background:#fff;}

/* 모달 */
.ov{position:fixed;inset:0;background:rgba(15,30,69,.36);display:flex;align-items:flex-start;justify-content:center;padding:56px 20px;z-index:60;overflow-y:auto;animation:fade .15s;}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:12px;width:100%;max-width:520px;box-shadow:var(--sh-pop);animation:up .18s;}
.modal.wide{max-width:780px;}
@keyframes up{from{transform:translateY(8px);opacity:0}}
.mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 4px;}
.mh b{font-size:16px;font-weight:700;}
.mh button{color:var(--tx3);width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;}
.mh button:hover{background:var(--hover);color:var(--tx);}
.mb{padding:14px 22px 20px;font-size:13.5px;line-height:1.6;}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:0 22px 20px;}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:13px;padding:11px 16px;border-radius:8px;display:flex;align-items:center;gap:8px;z-index:80;box-shadow:var(--sh-pop);animation:up .2s;max-width:80vw;}
.toast.red{background:var(--err);}

/* 보안 */
.secure{position:relative;-webkit-user-select:none;user-select:none;}
.secure.wm::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:var(--wm);z-index:2;}
body.shield .secure{filter:blur(9px);}
.shield-ov{display:none;position:fixed;inset:0;z-index:90;background:rgba(255,255,255,.6);backdrop-filter:blur(2px);align-items:center;justify-content:center;}
body.shield .shield-ov{display:flex;}
.shield-ov .box{background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:var(--sh-pop);padding:22px 26px;text-align:center;font-size:13px;color:var(--tx2);}
.shield-ov .box b{display:block;color:var(--tx);font-size:15px;margin-bottom:4px;}
@media print{.secure{visibility:hidden!important;}}
.kv{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px;gap:14px;}
.kv:first-child{border-top:1px solid var(--line2);}
.kv .k{color:var(--tx2);} .kv .k small{display:block;font-size:12px;color:var(--tx3);}
.empty{padding:36px 16px;text-align:center;color:var(--tx3);font-size:13px;border-top:1px solid var(--line2);}

/* ===== v8 테마 · 박스 없이 타이포·여백·구분선으로 위계 · 클린 화이트 + 비비드 블루 1색 + 레드(문제만) ===== */
:root{
  --pri:#1F6BFF;--pri-h:#1557E6;--pri-weak:#EBF2FF;--pri-line:#C7DAFF;--sky:#8DB4FF;--navy:#191F28;
  --tx:#191F28;--tx2:#4E5968;--tx3:#8B95A1;--line:#EEF0F3;--line2:#E2E5EA;
  --bg:#FFFFFF;--canvas:#F4F5F7;--bg-sub:#F7F8FA;--hover:#F2F4F6;
  --ok:#1F6BFF;--ok-weak:#EBF2FF;--warn:#4E5968;--warn-weak:#F2F4F6;--err:#F04452;--err-weak:#FFEEEF;
  --card-sh:0 1px 2px rgba(25,31,40,.04),0 4px 16px rgba(25,31,40,.05);
}
body{color:var(--tx);}
.st{padding:3px 10px 3px 8px;border-radius:999px;background:#F2F4F6;color:var(--tx2);font-weight:600;line-height:1.45;}
.st::before{background:currentColor;}
.st.pri,.st.ok{background:var(--pri-weak);color:var(--pri);}
.st.warn{background:#F2F4F6;color:var(--tx);}
.st.err{background:var(--err-weak);color:var(--err);}
.st.off,.st.mute{background:#F2F4F6;color:var(--tx3);}
.callout{background:var(--bg-sub);color:var(--tx2);}
.callout.ok,.callout.ok b,.callout.pri,.callout.pri b{background:var(--pri-weak);color:var(--pri);}
.callout.warn,.callout.warn b{background:#F2F4F6;color:var(--tx);}
.callout.err,.callout.err b{background:var(--err-weak);color:var(--err);}
.btn.pri,.btn:not(.ghost):not(.soft):not(.sm):not(.xs){}

/* PC: 흰 페이지 · 박스 없음 · 크기/굵기/여백/구분선으로 위계 */
body,.app,.main{background:#fff;}
.nav{background:#F7F8FA;border-right:1px solid var(--line);}
.nav-item{color:var(--tx2);font-weight:500;}
.nav-item:hover{background:#EEF0F3;color:var(--tx);}
.nav-item.on,.nav-item.active{background:#fff;color:var(--tx);font-weight:700;box-shadow:0 1px 2px rgba(25,31,40,.08);}
.nav-item.on svg,.nav-item.active svg{color:var(--pri);}
.nav-job .n,.nav-job .nj-name{color:var(--tx);font-weight:700;}
.phead{padding-bottom:28px;margin-bottom:32px;border-bottom:1px solid var(--line);}
.phead h1{font-size:30px;font-weight:800;letter-spacing:-0.035em;}
.phead p{color:var(--tx2);font-size:14px;}
/* 요약 숫자: 박스 없이 크게 · 첫 숫자만 블루 */
.kpis{margin-bottom:44px;}
.kpi{padding:0 36px;border-left:1px solid var(--line2);}
.kpi .lb{color:var(--tx2);font-size:13px;font-weight:600;margin-bottom:4px;}
.kpi .vl{font-size:34px;font-weight:800;letter-spacing:-0.035em;color:var(--tx);line-height:1.15;}
.kpi .vl small{font-size:14px;color:var(--tx3);font-weight:600;}
.kpi:first-child .vl{color:var(--pri);}
.kpi .vl.err{color:var(--err);} .kpi .vl.warn{color:var(--tx);}
/* 섹션 제목 */
.sec{margin-top:52px;}
.sec-h{margin-bottom:14px;}
.sec-h h2{font-size:19px;font-weight:800;letter-spacing:-0.025em;}
.sec-h .meta{font-size:13px;color:var(--tx3);font-weight:600;}
.cols{gap:56px;}
.cols>aside{border-left:1px solid var(--line);padding-left:32px;margin-left:-24px;}
.cols>aside.panel,.cols>aside.sticky.panel{border-left:0;margin-left:0;}
/* 표: 테두리 없이 헤더 띠 하나 */
.tbl{border-top:0;}
.tbl th{background:var(--bg-sub);color:var(--tx2);font-weight:600;border-bottom:0;padding:10px;}
.tbl th:first-child{border-radius:8px 0 0 8px;padding-left:12px;}
.tbl th:last-child{border-radius:0 8px 8px 0;}
.tbl td:first-child{padding-left:12px;}
.tbl td{color:var(--tx);padding:13px 10px;}
.tbl tbody tr.click:hover td{background:var(--bg-sub);}
.tbl tbody tr.sel td,.tbl tbody tr.on td{background:var(--pri-weak);}
/* 작업 영역(입력·확정)만 옅은 면 */
.panel{border:0;background:var(--bg-sub);border-radius:14px;}
.empty{border-top:0;background:var(--bg-sub);border-radius:12px;}
.search .input{background:var(--bg-sub);}
.seg{background:#EEF0F3;}
.seg button{white-space:nowrap;}
.btn{font-weight:700;}
.doc{border:1px solid var(--line);}
.callout{border-radius:10px;}
.tag.pri,.tag.ai{background:var(--pri-weak);color:var(--pri);border-color:transparent;}
.step .bar{background:var(--line2);} .step.done .bar{background:var(--pri-line);} .step.on .bar{background:var(--pri);}


.app.pre{display:block;} .app.pre .nav{display:none;} .app.pre .main{padding:0;max-width:none;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:#fff;}
.login{width:100%;max-width:400px;}
.login .lg-logo .logo-svg{height:30px;width:auto;display:block;margin-bottom:36px;}
.login h1{font-size:28px;font-weight:800;letter-spacing:-0.03em;margin-bottom:6px;}
.login .lg-s{font-size:14px;color:var(--tx2);margin-bottom:28px;}
.input.lg{height:48px;font-size:15px;} .btn.lg{height:50px;font-size:15px;}
.lg-err{display:flex;align-items:center;gap:6px;color:var(--err);font-size:13px;font-weight:600;margin:-4px 0 12px;}
.lg-help-x{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--tx2);display:grid;gap:6px;}
.lg-help b{color:var(--tx);margin-right:6px;}

/* 시연 도우미 (4개 화면 공통) */
.demo-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px;}
.demo-chip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border:1px dashed #B9C3D3;border-radius:15px;background:#fff;color:#4E5968;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.demo-chip:hover{border-color:var(--pri);color:var(--pri);}
.demo-chip[disabled]{opacity:.4;pointer-events:none;}
.demo-chip svg{width:14px;height:14px;}
.lg-foot{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--tx2);text-align:center;line-height:1.6;}
.lg-foot a{color:var(--pri);font-weight:600;text-decoration:none;cursor:pointer;}

svg.i.ph{fill:currentColor;stroke:none;}
</style>

/* =====================================================================
   시간표 엔진
   - 면접번호: [분야]+순번 (시간표 순서)
   - 조별 세션 = min(최대 면접시간, 실제 인원 × 인당 배분시간)
   - DELAY: 특정 지원자 행 기준 기록 → 이후 일정 연쇄 반영
   - 도착시간: 확정 시점에 고정, 이후 자동 변경 없음
   ===================================================================== */
function unitLen(j,attend){const c=j.cfg;return c.type==='group'?Math.min(c.groupMaxMin,attend*c.perMin):c.dur;}
function buildSchedule(j){
  const c=j.cfg;const R=Math.max(1,+c.rooms||1);
  const byF={};validRoster(j).forEach(r=>{(byF[r.field]=byF[r.field]||[]).push(r.no);});
  let pieces=Object.entries(byF).map(([f,nos])=>{const units=[];const size=c.type==='group'?Math.max(1,+c.groupMax):1;for(let i=0;i<nos.length;i+=size)units.push(nos.slice(i,i+size));return{field:f,units};});
  while(pieces.length<R){pieces.sort((a,b)=>b.units.length-a.units.length);const p=pieces[0];if(p.units.length<2)break;const h=Math.ceil(p.units.length/2);pieces.splice(0,1,{field:p.field,units:p.units.slice(0,h)},{field:p.field,units:p.units.slice(h)});}
  pieces.sort((a,b)=>b.units.length-a.units.length);
  const rooms=Array.from({length:R},(_,i)=>({name:`${i+1}면접실`,start:c.start,items:[],load:0}));
  pieces.forEach(p=>{const r=rooms.reduce((a,b)=>b.load<a.load?b:a);p.units.forEach(u=>r.items.push({kind:'s',id:'s'+Math.random().toString(36).slice(2,8),field:p.field,members:u}));r.load+=sum(p.units.map(u=>unitLen(j,u.length)+c.rest));});
  // 점심 자동 배치: 11:30~13:30 구간 고려, 세션이 점심 기준 시각을 크게 넘기면 그 앞에 삽입, 오전 조기 종료 시 생략
  rooms.forEach(r=>{
    let cur=T(r.start);const out=[];let placed=!c.lunch;
    r.items.forEach((it,idx)=>{
      const len=unitLen(j,it.members.length);
      if(!placed&&cur>=T('11:30')&&cur+len>T(c.lunchStart)+20){out.push({kind:'lunch',id:'l'+idx,start:HM(Math.min(cur,T('13:30'))),len:+c.lunchLen});cur=Math.max(cur,T('11:30'))+(+c.lunchLen);placed=true;}
      out.push(it);cur+=len+(+c.rest);
    });
    r.items=out;delete r.load;
  });
  j.sched={rooms};
  numberSchedule(j);
}
function numberSchedule(j){
  // 면접번호·조 번호: 시간표(계획) 순서 기준
  const all=[];j.sched.rooms.forEach((r,ri)=>timeline(j,r,false).forEach(x=>{if(x.kind==='s')all.push({x,ri});}));
  all.sort((a,b)=>a.x.s-b.x.s||a.ri-b.ri);
  const cnt={},gcnt={};
  all.forEach(({x})=>{gcnt[x.field]=(gcnt[x.field]||0)+1;x.it.label=j.cfg.type==='group'?`${x.field} ${gcnt[x.field]}조`:x.field;x.members.forEach(no=>{cnt[x.field]=(cnt[x.field]||0)+1;app(j,no).ino=x.field+pad(cnt[x.field]);});});
}
function timeline(j,room,actual){
  const c=j.cfg;let cur=T(room.start);const out=[];
  room.items.forEach(it=>{
    if(it.kind==='lunch'||it.kind==='break'){const s=Math.max(cur,T(it.start));out.push({kind:it.kind,it,s,e:s+it.len});cur=s+it.len;return;}
    const attend=actual?it.members.filter(no=>app(j,no).status!=='불참').length:it.members.length;
    const len=c.type==='group'?Math.min(c.groupMaxMin,attend*c.perMin):(actual&&attend===0?c.dur:c.dur);
    const planLen=unitLen(j,it.members.length);
    let s=cur;
    if(actual){const arr=Math.min(...it.members.map(no=>T(arriveOf(j,no))||0));if(arr)s=Math.max(cur,arr+10);}
    const delay=actual?sum(it.members.map(no=>+app(j,no).delay||0)):0;
    const e=s+len+delay;
    out.push({kind:'s',it,field:it.field,members:it.members,s,e,len,planLen,delay,attend,label:it.label});
    cur=e+(len>0?+c.rest:0);
  });
  return out;
}
function planOf(j){const m={};if(!j.sched)return m;j.sched.rooms.forEach(r=>timeline(j,r,false).forEach(x=>{if(x.kind==='s')x.members.forEach(no=>m[no]={s:x.s,e:x.e,room:r.name,label:x.label});}));return m;}
function arriveOf(j,no){if(j.arrive[no])return j.arrive[no];const p=planOf(j)[no];return p?HM(p.s-(+j.cfg.arrive)):'';}
function roomOf(j,no){if(!j.sched)return null;for(const r of j.sched.rooms)for(const it of r.items)if(it.kind==='s'&&it.members.includes(no))return r;return null;}
function histLog(j,txt){if(j.schedConfirmed){j.history.unshift({at:nowStamp(),txt});}log(j,txt);}

const REQ=['수험번호','성명','지원분야','연락처'];
function validateRoster(j){
  const errs=[];const seen={};
  j.roster.forEach((r,i)=>{
    if(!r.field)errs.push({no:r.no,idx:i,msg:'지원분야 누락'});
    if(!r.name)errs.push({no:r.no,idx:i,msg:'성명 누락'});
    if(!r.phone)errs.push({no:r.no,idx:i,msg:'연락처 누락'});
    if(seen[r.no]!==undefined)errs.push({no:r.no,idx:i,msg:'중복 수험번호',dup:true});
    else seen[r.no]=i;
  });
  // 중복은 두 번째 행만 오류로 표시하기 위해 idx 기준 관리
  j.rosterErrs=errs;
}
function errOf(j,i){return j.rosterErrs.filter(e=>e.idx===i);}
function parseCSV(text){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"')q=true;else if(c===','){row.push(cell);cell='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}else cell+=c;}
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows;
}
function ingest(j,table,fname){
  const head=(table[0]||[]).map(h=>String(h).trim().replace(/^﻿/,''));
  const miss=REQ.filter(h=>!head.includes(h));
  if(miss.length){modal({title:'필수 컬럼 누락',body:`<div class="callout err">${ic('alert')}<span><b>${miss.join(', ')}</b> 컬럼 없음 · 업로드 중단</span></div><div class="muted">필수 컬럼: 수험번호 · 성명 · 지원분야 · 연락처 (생년월일 선택)<br>샘플 양식을 내려받아 컬럼명을 맞춘 뒤 다시 업로드</div>`,actions:[{label:'샘플 양식 다운로드',act:'sampleCsv'},{label:'확인',act:'closeModal',cls:'pri'}]});return;}
  const ix=h=>head.indexOf(h);let blank=0;const rows=[];
  table.slice(1).forEach(c=>{const v=c.map(x=>String(x??'').trim());if(v.every(x=>!x)){blank++;return;}
    rows.push({no:v[ix('수험번호')],name:v[ix('성명')],field:v[ix('지원분야')],phone:v[ix('연락처')],birth:ix('생년월일')>=0?v[ix('생년월일')]:''});});
  j.roster=rows;j.apps={};rows.forEach(r=>j.apps[r.no]=blankApp());j.rosterFile=fname;j.sched=null;j.schedConfirmed=false;j.arrive={};j.mask.reviewed={};j.mask.confirmed=false;j.notice={sent:false,at:null,res:{}};
  validateRoster(j);
  log(j,`명단 업로드 · ${fname} · ${rows.length}명${blank?` · 빈 행 ${blank}개 제거`:''}`);
  toast(`${rows.length}명 업로드${blank?` · 빈 행 ${blank}개 자동 제거`:''}${j.rosterErrs.length?` · 오류 ${j.rosterErrs.length}건`:''}`,!!j.rosterErrs.length);
  S.prepTab='roster';render();
}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=()=>res(window.XLSX);s.onerror=rej;document.head.appendChild(s);});}
function handleFile(f){
  const j=cur();if(!f)return;
  if(/\.csv$/i.test(f.name)){const r=new FileReader();r.onload=()=>ingest(j,parseCSV(r.result),f.name);r.readAsText(f,'utf-8');}
  else if(/\.xlsx?$/i.test(f.name)){loadXLSX().then(X=>{const r=new FileReader();r.onload=()=>{const wb=X.read(r.result,{type:'array'});const ws=wb.Sheets[wb.SheetNames[0]];ingest(j,X.utils.sheet_to_json(ws,{header:1,defval:''}),f.name);};r.readAsArrayBuffer(f);}).catch(()=>toast('엑셀 해석 모듈을 불러오지 못함 · CSV로 저장 후 업로드',true));}
  else toast('엑셀(.xlsx) 또는 CSV 파일만 업로드 가능',true);
}
function download(name,text,type='text/csv'){const b=new Blob(['﻿'+text],{type});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);}

function weights(j){return j.ai.crit.length?j.ai.crit:CRIT_SETS.A.items;}
function evScore(j,e){const W=weights(j);return sum(W.map((c,i)=>c[1]*(e.lv[i]||0)/5));}
function avgOf(j,no){const ev=Object.values(app(j,no).evals);if(!ev.length)return null;return sum(ev.map(e=>evScore(j,e)))/ev.length;}
function evalNeed(j,no){const r=roomOf(j,no);return j.evaluators.filter(e=>!r||e.room===r.name).length;}
function resultRows(j){
  return validRoster(j).map(r=>{const a=app(j,r.no);const avg=avgOf(j,r.no);const b=(j.bonus[r.no]||{pt:0}).pt;
    return{no:r.no,ino:a.ino,name:r.name,field:r.field,absent:a.status==='불참',avg,bonus:b,total:avg==null?null:avg+b,evN:Object.keys(a.evals).length,need:evalNeed(j,r.no)};});
}

function draftDecisions(j){
  const rows=resultRows(j);const byF={};rows.forEach(x=>(byF[x.field]=byF[x.field]||[]).push(x));
  Object.entries(byF).forEach(([f,arr])=>{const q=+j.quota[f]||0;arr.filter(x=>!x.absent&&x.total!=null).sort((a,b)=>b.total-a.total).forEach((x,i)=>{j.decision[x.no]={draft:i<q?'합격':'불합격',final:i<q?'합격':'불합격',rank:i+1};});
    arr.filter(x=>x.absent).forEach(x=>j.decision[x.no]={draft:'불참',final:'불참',rank:null});
    arr.filter(x=>!x.absent&&x.total==null).forEach(x=>j.decision[x.no]={draft:'평가 미완료',final:'평가 미완료',rank:null});});
}

const BAN=['출신','학교','대학','고향','나이','결혼','자녀','부모','아버지','어머니','가족','종교','성별','외모'];
function banCount(j){let n=0;validRoster(j).forEach(r=>Object.values(app(j,r.no).evals).forEach(e=>{if(BAN.some(w=>e.comment.includes(w)))n++;}));return n;}

function hoursOf(s,endDefault){const e=s.out||endDefault;if(!s.in||!e)return 0;return Math.max(0,T(e)-T(s.in));}
function pgSettle(){
  const j=cur();
  const endD=j.stage==='live'?null:'17:00';
  const rows=j.staff.map(s=>{const m=hoursOf(s,s.out||(j.nowMin?HM(j.nowMin):endD));const rate=ORG.rates[s.type]||0;return Object.assign({},s,{m,amt:Math.round(m/60*rate/10)*10,rate});});
  const total=sum(rows.map(r=>r.amt));
  const docs=[['전자근로계약서',rows.filter(r=>r.doc).length],['보안서약서',rows.length],['신분증 사본',rows.length-1],['통장 사본',rows.filter(r=>r.doc).length]];
  return `
  <div class="phead"><div><h1>정산</h1><p>근무시간과 단가로 정산 금액 자동 계산 · 제출 서류 확인</p></div><div class="pr"><button class="btn pri" data-act="settleCsv" ${rows.length?'':'disabled'}>${ic('download','s14')}정산 엑셀 다운로드</button></div></div>

  <div class="row mb12"><span class="strong" style="font-size:13px">단가 (시급)</span>${Object.entries(ORG.rates).map(([k,v])=>`<span class="faint" style="font-size:12.5px;margin-left:12px">${k}</span><input class="input sm num" type="number" value="${v}" data-rate="${k}" style="width:100px">`).join('')}<span class="faint" style="font-size:12px;margin-left:8px">원</span></div>
  <div class="tbl secure"><table><thead><tr><th>구분</th><th>성명</th><th>출근</th><th>퇴근</th><th>근무 시간</th><th class="r">단가</th><th class="r">산출액</th><th>제출 서류</th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td><span class="tag ${r.type==='운영자'?'pri':''}">${r.type}</span></td><td class="strong">${r.name}</td><td class="num">${r.in}</td><td class="num">${r.out||'<span class="faint">근무 중</span>'}</td><td class="num">${Math.floor(r.m/60)}h ${pad(r.m%60)}m</td><td class="r num muted">${won(r.rate)}</td><td class="r num strong" style="color:var(--pri)">${won(r.amt)}원</td><td>${r.doc?'<span class="st ok">완료</span>':'<span class="st warn">미제출</span>'}</td></tr>`).join('')}

    </section></div>`;
  if(t==='security')return H('보안 서약서','평가위원·운영인력이 첫 로그인 시 동의하는 서약서')+`<div class="doc" style="max-width:720px">본인은 ONSITE를 통해 열람하는 지원자 개인정보 및 평가정보를 면접 운영 목적 외로 사용하지 않으며, 화면 캡처·촬영·외부 메신저 전송을 하지 않을 것을 서약함.<br><br>1. 지원자 식별 정보 비공개<br>2. 평가 결과 외부 유출 금지<br>3. 블라인드 원칙 준수<br>4. 위반 시 위촉 해제 및 관련 법령에 따른 책임</div><div class="row mt12"><span class="faint" style="font-size:12.5px">최종 수정 ${DD('2025.04.18')}</span><span class="sp"></span><button class="btn" data-act="noop">수정</button></div>`;
  if(t==='dispatch')return H('발송 설정','지원자 안내 발송 채널 · 시점')+`

  if(t==='log')return H('활동 로그','시간표 변경 이력 · 확정 · 발송 · 합불 조정 기록')+`
    ${LOG.length?`<div class="tbl"><table><thead><tr><th style="width:160px">일시</th><th style="width:30%">공고</th><th>내용</th></tr></thead><tbody>${LOG.map(l=>`<tr><td class="num muted">${l.at}</td><td class="muted">${esc(l.job)}</td><td>${esc(l.txt)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">이번 세션 활동 없음</div>'}`;
  return H('내 정보','계정 정보')+`<div style="max-width:520px"><div class="kv"><span class="k">이름</span><span>김민경</span></div><div class="kv"><span class="k">권한</span><span>마스터 관리자</span></div><div class="kv"><span class="k">이메일</span><span>admin@onsite.kr</span></div><div class="kv"><span class="k">소속</span><span>${ORG.name} 인사팀</span></div><button class="btn mt16" data-act="logout">로그아웃</button></div>`;
}

function pgLogin(){
  return `<div class="login-wrap"><div class="login">
    <div class="lg-logo">${LOGO}</div>
    <h1>관리자 로그인</h1>
    <p class="lg-s">채용 담당자 계정으로 로그인해 주세요</p>
    <div class="field"><label>이메일</label><input class="input lg" id="lg-id" placeholder="name@org.kr" autocomplete="off" value="${esc(S.lgId)}"></div>
    <div class="field"><label>비밀번호</label><input class="input lg" id="lg-pw" type="password" placeholder="비밀번호"></div>
    ${S.loginErr?`<div class="lg-err">${ic('alert','s14')}${S.loginErr}</div>`:''}
    <button class="btn pri block lg" data-act="login">로그인</button>
    <div class="demo-chips"><button class="demo-chip" data-act="demoFill">${ic('spark','s14')}시연용 계정 입력</button></div>
    <div class="lg-foot">비밀번호를 잊으셨나요? <a data-act="noop">비밀번호 재설정</a></div>
  </div></div>`;
}
function render(){
  if(!S.auth){document.querySelector('.app').classList.add('pre');$('#nav').innerHTML='';$('#view').innerHTML=pgLogin();return;}
  document.querySelector('.app').classList.remove('pre');
  renderNav();
  let h='';
  if(S.view==='workspace')h=pgWorkspace();
  else if(S.view==='settings')h=pgSettings();
  else h=({people:pgPeople,prep:pgPrep,monitor:pgMonitor,eval:pgEval,result:pgResult,settle:pgSettle})[S.page]();
  $('#view').innerHTML=h;
  const dz=$('#drop');if(dz){dz.ondragover=e=>{e.preventDefault();dz.classList.add('over');};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=e=>{e.preventDefault();dz.classList.remove('over');handleFile(e.dataTransfer.files[0]);};}
}
function keepScroll(fn){const y=window.scrollY;fn();window.scrollTo(0,y);}

/* =====================================================================
   이벤트
   ===================================================================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act;const j=cur();
  switch(a){
    case 'ov':if(e.target===t)closeModal();break;
    case 'demoFill':$('#lg-id').value='admin@onsite.kr';$('#lg-pw').value='onsite25!';break;
    case 'login':{const id=$('#lg-id').value.trim().toLowerCase(),pw=$('#lg-pw').value;S.lgId=id;S.fail=(S.fail||0);
      if(!id||!pw){S.loginErr='이메일과 비밀번호를 입력해 주세요';render();break;}
      if(id!=='admin@onsite.kr'||pw!=='onsite25!'){S.fail++;S.loginErr=S.fail>=5?'로그인을 5회 실패해 10분 동안 잠겼어요':`이메일 또는 비밀번호가 맞지 않아요 (${S.fail}/5)`;render();break;}
      S.auth=true;S.loginErr='';S.fail=0;S.view='workspace';log(null,'관리자 로그인');render();break;}
    case 'logout':S.auth=false;S.lgId='';render();break;
    case 'closeModal':closeModal();break;
    case 'noop':toast('준비 중인 기능이에요');break;
    case 'toWs':S.view='workspace';S.jobId=null;render();break;
    case 'toSet':S.view='settings';render();break;
    case 'setTab':S.view='settings';S.setTab=t.dataset.k;S.jobId=null;render();break;
    case 'openJob':S.view='job';S.jobId=t.dataset.j;const jj=cur();S.page=jj.stage==='live'?'monitor':jj.stage==='settle'?'result':'prep';S.prepTab=!jj.roster.length||jj.rosterErrs.length?'roster':'sched';S.evSel=null;S.monRoom=0;render();window.scrollTo(0,0);break;
    case 'page':S.page=t.dataset.p;render();window.scrollTo(0,0);break;
    case 'prepTab':S.prepTab=t.dataset.k;render();break;
    case 'calSel':S.calSel=t.dataset.k;render();break;
    case 'calMove':{let m=S.calM+ +t.dataset.d,y=S.calY;if(m<1){m=12;y--;}if(m>12){m=1;y++;}S.calM=m;S.calY=y;render();break;}
    case 'newJob':modal({title:'신규 공고 등록',body:`<div class="field"><label>공고명</label><input class="input" id="nj-name" placeholder="예) 2025년 하반기 공개채용"></div><div class="fgrid"><div class="field"><label>기관</label><input class="input" id="nj-org" value="${ORG.name}"></div><div class="field"><label>면접일</label><input class="input" type="date" id="nj-date"></div></div><div class="field"><label>면접 장소 (안내 문구 사용)</label><input class="input" id="nj-place" placeholder="예) 본관 3층 대기실"></div><div class="field" style="margin:0"><label>면접 유형</label><select class="select" id="nj-type"><option value="single">개별 면접 (일대다·다대다)</option><option value="group">조별 면접</option></select></div>`,actions:[{label:'취소',act:'closeModal'},{label:'등록',act:'createJob',cls:'pri'}]});break;
    case 'createJob':{const n=$('#nj-name').value.trim(),d=$('#nj-date').value;if(!n||!d){toast('공고명·면접일 입력 필요',true);break;}
      const nj=newJob({id:'j'+(JOBS.length+1)+Date.now()%1000,name:n,org:$('#nj-org').value.trim()||ORG.name,date:d.replace(/-/g,'.'),place:$('#nj-place').value.trim()||'면접 장소 미정',stage:'prep',cfg:{type:$('#nj-type').value}});
      nj.code='N'+String(Date.now()).slice(-4);initAccounts(nj);JOBS.unshift(nj);log(nj,'공고 등록');closeModal();S.view='job';S.jobId=nj.id;S.page='prep';S.prepTab='roster';render();toast('공고 등록 · 명단 업로드부터 시작');break;}

    /* 명단 */
    case 'pickFile':$('#fileIn').value='';$('#fileIn').click();break;
    case 'sampleCsv':download('ONSITE_명단양식.csv','수험번호,성명,지원분야,연락처,생년월일\nA-001,홍길동,경영,010-1234-5678,19980101\nA-002,김철수,경영,010-2345-6789,19990512\nA-003,이영희,행정,010-3456-7890,19970820\n');break;
    case 'loadSample':{const rows=mkRoster([['경영',12],['행정',8]],'N');ingest(j,[REQ.concat('생년월일')].concat(rows.map(r=>[r.no,r.name,r.field,r.phone,r.birth])).concat([['','','','','']]),'샘플_합격자명단.xlsx');break;}
    case 'delRow':{const i=+t.dataset.i;const r=j.roster[i];j.roster.splice(i,1);validateRoster(j);log(j,`명단 오류 행 삭제 · ${r.no}`);render();break;}

    /* 시간표 */
    case 'cfgType':j.cfg.type=t.dataset.v;render();break;
    case 'genSched':{const regen=!!j.sched;const was=j.schedConfirmed;buildSchedule(j);
      if(was){j.schedConfirmed=true;validRoster(j).forEach(r=>j.arrive[r.no]=arriveOf(j,r.no));j.arrive={};validRoster(j).forEach(r=>j.arrive[r.no]=HM(planOf(j)[r.no].s-(+j.cfg.arrive)));histLog(j,'확정 후 시간표 재생성 · 면접번호·도착시간 재산정');j.notice.sent&&toast('도착시간 변경 · 안내 재발송 필요',true);}
      else{log(j,regen?'시간표 재생성':'시간표 자동 생성');toast(`시간표 생성 · 면접실 ${j.sched.rooms.length}개 · 세션 ${sum(j.sched.rooms.map(r=>r.items.filter(i=>i.kind==='s').length))}개`);}
      render();break;}
    case 'confirmSched':modal({title:'시간표 확정',body:`<div>확정하면 면접번호와 도착시간이 고정되고, 이후 수정 내용은 변경 이력에 남아요.</div><div class="callout mt12" style="margin-bottom:0">${ic('info')}<span>도착시간 = 면접 시작 ${j.cfg.arrive}분 전 · 지원자에게는 도착시간만 안내</span></div>`,actions:[{label:'취소',act:'closeModal'},{label:'확정',act:'doConfirmSched',cls:'pri'}]});break;
    case 'doConfirmSched':{closeModal();const P=planOf(j);j.arrive={};validRoster(j).forEach(r=>j.arrive[r.no]=HM(P[r.no].s-(+j.cfg.arrive)));j.schedConfirmed=true;j.schedAt=nowStamp();log(j,'시간표 확정');toast('시간표 확정 · 안내 발송 가능');render();break;}
    case 'addLunch':{const r=j.sched.rooms[+t.dataset.r];const at=r.items.findIndex((it,k)=>{const tl=timeline(j,r,false);const x=tl[k];return x&&x.s>=T('11:30');});r.items.splice(at<0?r.items.length:at,0,{kind:'lunch',id:'l'+Date.now(),start:'12:00',len:+j.cfg.lunchLen||60});histLog(j,`${r.name} 점심 블록 추가`);render();break;}
    case 'addBreak':{const r=j.sched.rooms[+t.dataset.r];const tl=timeline(j,r,false);const mid=Math.floor(r.items.length/2);r.items.splice(mid,0,{kind:'break',id:'b'+Date.now(),start:HM(tl[mid]?tl[mid].s:T(r.start)),len:10});histLog(j,`${r.name} 휴식 블록 추가`);render();break;}
    case 'delBlk':{const r=j.sched.rooms[+t.dataset.r];const it=r.items.splice(+t.dataset.i,1)[0];histLog(j,`${r.name} ${it.kind==='lunch'?'점심':'휴식'} 블록 삭제`);render();break;}
    case 'movePerson':{const no=t.dataset.no;const r=roomOf(j,no);const opts=[];j.sched.rooms.forEach(rr=>rr.items.forEach(it=>{if(it.kind==='s'&&it.field===person(j,no).field&&!it.members.includes(no))opts.push({it,label:`${rr.name} · ${it.label} (${it.members.length}명)`});}));
      modal({title:`${app(j,no).ino} 배치 변경`,body:`<div class="field"><label>이동할 조 (같은 분야)</label><select class="select" id="mv-to">${opts.map((o,k)=>`<option value="${k}" ${o.it.members.length>=j.cfg.groupMax?'disabled':''}>${o.label}${o.it.members.length>=j.cfg.groupMax?' · 정원 초과':''}</option>`).join('')}</select></div><div class="note">확정 전 배치 조정 · 면접번호는 시간표 순서로 재부여</div>`,actions:[{label:'취소',act:'closeModal'},{label:'이동',act:'doMove',cls:'pri',data:`data-no="${no}"`}]});
      window._mvOpts=opts;break;}
    case 'doMove':{const no=t.dataset.no;const o=window._mvOpts[+$('#mv-to').value];if(!o)break;j.sched.rooms.forEach(rr=>rr.items.forEach(it=>{if(it.kind==='s')it.members=it.members.filter(x=>x!==no);}));o.it.members.push(no);j.sched.rooms.forEach(rr=>rr.items=rr.items.filter(it=>it.kind!=='s'||it.members.length));numberSchedule(j);closeModal();log(j,`지원자 배치 변경 · ${no}`);render();break;}

    /* AI */
    case 'pickQ':j.ai.qSel=t.dataset.k;j.ai.qs=Q_SETS[t.dataset.k].qs.slice();j.ai.saved=false;render();break;
    case 'pickC':j.ai.cSel=t.dataset.k;j.ai.crit=CRIT_SETS[t.dataset.k].items.map(x=>x.slice());j.ai.saved=false;render();break;
    case 'addQ':j.ai.qs.push('');j.ai.saved=false;render();break;
    case 'delQ':j.ai.qs.splice(+t.dataset.i,1);j.ai.saved=false;render();break;
    case 'addC':j.ai.crit.push(['새 항목',0,'']);j.ai.saved=false;render();break;
    case 'delC':j.ai.crit.splice(+t.dataset.i,1);j.ai.saved=false;render();break;
    case 'saveAI':j.ai.qs=j.ai.qs.filter(q=>q.trim());j.ai.saved=true;j.ai.savedAt=nowStamp();log(j,`질문 ${j.ai.qs.length}문항 · 평가항목 ${j.ai.crit.length}개 공고 적용`);toast('공고 템플릿 저장 · 평가자 화면 반영');render();break;
    case 'saveTpl':{const f=Object.keys(fields(j))[0]||'공통';TEMPLATES.unshift({name:`${f} · ${j.org}`,type:`질문 ${j.ai.qs.length} · 항목 ${j.ai.crit.length}`,at:nowStamp().slice(0,10)});log(j,'직무 기본 템플릿 저장');toast('템플릿 저장 · 설정 > 템플릿에서 확인');break;}

    /* 마스킹 */
    case 'maskItem':j.mask.items[t.dataset.k]=!j.mask.items[t.dataset.k];j.mask.reviewed={};render();toast('마스킹 항목 변경 · 검수 초기화');break;
    case 'maskRaw':S.maskRaw=t.dataset.v==='1';render();break;
    case 'maskSel':S.maskSel=t.dataset.no;render();break;
    case 'review':{const no=t.dataset.no;j.mask.reviewed[no]=!j.mask.reviewed[no];if(j.mask.reviewed[no]){const R=validRoster(j);const nx=R.find(r=>!j.mask.reviewed[r.no]);if(nx)S.maskSel=nx.no;}render();break;}
    case 'reviewAll':validRoster(j).forEach(r=>j.mask.reviewed[r.no]=true);log(j,'마스킹 일괄 검수');render();break;
    case 'confirmMask':j.mask.confirmed=true;j.mask.at=nowStamp();log(j,'블라인드 마스킹 확정 · 평가자 노출');toast('마스킹 확정 · 평가자 화면 노출');render();break;
    case 'unmask':j.mask.confirmed=false;log(j,'마스킹 확정 해제');render();break;

    /* 안내 발송 */
    case 'sendNotice':modal({title:'안내 발송',body:`<div>${validRoster(j).length}명에게 도착시간·장소·준비사항 안내 발송</div><div class="kv mt12"><span class="k">채널</span><span>${ORG.channel}</span></div>`,actions:[{label:'취소',act:'closeModal'},{label:'발송',act:'doSend',cls:'pri'}]});break;

    case 'doIssue':{const x=$('#is-x').value.trim();if(!x)break;j.issues.unshift({t:HM(j.nowMin||new Date().getHours()*60+new Date().getMinutes()),txt:x,room:$('#is-r').value,by:'마스터',photo:$('#is-p').checked,done:false});closeModal();log(j,`이슈 등록 · ${x}`);render();break;}

    /* 평가 */
    case 'evRoom':S.evRoom=t.dataset.k;render();break;

    case 'fillEval':{const W=weights(j);let n=0;validRoster(j).forEach(r=>{const a=app(j,r.no);if(a.status==='불참')return;const rm=roomOf(j,r.no);j.evaluators.filter(e=>!rm||e.room===rm.name).forEach(ev=>{if(a.evals[ev.name])return;const b=2+rnd(r.no+'base',3);a.evals[ev.name]={lv:W.map((c,ci)=>Math.max(1,Math.min(5,b+rnd(r.no+ev.name+ci,3)-1))),comment:'답변 구조 명확, 직무 이해도 양호',at:nowStamp()};n++;});});draftDecisions(j);toast(`평가자 제출 시연 · ${n}건 반영`);render();break;}
    case 'closeEval':{const R=validRoster(j).filter(r=>app(j,r.no).status!=='불참');const inc=R.filter(r=>Object.keys(app(j,r.no).evals).length<evalNeed(j,r.no)).length;

    case 'confirmResult':{const pass=validRoster(j).filter(r=>(j.decision[r.no]||{}).final==='합격').length;const adj=validRoster(j).filter(r=>{const d=j.decision[r.no]||{};return d.final!==d.draft;}).length;
      modal({title:'최종 합불 확정',body:`<div>합격 ${pass}명 · 확정 후 수정 불가</div>${adj?`<div class="callout warn mt12" style="margin-bottom:0">${ic('alert')}<span><b>관리자 조정 ${adj}건</b> · 활동 로그 기록</span></div>`:''}`,actions:[{label:'취소',act:'closeModal'},{label:'확정',act:'doConfirmResult',cls:'pri'}]});break;}

    case 'publish':modal({title:'결과 발표',body:`<div>지원자 WebApp 결과 공개 · 알림톡 발송 · 지원자 페이지 ${j.expire}까지 열람</div>`,actions:[{label:'취소',act:'closeModal'},{label:'발표',act:'doPublish',cls:'pri'}]});break;
    case 'doPublish':closeModal();j.published=true;j.publishedAt=nowStamp();j.stage='settle';log(j,'결과 발표');toast('결과 발표 완료');render();break;
    case 'resCsv':{let csv='면접번호,분야,위원평균,가점,합계,초안,최종\n';resultRows(j).forEach(r=>{const d=j.decision[r.no]||{};csv+=`${r.ino},${r.field},${r.avg==null?'':r.avg.toFixed(1)},${r.bonus},${r.total==null?'':r.total.toFixed(1)},${d.draft||''},${d.final||''}\n`;});download(`결과표_${j.name}.csv`,csv);break;}
    case 'settleCsv':{let csv='구분,성명,출근,퇴근,단가\n';j.staff.forEach(s=>csv+=`${s.type},${s.name},${s.in},${s.out},${ORG.rates[s.type]}\n`);download(`정산_${j.name}.csv`,csv);break;}

    /* 설정 */
    case 'orgTg':ORG[t.dataset.k]=!ORG[t.dataset.k];log(null,`기관 설정 변경 · ${t.dataset.k}`);render();break;
    case 'pwShow':S.pwShow[t.dataset.id]=!S.pwShow[t.dataset.id];keepScroll(render);break;
    case 'accIssue':{const L=t.dataset.k==='E'?j.evaluators:j.ops;const p=L[+t.dataset.i];p.acc={id:(p.acc&&p.acc.id)||nextAccId(j,t.dataset.k),pw:genPw(),issued:true,sent:false,login:null};S.pwShow[p.acc.id]=true;log(j,`계정 발급 · ${p.name} ${p.acc.id}`);toast(`${p.name} · ${p.acc.id} 발급`);keepScroll(render);break;}
    case 'accIssueAll':{let n=0;[['E',j.evaluators],['S',j.ops]].forEach(([k,L])=>L.forEach(p=>{if(!p.acc||!p.acc.issued){p.acc={id:(p.acc&&p.acc.id)||nextAccId(j,k),pw:genPw(),issued:true,sent:false,login:null};n++;}}));log(j,`계정 일괄 발급 · ${n}명`);toast(`${n}명 계정 발급 · 안내 발송 필요`);render();break;}
    case 'accReset':{const L=t.dataset.k==='E'?j.evaluators:j.ops;const p=L[+t.dataset.i];modal({title:'비밀번호 재발급',body:`<div>${esc(p.name)} · ${p.acc.id}<br>기존 비밀번호 즉시 사용 불가 · 새 임시 비밀번호 발급</div>`,actions:[{label:'취소',act:'closeModal'},{label:'재발급',act:'doAccReset',cls:'pri',data:`data-k="${t.dataset.k}" data-i="${t.dataset.i}"`}]});break;}
    case 'doAccReset':{closeModal();const L=t.dataset.k==='E'?j.evaluators:j.ops;const p=L[+t.dataset.i];p.acc.pw=genPw();p.acc.sent=false;p.acc.login=null;S.pwShow[p.acc.id]=true;log(j,`비밀번호 재발급 · ${p.name} ${p.acc.id}`);toast('새 임시 비밀번호 발급 · 안내 발송 필요');keepScroll(render);break;}
    case 'accSend':{const k=t.dataset.k;const L=k==='E'?j.evaluators:j.ops;const p=L[+t.dataset.i];modal({title:'계정 안내 발송',body:`<div class="muted" style="margin-bottom:10px">${p.phone} · 알림톡 우선 · 실패 시 SMS</div><div class="msg">${accMsg(j,k,p)}</div>`,actions:[{label:'취소',act:'closeModal'},{label:'발송',act:'doAccSend',cls:'pri',data:`data-k="${k}" data-i="${t.dataset.i}"`}]});break;}
    case 'doAccSend':{closeModal();const L=t.dataset.k==='E'?j.evaluators:j.ops;const p=L[+t.dataset.i];p.acc.sent=true;log(j,`계정 안내 발송 · ${p.name}`);toast(`${p.name} 계정 안내 발송`);keepScroll(render);break;}
    case 'accDel':{const L=t.dataset.k==='E'?j.evaluators:j.ops;const p=L[+t.dataset.i];modal({title:'인력 삭제',body:`<div>${esc(p.name)} · 계정 ${p.acc&&p.acc.issued?p.acc.id+' 즉시 비활성':'미발급'}${t.dataset.k==='E'&&Object.values(j.apps).some(a=>a.evals[p.name])?'<div class="callout warn mt12" style="margin-bottom:0">'+ic('alert')+'<span>제출한 평가 기록 보존 · 로그인만 차단</span></div>':''}</div>`,actions:[{label:'취소',act:'closeModal'},{label:'삭제',act:'doAccDel',cls:'pri',data:`data-k="${t.dataset.k}" data-i="${t.dataset.i}"`}]});break;}
    case 'doAccDel':{closeModal();const L=t.dataset.k==='E'?j.evaluators:j.ops;const p=L.splice(+t.dataset.i,1)[0];j.staff=j.staff.filter(s=>s.name!==p.name);log(j,`인력 삭제 · ${p.name}`);render();break;}
    case 'addPerson':{const k=t.dataset.k;const rooms=j.sched?j.sched.rooms.map(r=>r.name):['1면접실','2면접실'];modal({title:k==='E'?'평가위원 추가':'운영인력 추가',body:`<div class="fgrid"><div class="field"><label>이름</label><input class="input" id="np-n"></div><div class="field"><label>연락처</label><input class="input" id="np-p" placeholder="010-0000-0000"></div></div><div class="field"><label>${k==='E'?'배정 면접실':'역할'}</label><select class="select" id="np-r">${(k==='E'?rooms:OP_ROLES).map(r=>`<option>${r}</option>`).join('')}</select></div><label class="chk"><input type="checkbox" id="np-i" checked>추가와 동시에 계정 발급</label>`,actions:[{label:'취소',act:'closeModal'},{label:'추가',act:'doAddPerson',cls:'pri',data:`data-k="${k}"`}]});break;}
    case 'doAddPerson':{const k=t.dataset.k;const n=$('#np-n').value.trim(),ph=$('#np-p').value.trim();if(!n||!/^01\d-?\d{3,4}-?\d{4}$/.test(ph)){toast('이름·연락처 형식 확인',true);break;}
      const p=k==='E'?{name:n,phone:ph,room:$('#np-r').value,signed:false}:{name:n,phone:ph,role:$('#np-r').value,room:'공통'};
      const id=nextAccId(j,k);p.acc={id,pw:genPw(),issued:$('#np-i').checked,sent:false,login:null};if(p.acc.issued)S.pwShow[id]=true;
      (k==='E'?j.evaluators:j.ops).push(p);j.staff.push({type:k==='E'?'평가위원':'운영자',name:n,in:'',out:'',doc:false});
      closeModal();log(j,`${k==='E'?'평가위원':'운영인력'} 추가 · ${n}${p.acc.issued?' · '+id+' 발급':''}`);toast(`${n} 추가${p.acc.issued?' · '+id+' 발급':''}`);render();break;}
    case 'accCsv':{let csv='구분,이름,연락처,면접실/역할,아이디,상태\n';j.evaluators.forEach(p=>csv+=`평가위원,${p.name},${p.phone},${p.room},${p.acc&&p.acc.issued?p.acc.id:''},${accState(p)[0]}\n`);j.ops.forEach(p=>csv+=`운영인력,${p.name},${p.phone},${p.role},${p.acc&&p.acc.issued?p.acc.id:''},${accState(p)[0]}\n`);download(`계정목록_${j.name}.csv`,csv);toast('계정 목록 다운로드 · 비밀번호 제외');break;}
    case 'invite':modal({title:'마스터 관리자 초대',body:`<div class="field" style="margin:0"><label>이메일</label><input class="input" id="iv" placeholder="name@org.kr"></div>`,actions:[{label:'취소',act:'closeModal'},{label:'초대',act:'doInvite',cls:'pri'}]});break;
    case 'doInvite':{const v=$('#iv').value.trim();if(!/@/.test(v)){toast('이메일 형식 확인',true);break;}MEMBERS.push({n:v.split('@')[0],e:v,d:'',a:false});closeModal();log(null,`멤버 초대 · ${v}`);render();break;}
  }
});

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.inp){S[t.dataset.inp]=t.value;const pos=t.selectionStart;render();const el=document.querySelector(`[data-inp="${t.dataset.inp}"]`);if(el){el.focus();el.setSelectionRange(pos,pos);}return;}
  const j=cur();if(!j)return;
  if(t.dataset.aiq!==undefined){j.ai.qs[+t.dataset.aiq]=t.value;j.ai.saved=false;return;}
});
document.addEventListener('change',e=>{
  const t=e.target;const j=cur();
  if(t.id==='fileIn'){handleFile(t.files[0]);return;}
  if(t.dataset.org!==undefined){ORG[t.dataset.org]=t.type==='number'?+t.value:t.value;log(null,`기관 설정 변경 · ${t.dataset.org}`);return;}
  if(t.dataset.rate){ORG.rates[t.dataset.rate]=+t.value;keepScroll(render);return;}
  if(!j)return;
  if(t.dataset.cfg){j.cfg[t.dataset.cfg]=t.type==='number'?+t.value:t.value;keepScroll(render);return;}
  if(t.dataset.cfgchk){j.cfg[t.dataset.cfgchk]=t.checked;keepScroll(render);return;}
  if(t.dataset.chg==='setField'){j.roster[+t.dataset.i].field=t.value;validateRoster(j);log(j,`지원분야 보정 · ${j.roster[+t.dataset.i].no}`);render();return;}
  if(t.dataset.chg==='moveRoom'&&t.value!==''){const from=j.sched.rooms[+t.dataset.r];const it=from.items.splice(+t.dataset.i,1)[0];const to=j.sched.rooms[+t.value];to.items.push(it);numberSchedule(j);histLog(j,`${it.label} ${from.name} → ${to.name} 이동`);keepScroll(render);return;}
  if(t.dataset.roomstart!==undefined){const r=j.sched.rooms[+t.dataset.roomstart];const old=r.start;r.start=t.value;histLog(j,`${r.name} 시작시간 ${old} → ${t.value}`);keepScroll(render);return;}
  if(t.dataset.blk){const[ri,idx,k]=t.dataset.blk.split(':');const it=j.sched.rooms[+ri].items[+idx];const old=it[k];it[k]=k==='len'?+t.value:t.value;histLog(j,`${j.sched.rooms[+ri].name} ${it.kind==='lunch'?'점심':'휴식'} 블록 ${k==='len'?'길이':'시각'} ${old} → ${it[k]}`);keepScroll(render);return;}
  if(t.dataset.aic){const[i,k]=t.dataset.aic.split(':').map(Number);j.ai.crit[i][k]=k===1?+t.value:t.value;j.ai.saved=false;keepScroll(render);return;}
  if(t.dataset.app){const[no,k]=t.dataset.app.split(':');const a=app(j,no);const old=a[k];a[k]=k==='delay'?(+t.value||0):t.value;
    if(k==='status'){log(j,`${a.ino} 접수 상태 ${old||'공란'} → ${a.status||'공란'}`);if(a.status==='불참'&&j.cfg.type==='group')toast('조별 불참 반영 · 세션 시간 즉시 재산정 · 순번 유지');}
    if(k==='delay'&&a.delay!==+old)toast(`${a.ino} DELAY ${a.delay}분 · 이후 일정 연쇄 반영 · 도착시간 불변`);
    keepScroll(render);return;}
  if(t.dataset.appchk){const[no,k]=t.dataset.appchk.split(':');app(j,no)[k]=t.checked;return;}
  if(t.dataset.quota){j.quota[t.dataset.quota]=+t.value;draftDecisions(j);keepScroll(render);return;}
  if(t.dataset.bonus){const[ty,pt]=t.value.split('|');j.bonus[t.dataset.bonus]={type:ty,pt:+pt};const d=j.decision[t.dataset.bonus];draftDecisions(j);log(j,`가점 입력 · ${app(j,t.dataset.bonus).ino} ${ty} ${pt}`);keepScroll(render);return;}
  if(t.dataset.final){const d=j.decision[t.dataset.final];d.final=t.value;log(j,`합불 조정 · ${app(j,t.dataset.final).ino} ${d.draft} → ${d.final}`);keepScroll(render);return;}
  if(t.dataset.pp){const[k,i,f]=t.dataset.pp.split(':');const p=(k==='E'?j.evaluators:j.ops)[+i];const old=p[f];p[f]=t.value;log(j,`${p.name} ${f==='room'?'면접실':'역할'} ${old} → ${t.value}`);toast(`${p.name} · ${t.value}`);return;}
  if(t.dataset.expire!==undefined){j.expire=t.value.replace(/-/g,'.');return;}
});

document.addEventListener('contextmenu',e=>{if(e.target.closest('.secure')){e.preventDefault();toast('개인정보 보호 영역 · 우클릭 제한',true);}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['p','s'].includes(e.key.toLowerCase())){e.preventDefault();toast('인쇄·저장 제한 · 개인정보 보호',true);}});

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!S.auth&&['lg-id','lg-pw'].includes(e.target.id)){e.preventDefault();document.querySelector('[data-act=login]').click();}});
seed();
render();
</script>
</body>
</html>
