const LOGO=`<svg class="logo-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 479.40 100"><g transform="translate(0 4) scale(0.17969)"><rect width="512" height="512" rx="139" fill="#2466E0"/><g transform="translate(256 256) scale(1.75) translate(-88.3 -80)"><circle cx="60" cy="80" r="40" fill="none" stroke="#FFFFFF" stroke-width="34"/><path d="M88.3 51.7 L143.9 107.3 Q156.6 120 156.6 102 L156.6 40" fill="none" stroke="#FFFFFF" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/></g></g><g fill="#0F1E45" transform="translate(116 85.30)"><path transform="translate(0.00 0) scale(0.10000 -0.10000)" d="M424 -12C640 -12 797 151 797 350V352C797 551 642 712 426 712C210 712 53 549 53 350V348C53 149 208 -12 424 -12ZM426 130C302 130 214 230 214 350V352C214 472 300 570 424 570C548 570 636 470 636 350V348C636 228 550 130 426 130Z"/><path transform="translate(79.00 0) scale(0.10000 -0.10000)" d="M84 70C84 27 117 -6 160 -6C203 -6 236 27 236 70V445L544 41C565 14 587 -4 624 -4H629C672 -4 706 30 706 73V630C706 673 673 706 630 706C587 706 554 673 554 630V269L257 659C236 686 214 704 177 704H161C118 704 84 670 84 627Z"/><path transform="translate(152.00 0) scale(0.10000 -0.10000)" d="M333 -10C484 -10 590 68 590 207V209C590 331 510 381 368 419C247 451 217 464 217 511V513C217 548 247 574 307 574C355 574 403 558 454 527C467 520 480 516 493 516C533 516 565 547 565 587C565 618 548 637 531 648C467 688 394 710 309 710C165 710 64 626 64 499V497C64 359 154 318 296 283C413 254 437 233 437 194V192C437 151 400 126 336 126C268 126 210 150 157 189C146 196 133 203 113 203C73 203 41 172 41 132C41 108 53 86 70 74C149 18 241 -10 333 -10Z"/><path transform="translate(210.00 0) scale(0.10000 -0.10000)" d="M91 71C91 28 125 -6 168 -6C211 -6 245 28 245 71V629C245 672 211 706 168 706C125 706 91 672 91 629Z"/><path transform="translate(237.60 0) scale(0.10000 -0.10000)" d="M247 71C247 28 281 -6 324 -6C367 -6 401 28 401 71V558H549C588 558 620 590 620 629C620 668 588 700 549 700H99C60 700 28 668 28 629C28 590 60 558 99 558H247Z"/><path transform="translate(296.40 0) scale(0.10000 -0.10000)" d="M554 0C593 0 623 29 623 68C623 107 593 137 554 137H237V284H504C543 284 573 313 573 352C573 391 543 421 504 421H237V563H549C588 563 618 592 618 631C618 670 588 700 549 700H161C118 700 84 666 84 623V77C84 34 118 0 161 0Z"/></g></svg>`;
const QS=new URLSearchParams(location.search);
const QPATH='<path d="M13 0h12L15 36H3zM35 0h12L37 36H25z"/>';
const quote=c=>`<svg class="${c}" viewBox="0 0 50 36" fill="currentColor" aria-hidden="true">${QPATH}</svg>`;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hm=(d=new Date())=>pad(d.getHours())+':'+pad(d.getMinutes());
const today=()=>{const d=new Date();return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())}`;};
const ls={get(k){try{return JSON.parse(localStorage.getItem(k));}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};

const FIELDS=[['취업','합격 · 커리어'],['건강','몸과 마음'],['금전','재물 · 행운'],['학업','시험 · 공부'],['사랑','연애 · 인연'],['행복','일상 · 소망']];
const CHEERS={
  '취업':['오늘의 면접관은 이미 당신 편이에요','준비한 만큼, 아니 그 이상 보여줄 거예요','최종 합격 문자가 곧 도착할 예정이에요','당신을 알아볼 회사가 반드시 있어요','긴장은 잠깐, 합격은 오래 가요'],
  '건강':['오늘도 몸과 마음 모두 튼튼하게','푹 자고 잘 먹는 당신이 최고예요','올해 남은 날들, 아프지 말고 건강하게','가벼운 발걸음이 좋은 하루를 데려와요','건강이 최고의 스펙이에요'],
  '금전':['통장에 기분 좋은 숫자가 찍힐 거예요','들어올 돈은 많고 나갈 돈은 적게','오늘 산 커피값이 복으로 돌아와요','지갑이 두둑해지는 계절이 왔어요','뜻밖의 행운이 문을 두드릴 거예요'],
  '학업':['찍은 문제도 다 맞는 기적이 함께해요','오늘 외운 건 시험장까지 그대로','노력한 시간은 절대 배신하지 않아요','집중력 만렙, 합격까지 직진','어려운 문제도 술술 풀리는 하루'],
  '사랑':['좋은 인연이 생각보다 가까이 있어요','마음이 통하는 사람을 곧 만나게 돼요','오늘 웃는 얼굴이 가장 매력적이에요','설레는 연락이 올지도 몰라요','사랑받기 충분한 사람이에요'],
  '행복':['오늘 하루, 작은 행운이 연달아 생겨요','바라는 일이 하나씩 이뤄질 거예요','당신의 하루가 더 반짝이길','웃을 일만 가득한 한 주가 될 거예요','지금처럼만 해도 충분히 잘하고 있어요']
};
const cheer=p=>(CHEERS[p.f]||CHEERS['행복'])[p.mi||0];
const fieldDesc=f=>(FIELDS.find(x=>x[0]===f)||['',''])[1];

/* ---------- 방문객 · QR 내용 ---------- */
const SITE=/^https?:$/.test(location.protocol)?location.href.replace(/[?#].*$/,'').replace(/[^/]*$/,''):'https://wombat20.github.io/onsite/';
const rid=()=>Math.random().toString(36).slice(2,10);
function newVisitor(nm,f){return{id:rid(),nm:String(nm).replace(/~/g,'').trim().slice(0,10),f,mi:Math.floor(Math.random()*5),no:'E-'+(100+Math.floor(Math.random()*900))};}
function slim(p){return{id:p.id,nm:p.nm,f:p.f,mi:p.mi,no:p.no};}
const b64e=t=>btoa(unescape(encodeURIComponent(t))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const b64d=t=>decodeURIComponent(escape(atob(t.replace(/-/g,'+').replace(/_/g,'/'))));
function badgeUrl(p){const fi=FIELDS.findIndex(x=>x[0]===p.f);return SITE+'applicant.html?b='+b64e([p.id,p.nm,fi,p.mi,String(p.no).replace(/^E-/,'')].join('~'));}
function valid(p){return p&&typeof p.nm==='string'&&p.nm.trim()&&CHEERS[p.f]&&Number.isInteger(p.mi)&&p.mi>=0&&p.mi<5;}
function decode(s){if(!s)return null;try{
  let p=null;const c=String(s).match(/[?&]b=([A-Za-z0-9_-]+)/);
  if(c){const a=b64d(c[1]).split('~');if(a.length!==5)return null;const f=(FIELDS[+a[2]]||[])[0];p={id:a[0],nm:a[1],f,mi:+a[3],no:'E-'+a[4]};}
  else{const m=String(s).match(/[?&]badge=([^&#]+)/);if(!m)return null;p=JSON.parse(decodeURIComponent(m[1]));}
  if(!valid(p))return null;
  p.nm=p.nm.trim().slice(0,10);if(!p.id)p.id='x'+[...p.nm].map(c=>c.charCodeAt(0).toString(36)).join('')+p.f.charCodeAt(0).toString(36)+p.mi;return slim(p);
}catch(e){return null;}}
function qrSvg(text){const q=qrcode(0,'M');q.addData(unescape(encodeURIComponent(text)));q.make();return q.createSvgTag({cellSize:4,margin:0,scalable:true});}

/* ---------- 명찰 ---------- */
function nameSize(n){const l=[...n].length;return l<=2?12:l===3?11:l===4?9.5:l<=6?7.5:6;}
function badgeHtml(p){return `<div class="badge">
  <div class="b-logo">${LOGO}</div>
  <div class="b-k">오늘의 지원자</div>
  <div class="b-name" style="font-size:${nameSize(p.nm)}mm">${esc(p.nm)}</div>
  <div class="b-f">#${esc(p.f)} 응원</div>
  <div class="b-msg">${quote('b-q')}${esc(cheer(p))}</div>
  <div class="b-foot">ONSITE 블라인드 면접 체험 · ${today()}</div>
</div>`;}

/* ---------- 흑백 감열 프린터용 명찰 ---------- */
const LOGO_K=LOGO.replace(/#2466E0|#0F1E45/g,'#000');
// 원래 명찰과 같은 구성 · 같은 배치를 검정 한 색으로 (감열 프린터용)
function monoBadgeHtml(p){return `<div class="badge mono">
  <div class="b-logo">${LOGO_K}</div>
  <div class="b-k">오늘의 지원자</div>
  <div class="b-name" style="font-size:${nameSize(p.nm)*57/62}mm">${esc(p.nm)}</div>
  <div class="b-f">#${esc(p.f)} 응원</div>
  <div class="b-msg">${quote('b-q')}${esc(cheer(p))}</div>
  <div class="b-foot">ONSITE 블라인드 면접 체험 · ${today()}</div>
</div>`;}
const monoA5Html=p=>`<div class="mono-a5">${monoBadgeHtml(p)}</div>`;

/* ---------- 명찰 이미지 (PNG) ---------- */
const FONT="'Wanted Sans Variable','Wanted Sans',-apple-system,'Apple SD Gothic Neo',sans-serif";
function loadImg(src){return new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src;});}
function rr(x,X,Y,W,H,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+W,Y,X+W,Y+H,r);x.arcTo(X+W,Y+H,X,Y+H,r);x.arcTo(X,Y+H,X,Y,r);x.arcTo(X,Y,X+W,Y,r);x.closePath();}
function wrapLines(x,text,maxW){const words=text.split(' ');const out=[];let cur='';
  for(const w of words){const t=cur?cur+' '+w:w;if(x.measureText(t).width<=maxW||!cur)cur=t;else{out.push(cur);cur=w;}}
  if(cur)out.push(cur);return out;}
async function badgePng(p,o={}){
  const K=o.mono,C=(c)=>K?'#000':c;   // mono: 감열 프린터용 검정 한 색
  const M=20,PAD=o.bare?0:14,W=62*M,H=100*M,c=document.createElement('canvas');
  c.width=W+PAD*2;c.height=H+PAD*2;const x=c.getContext('2d');
  try{await Promise.all([800,700,500].map(w=>document.fonts.load(`${w} 40px 'Wanted Sans Variable'`,p.nm+cheer(p)+'오늘의 지원자 응원 ONSITE 0123456789.')));}catch(e){}
  if(o.bare){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);}
  else{x.fillStyle='#F2F4F6';x.fillRect(0,0,c.width,c.height);x.translate(PAD,PAD);x.fillStyle='#fff';rr(x,0,0,W,H,3*M);x.fill();}
  x.textAlign='center';x.textBaseline='alphabetic';const cx=W/2;
  const svg=(K?LOGO_K:LOGO).replace(/class="[^"]*"\s*/,'').replace('<svg ','<svg width="479.4" height="100" ');
  try{const im=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg));const lh=5*M,lw=lh*4.794;x.drawImage(im,cx-lw/2,6*M,lw,lh);}catch(e){}
  let y=6*M+5*M+7*M;
  x.fillStyle=C('#8B95A1');x.font=`700 ${2.8*M}px ${FONT}`;x.fillText('오늘의 지원자',cx,y+2.8*M*.8);y+=2.8*M*1.5;
  const ns=nameSize(p.nm)*M;x.fillStyle=C('#191F28');x.font=`800 ${ns}px ${FONT}`;
  if('letterSpacing' in x)x.letterSpacing=`${-0.05*ns}px`;
  y+=2*M;x.fillText(p.nm,cx,y+ns*.88);y+=ns*1.05;if('letterSpacing' in x)x.letterSpacing='0px';
  y+=3*M;const ft=`#${p.f} 응원`;x.font=`700 ${3.2*M}px ${FONT}`;const tw=x.measureText(ft).width,ch=3.2*M*1.5+1.6*M,cw=tw+6*M;
  if(K){x.lineWidth=.35*M;x.strokeStyle='#000';rr(x,cx-cw/2+.2*M,y+.2*M,cw-.4*M,ch-.4*M,ch/2-.2*M);x.stroke();}else{x.fillStyle='#EBF2FF';rr(x,cx-cw/2,y,cw,ch,ch/2);x.fill();}x.fillStyle=C('#1F6BFF');x.fillText(ft,cx,y+ch/2+3.2*M*.36);y+=ch;
  const footY=H-5*M,lineY=footY-2.2*M*1.5-2*M;
  x.fillStyle=C('#E2E5EA');x.fillRect(5*M,lineY,W-10*M,.3*M);
  x.fillStyle=C('#8B95A1');x.font=`500 ${2.2*M}px ${FONT}`;x.fillText(`ONSITE 블라인드 면접 체험 · ${today()}`,cx,footY-2.2*M*.35);
  if('letterSpacing' in x)x.letterSpacing=`${-0.01*4.4*M}px`;x.font=`700 ${4.4*M}px ${FONT}`;
  const lines=wrapLines(x,cheer(p),W-14*M),lh2=4.4*M*1.45,qh=3.75*M+2.2*M;
  const blockH=qh+lines.length*lh2,top=y+(lineY-2.5*M-y-blockH)/2;
  try{const qi=await loadImg('data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="50" height="36" viewBox="0 0 50 36" fill="${C('#1F6BFF')}">${QPATH}</svg>`));x.drawImage(qi,cx-2.6*M,top,5.2*M,3.75*M);}catch(e){}
  x.fillStyle=C('#191F28');x.font=`700 ${4.4*M}px ${FONT}`;lines.forEach((l,i)=>x.fillText(l,cx,top+qh+i*lh2+lh2*.72));
  if(K){x.setTransform(1,0,0,1,0,0);const d=x.getImageData(0,0,c.width,c.height),a=d.data;   // 감열용: 회색 없이 순수 흑/백
    for(let i=0;i<a.length;i+=4){const v=(a[i]+a[i+1]+a[i+2])/3<150?0:255;a[i]=a[i+1]=a[i+2]=v;a[i+3]=255;}x.putImageData(d,0,0);}
  return new Promise(r=>c.toBlob(r,'image/png'));
}
const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.maxTouchPoints>1&&/Mac/.test(navigator.platform));
const inApp=/KAKAOTALK|Instagram|FBAN|FBAV|NAVER|Line\//i.test(navigator.userAgent);
const pngCache={};
function prepare(p){const k=JSON.stringify(slim(p));return pngCache[k]||(pngCache[k]=badgePng(p).then(b=>(pngCache[k+'#b']=b)));}
function note(m){document.querySelectorAll('.ob-toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='ob-toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}
async function saveBadge(p,btn){
  const k=JSON.stringify(slim(p)),name=`ONSITE_응원명찰_${p.nm}.png`;
  let blob=pngCache[k+'#b'];   // 미리 그려둔 이미지 → 탭 직후 바로 공유 (iOS 제스처 유지)
  try{
    if(!blob){if(btn)btn.disabled=true;blob=await prepare(p);}
    const file=new File([blob],name,{type:'image/png'});
    if(isMobile&&!inApp&&navigator.canShare&&navigator.canShare({files:[file]})){
      try{await navigator.share({files:[file]});return;}catch(e){if(e.name==='AbortError')return;}
    }
    if(isMobile){showSaved(URL.createObjectURL(blob));return;}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    note('명찰 이미지를 저장했어요');
  }catch(e){note('저장하지 못했어요. 화면을 캡처해 주세요');}
  finally{if(btn)btn.disabled=false;}
}
function showSaved(url){
  document.querySelector('.sv-ov')?.remove();
  const d=document.createElement('div');d.className='sv-ov';
  d.innerHTML=`<img src="${url}" alt="응원 명찰 이미지"><div class="sv-tip">이미지를 길게 눌러 저장하세요<span>사진 앱에 저장돼요</span></div><div class="sv-act"><button class="ob-btn ghost" data-ob="close">닫기</button></div>`;
  d.addEventListener('click',e=>{if(e.target===d||e.target.closest('[data-ob=close]'))d.remove();});document.body.appendChild(d);
}

/* ---------- 중계 (ntfy) ----------
   운영자 체크인 폰 → 중계 채널에 1건 발행 → 아이맥(출력)·방문객 폰(완료 표시)이 함께 받음 */
const RELAY=(QS.get('relay')||'https://ntfy.sh').replace(/\/$/,'');
const TOPIC=QS.get('ch')||'onsite-kpa25-booth-7q2m9x';
const LOCAL=RELAY==='local';
const bc=LOCAL&&'BroadcastChannel' in window?new BroadcastChannel('onsite-'+TOPIC):null;
async function publish(obj){
  const body=JSON.stringify(obj);
  if(LOCAL){bc&&bc.postMessage(body);return true;}
  try{const r=await fetch(`${RELAY}/${TOPIC}`,{method:'POST',body});return r.ok;}catch(e){return false;}
}
function subscribe(onMsg,opt={}){
  let es=null,closed=false,lastId=opt.lastId||null,timer=null,fails=0;
  let since0=opt.since||Math.floor(Date.now()/1000)-60;
  const state=s=>opt.onState&&opt.onState(s);
  const handle=(raw,id,time)=>{let m;try{m=JSON.parse(raw);}catch(e){return;}if(m&&m.v===1)onMsg(m,id,time);};
  if(LOCAL){const f=e=>handle(e.data);bc&&bc.addEventListener('message',f);state('on');return{close(){bc&&bc.removeEventListener('message',f);}};}
  function open(){
    if(closed)return;
    es=new EventSource(`${RELAY}/${TOPIC}/sse?since=${encodeURIComponent(lastId||since0)}`);
    es.addEventListener('open',()=>{fails=0;state('on');});
    es.onmessage=e=>{let d;try{d=JSON.parse(e.data);}catch(_){return;}
      if(d.event!=='message')return;lastId=d.id;opt.onId&&opt.onId(d.id);handle(d.message,d.id,d.time);};
    es.onerror=()=>{state('off');es.close();clearTimeout(timer);
      if(++fails>=2&&lastId){lastId=null;since0=Math.floor(Date.now()/1000)-600;}   // 기억한 위치가 만료됐으면 최근 10분부터
      timer=setTimeout(open,Math.min(3000*fails,15000));};
  }
  open();
  const vis=()=>{if(document.visibilityState==='visible'&&!closed){es&&es.close();clearTimeout(timer);open();}};
  document.addEventListener('visibilitychange',vis);
  return{close(){closed=true;es&&es.close();clearTimeout(timer);document.removeEventListener('visibilitychange',vis);}};
}

return{LOGO,LOGO_K,monoBadgeHtml,monoA5Html,QS,quote,esc,pad,hm,today,ls,FIELDS,CHEERS,cheer,fieldDesc,SITE,newVisitor,slim,badgeUrl,decode,qrSvg,
  nameSize,badgeHtml,badgePng,prepare,saveBadge,showSaved,note,isMobile,RELAY,TOPIC,LOCAL,publish,subscribe};
})();
</script>
<script>
document.getElementById('pg').innerHTML=`${OB.LOGO}
  <div class="k">ONSITE 부스 · 1분 체험</div>
  <h1><em>면접 지원자</em>가<br>되어 보세요</h1>
  <div class="qr">${OB.qrSvg(OB.SITE+'applicant.html?booth=1')}</div>
  <div class="cam">휴대폰 카메라로 QR을 찍어 주세요</div>
  <ol><li><b>지원자 등록</b>이름과 응원받고 싶은 분야를 골라요</li><li><b>출석 체크인</b>출석 QR을 운영자 폰에 비춰요</li><li><b>명찰 받기</b>응원 메시지가 담긴 명찰이 나와요</li></ol>`;
</script>
