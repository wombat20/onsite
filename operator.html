<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONSITE — 운영관리자 (모바일)</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22512%22%20height%3D%22512%22%20viewBox%3D%220%200%20512.00%20512.00%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22139%22%20fill%3D%22%232466E0%22%2F%3E%3Cg%20transform%3D%22translate%28256%20256%29%20scale%281.75%29%20translate%28-88.3%20-80%29%22%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2280%22%20r%3D%2240%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2234%22%2F%3E%3Cpath%20d%3D%22M88.3%2051.7%20L143.9%20107.3%20Q156.6%20120%20156.6%20102%20L156.6%2040%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2234%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<style>
:root{
  --pri:#2466E0;--pri-h:#1D56C4;--pri-weak:#EEF3FE;--pri-line:#C9D8F7;--navy:#0F1E45;--sky:#7FA6F0;
  --tx:#0F1E45;--tx2:#5A6684;--tx3:#98A2B8;--line:#ECEEF3;--line2:#DFE3EB;
  --bg:#FFFFFF;--bg-sub:#F5F7FB;--hover:#EEF1F7;
  --ok:#1F9254;--ok-weak:#EAF6EF;--warn:#B8740F;--warn-weak:#FDF6EA;--err:#E5383B;--err-weak:#FDF1F1;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Wanted Sans Variable','Wanted Sans','Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:-0.01em;color:var(--tx);line-height:1.5;background:#EDEEF1;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:24px 0 34px;-webkit-font-smoothing:antialiased;}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit;}
button{background:none;border:0;cursor:pointer;}
svg.i{width:18px;height:18px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
svg.i.s14{width:14px;height:14px;} svg.i.s22{width:22px;height:22px;}

/* 시연 컨트롤 (프레임 밖) */
.doc-tag{font-size:12px;color:#8A8F99;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.doc-tag .logo-sym{height:12px;width:auto;display:inline-block;vertical-align:-1px;margin-right:5px;}
.demo{display:flex;align-items:center;gap:4px;background:#fff;border:1px solid #E1E3E8;border-radius:8px;padding:3px 4px 3px 10px;}
.demo b{color:var(--tx);font-variant-numeric:tabular-nums;margin:0 4px;}
.demo button{height:24px;padding:0 8px;border-radius:5px;font-size:12px;color:var(--tx2);}
.demo button:hover{background:var(--hover);color:var(--tx);}

/* 프레임 */
.frame{width:392px;height:866px;background:var(--bg);border:1px solid #E1E3E8;border-radius:28px;overflow:hidden;display:flex;flex-direction:column;position:relative;box-shadow:0 14px 30px rgba(22,22,29,.06),0 44px 88px rgba(22,22,29,.08);}
.statusbar{height:50px;flex-shrink:0;position:relative;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 9px;}
.statusbar .t{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;}
.statusbar .sys{display:flex;align-items:center;gap:6px;}
.island{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:104px;height:30px;background:#0b0b0e;border-radius:16px;}
.main{flex:1;overflow:hidden;position:relative;}
.main::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:var(--wm);z-index:5;}
.page{height:100%;overflow-y:auto;padding:8px 20px 28px;}
.page::-webkit-scrollbar{width:0;}
.secure{-webkit-user-select:none;user-select:none;}
body.shield .main{filter:blur(10px);}
.frame.pre .main::after{display:none;}
.shield-ov{display:none;position:absolute;inset:50px 0 0;z-index:40;align-items:center;justify-content:center;}
body.shield .shield-ov{display:flex;}
.shield-ov div{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:16px 20px;text-align:center;font-size:13px;color:var(--tx2);box-shadow:0 12px 32px -8px rgba(15,30,69,.18);}
.shield-ov b{display:block;color:var(--tx);font-size:14.5px;margin-bottom:2px;}

/* 공통 */
.appbar{display:flex;align-items:center;height:44px;margin-bottom:12px;}
.appbar .logo-sym{height:22px;width:auto;display:block;}
.iconbtn{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;color:var(--tx2);}
.iconbtn:hover{background:var(--hover);}
.iconbtn .nd{position:absolute;top:7px;right:6px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--err);color:#fff;font-size:10.5px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.ml{margin-left:auto;} .mr-8{margin-right:-8px;}
.ttl{font-size:22px;font-weight:700;letter-spacing:-0.025em;margin:6px 0 4px;}
.sub{font-size:13px;color:var(--tx2);margin-bottom:20px;}
.sec{margin-top:28px;}
.sec-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin-bottom:8px;}
.sec-h .meta{font-size:12.5px;font-weight:500;color:var(--tx3);}
.note{font-size:12px;color:var(--tx3);line-height:1.55;margin-top:10px;}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:var(--tx3);white-space:nowrap;}
.st::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.st.pri{color:var(--pri);} .st.ok{color:var(--ok);} .st.warn{color:var(--warn);} .st.err{color:var(--err);} .st.mute{color:var(--tx2);}
.callout{display:flex;align-items:flex-start;gap:8px;padding:11px 13px;border-radius:10px;font-size:13px;line-height:1.5;margin-bottom:14px;}
.callout svg{margin-top:1px;}
.callout.err{background:var(--err-weak);color:var(--err);} .callout.warn{background:var(--warn-weak);color:var(--warn);} .callout.pri{background:var(--pri-weak);color:var(--pri);} .callout.ok{background:var(--ok-weak);color:var(--ok);}
.callout b{font-weight:700;}
.btn{height:48px;border-radius:12px;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;background:var(--pri);color:#fff;width:100%;}
.btn:hover{background:var(--pri-h);}
.btn.ghost{background:#fff;color:var(--tx);border:1px solid var(--line2);}
.btn.ghost:hover{background:var(--hover);}
.btn.soft{background:var(--bg-sub);color:var(--tx);} .btn.soft:hover{background:var(--hover);}
.btn.danger{background:var(--err);}
.btn.sm{height:36px;font-size:13.5px;border-radius:9px;width:auto;padding:0 14px;}
.btn[disabled]{opacity:.35;pointer-events:none;}
.btns{display:flex;gap:8px;}
.input{width:100%;height:46px;border:1px solid var(--line2);border-radius:10px;padding:0 14px;font-size:15px;outline:none;background:#fff;}
.input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(36,102,224,.12);}
textarea.input{height:auto;min-height:88px;padding:12px 14px;resize:none;line-height:1.5;}
.flabel{font-size:13px;font-weight:600;color:var(--tx2);margin:16px 0 7px;}
.seg{display:flex;background:var(--bg-sub);border-radius:10px;padding:3px;gap:2px;}
.seg button{flex:1;height:34px;border-radius:8px;font-size:13.5px;font-weight:500;color:var(--tx2);white-space:nowrap;}
.seg button.on{background:#fff;color:var(--tx);font-weight:700;box-shadow:0 1px 2px rgba(15,30,69,.1);}
.chips{display:flex;flex-wrap:wrap;gap:6px;}
.chip{height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--line2);font-size:13.5px;font-weight:500;color:var(--tx2);background:#fff;}
.chip.on{border-color:var(--pri);background:var(--pri-weak);color:var(--pri);font-weight:700;}
.chip.on.err{border-color:var(--err);background:var(--err-weak);color:var(--err);}
.chip.on.warn{border-color:var(--warn);background:var(--warn-weak);color:var(--warn);}
.search{display:flex;align-items:center;gap:8px;height:44px;background:var(--bg-sub);border-radius:10px;padding:0 12px;color:var(--tx3);flex:1;}
.search input{flex:1;border:0;background:none;outline:none;font-size:14px;color:var(--tx);min-width:0;}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:14.5px;cursor:pointer;}
.toggle:last-child{border-bottom:0;}
.cbox{width:22px;height:22px;border:1.6px solid var(--line2);border-radius:6px;flex-shrink:0;position:relative;background:#fff;}
.cbox.on{background:var(--pri);border-color:var(--pri);}
.cbox.on::after{content:"";position:absolute;width:10px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);top:5px;left:4.5px;}
.kv{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;}
.kv:last-child{border-bottom:0;}
.kv .k{color:var(--tx2);} .kv .v{font-weight:600;font-variant-numeric:tabular-nums;}

/* 운영보드 */
.job .org{font-size:12.5px;color:var(--tx3);font-weight:500;}
.job .nm{font-size:15px;font-weight:600;letter-spacing:-0.02em;line-height:1.45;color:var(--tx2);}
.hero{margin-top:20px;}
.hero .big{font-size:26px;font-weight:700;letter-spacing:-0.03em;line-height:1.3;}
.hero .big em{font-style:normal;color:var(--pri);}
.hero .big small{font-size:15px;color:var(--tx3);font-weight:600;margin-left:4px;}
.pbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:14px;}
.pbar i{display:block;height:100%;background:var(--pri);border-radius:3px;transition:width .3s;}
.facts{display:flex;margin-top:16px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}
.fact{flex:1;min-width:0;}
.fact+.fact{padding-left:12px;border-left:1px solid var(--line);margin-left:12px;}
.fact span{display:block;font-size:12px;color:var(--tx3);margin-bottom:2px;white-space:nowrap;}
.fact b{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
.fact.warn b{color:var(--warn);} .fact.err b{color:var(--err);}
.nowstrip{padding:4px 16px;}
.sess{background:#fff;border-radius:16px;padding:2px 14px 4px;margin-top:10px;}
.sess .prow:last-child{border-bottom:0;}
.sess-h{border-bottom-color:var(--line);}
.block{background:#E3E7EF;}
.nowrow{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:13.5px;}
.nowrow+.nowrow{border-top:1px solid var(--line);}
.nowrow .rn{font-weight:700;width:58px;flex-shrink:0;}
.nowrow .ss{flex:1;color:var(--tx2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nowrow .ss b{color:var(--tx);}
.dly{font-size:11.5px;font-weight:700;color:var(--err);margin-left:3px;}
.shr{font-size:11.5px;font-weight:700;color:var(--ok);margin-left:3px;}
.tools{display:flex;gap:8px;margin:12px 0 4px;}
.qrbtn{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;background:var(--pri);color:#fff;border-radius:10px;font-size:14px;font-weight:700;white-space:nowrap;}
.sess{margin-top:6px;}
.lhead{display:flex;gap:10px;font-size:11.5px;color:var(--tx3);padding:12px 4px 0;}
.lhead span:first-child{width:46px;} .lhead span:nth-child(2){flex:1;}
.sess-h{display:flex;align-items:baseline;gap:8px;padding:10px 0 8px;border-bottom:1px solid var(--line2);}
.sess-h .tm{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-0.02em;}
.sess-h .lb{font-size:12.5px;color:var(--tx2);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sess-h .rc{font-size:12.5px;color:var(--ok);font-weight:600;}
.sess.now .sess-h .tm{color:var(--pri);}
.sess.done .sess-h .tm,.sess.done .sess-h .lb{color:var(--tx3);}
.nowtag{font-size:11.5px;font-weight:700;color:#fff;background:var(--pri);border-radius:4px;padding:0 6px;line-height:18px;}
.prow{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
.prow:hover{background:var(--bg-sub);}
.prow .no{width:46px;flex-shrink:0;font-size:12.5px;color:var(--tx3);font-variant-numeric:tabular-nums;}
.prow .who{flex:1;min-width:0;}
.prow .l1{font-size:14.5px;font-weight:700;display:flex;gap:6px;align-items:baseline;}
.prow .l1 span{font-weight:500;color:var(--tx2);font-size:14px;}
.prow .l2{font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prow .l2 i{font-style:normal;color:var(--err);font-weight:600;}
.prow.absent .l1,.prow.absent .l1 span{color:var(--tx3);text-decoration:line-through;}
.block{display:flex;align-items:center;gap:8px;padding:11px 12px;margin-top:14px;background:var(--bg-sub);border-radius:10px;font-size:13px;color:var(--tx2);cursor:pointer;}
.block b{font-variant-numeric:tabular-nums;color:var(--tx);}
.block .ed{margin-left:auto;color:var(--tx3);font-size:12.5px;display:flex;align-items:center;gap:3px;}
.empty{padding:28px 16px;text-align:center;font-size:13.5px;color:var(--tx3);line-height:1.6;background:var(--bg-sub);border-radius:12px;margin-top:14px;}

/* 바텀시트 · 다이얼로그 · 토스트 */
.dim{position:absolute;inset:0;background:rgba(15,30,69,.36);z-index:20;display:flex;flex-direction:column;justify-content:flex-end;}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;border-radius:20px 20px 0 0;max-height:88%;overflow-y:auto;padding:10px 20px 26px;}
.dim.anim{animation:fade .15s;} .dim.anim .sheet{animation:up .2s;}
.sheet::-webkit-scrollbar{width:0;}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.grab{width:36px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 12px;}
.sh-h{display:flex;align-items:flex-start;gap:10px;margin-bottom:6px;}
.sh-h .ino{font-size:28px;font-weight:800;letter-spacing:-0.03em;line-height:1.15;}
.sh-h .nm{font-size:15px;font-weight:600;margin-top:2px;}
.sh-h .meta{font-size:12.5px;color:var(--tx3);}
.sh-title{font-size:18px;font-weight:700;margin-bottom:4px;}
.stepper{display:flex;align-items:center;gap:8px;}
.stepper button{width:46px;height:46px;border-radius:10px;background:var(--bg-sub);font-size:13px;font-weight:700;color:var(--tx2);}
.stepper button:hover{background:var(--hover);}
.stepper .input{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;flex:1;}
.call{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 10px;border-radius:14px;background:var(--pri-weak);color:var(--pri);font-size:12.5px;font-weight:700;text-decoration:none;margin-left:8px;}
.dlg-wrap{position:absolute;inset:0;background:rgba(15,30,69,.42);z-index:30;display:flex;align-items:center;justify-content:center;padding:28px;animation:fade .15s;}
.dlg{background:#fff;border-radius:16px;padding:22px 20px 18px;width:100%;}
.dlg b{display:block;font-size:16.5px;margin-bottom:6px;}
.dlg p{font-size:13.5px;color:var(--tx2);line-height:1.55;margin-bottom:18px;}
.toast{position:absolute;left:16px;right:16px;bottom:92px;background:var(--navy);color:#fff;font-size:13px;padding:12px 14px;border-radius:10px;z-index:50;display:flex;gap:8px;align-items:flex-start;animation:up .2s;line-height:1.45;}
.toast.red{background:var(--err);}

/* 체크인 */
.idchk{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid transparent;background:#fff;border-radius:14px;cursor:pointer;}
.idchk.on{border-color:var(--pri);background:var(--pri-weak);}
.idchk .t{font-size:14.5px;font-weight:700;} .idchk .d{font-size:12.5px;color:var(--tx2);}
.vf{margin-top:12px;height:270px;border-radius:16px;background:#121826;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.vf .box{width:170px;height:170px;position:relative;}
.vf .box i{position:absolute;width:30px;height:30px;border:3px solid #fff;}
.vf .box i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0;border-radius:8px 0 0 0;}
.vf .box i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0;border-radius:0 8px 0 0;}
.vf .box i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 8px;}
.vf .box i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 8px 0;}
.vf .line{position:absolute;left:12px;right:12px;height:2px;background:var(--sky);top:12px;animation:scan 1.8s ease-in-out infinite alternate;box-shadow:0 0 12px var(--sky);}
@keyframes scan{to{top:156px}}
.vf .cap{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:rgba(255,255,255,.75);font-size:12.5px;}
.vf.off{background:#2A3142;} .vf.off .line{display:none;} .vf.off .box i{border-color:rgba(255,255,255,.3);}
.res{text-align:center;padding:24px 16px 18px;background:#fff;border-radius:20px;}
.res .ic{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:var(--ok-weak);color:var(--ok);}
.res .ic svg{width:28px;height:28px;stroke-width:2.4;}
.res.warn .ic{background:var(--warn-weak);color:var(--warn);}
.res .lab{font-size:13px;color:var(--tx2);font-weight:600;}
.res .ino{font-size:52px;font-weight:800;letter-spacing:-0.04em;line-height:1.1;margin:4px 0 2px;}
.res .nm{font-size:17px;font-weight:700;}
.res .meta{font-size:13px;color:var(--tx3);margin-top:2px;}
.recent .r{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px;}
.recent .r:last-child{border-bottom:0;}
.recent .r .tm{color:var(--tx3);font-variant-numeric:tabular-nums;width:40px;}
.recent .r b{font-weight:700;}
.recent .r .how{margin-left:auto;font-size:12px;color:var(--tx3);}

/* 행동 강령 */
.sum .big{font-size:26px;font-weight:700;letter-spacing:-0.03em;line-height:1.35;}
.sum .big em{font-style:normal;color:var(--pri);}
.sum .big em.err{color:var(--err);}
.titem{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
.card .titem:last-child{border-bottom:0;}
.titem .tchk{width:24px;height:24px;border:1.6px solid var(--line2);border-radius:7px;flex-shrink:0;cursor:pointer;position:relative;}
.titem .tchk.on{background:var(--pri);border-color:var(--pri);}
.titem .tchk.on::after{content:"";position:absolute;width:10px;height:5px;border-left:2px solid #fff;border-bottom:2px solid #fff;transform:rotate(-45deg);top:6px;left:5px;}
.titem .tm{font-size:15px;font-weight:700;width:46px;flex-shrink:0;font-variant-numeric:tabular-nums;}
.titem .bd{flex:1;min-width:0;}
.titem .do{font-size:14px;font-weight:600;}
.titem .who{font-size:12px;color:var(--tx3);}
.titem.late .tm{color:var(--err);}
.titem.soon .tm{color:var(--pri);}
.titem.fin .tm,.titem.fin .do{color:var(--tx3);}
.card .nowline{margin:8px 0;}
.nowline{display:flex;align-items:center;gap:8px;margin:2px 0;font-size:11.5px;font-weight:700;color:var(--pri);}
.nowline::after{content:'';flex:1;height:1.5px;background:var(--pri);}
.fhead{display:flex;align-items:center;justify-content:space-between;padding:14px 0;cursor:pointer;border-top:1px solid var(--line2);margin-top:8px;font-size:14px;font-weight:600;color:var(--tx2);}

<script>
const TODAY=(()=>{const d=new Date();d.setHours(0,0,0,0);return d;})();
function DD(s){const[y,m,d]=s.split('.').map(Number);const o=Math.round((new Date(y,m-1,d)-new Date(2025,5,12))/864e5);const r=new Date(TODAY);r.setDate(r.getDate()+o);return r.getFullYear()+'.'+String(r.getMonth()+1).padStart(2,'0')+'.'+String(r.getDate()).padStart(2,'0');}

/* ===== 공통 엔진 (마스터 관리자와 동일 로직) ===== */
const pad=n=>String(n).padStart(2,'0');
const T=s=>{if(!s)return 0;const[a,b]=s.split(':').map(Number);return a*60+b;};
const HM=m=>pad(Math.floor(m/60))+':'+pad(((m%60)+60)%60);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const won=n=>n.toLocaleString('ko-KR');
const hash=s=>{let h=2166136261;for(const c of String(s))h=Math.imul(h^c.charCodeAt(0),16777619)>>>0;return h;};
const rnd=(seed,n)=>hash(seed)%n;
const sum=a=>a.reduce((x,y)=>x+y,0);
const SURN='김이박최정강조윤장임한오서신권황안송류홍'.split('');
const GIVEN=['민준','서연','도윤','지우','하준','서윤','시우','하은','지호','수아','예준','지민','유진','현우','채원','준서','다은','건우','소율','우진','예린','태윤','나연','정훈','가은'];
function mkName(seed){return SURN[rnd(seed+'s',SURN.length)]+GIVEN[rnd(seed+'g',GIVEN.length)];}
function mkRoster(spec,prefix){
  const rows=[];let k=1;
  spec.forEach(([field,n])=>{for(let i=0;i<n;i++){const no=`${prefix}-${String(1000+k).slice(1)}`;const seed=no+field;
    rows.push({no,name:mkName(seed),field,phone:`010-${String(2000+rnd(seed+'p',7000))}-${String(1000+rnd(seed+'q',8999))}`,birth:`${1994+rnd(seed+'b',9)}${pad(1+rnd(seed+'m',12))}${pad(1+rnd(seed+'d',28))}`});k++;}});
  return rows;
}
function blankApp(){return{ino:'',status:'',device:'',inR:false,outR:false,fee:false,delay:0,note:'',evals:{}};}
function validRoster(j){const bad=new Set(j.rosterErrs.map(e=>e.no));return j.roster.filter(r=>!bad.has(r.no));}
function fields(j){const m={};validRoster(j).forEach(r=>{m[r.field]=(m[r.field]||0)+1;});return m;}
function app(j,no){return j.apps[no]||(j.apps[no]=blankApp());}
function person(j,no){return j.roster.find(r=>r.no===no);}
function unitLen(j,attend){const c=j.cfg;return c.type==='group'?Math.min(c.groupMaxMin,attend*c.perMin):c.dur;}
function buildSchedule(j){
  const c=j.cfg;const R=Math.max(1,+c.rooms||1);
  const byF={};validRoster(j).forEach(r=>{(byF[r.field]=byF[r.field]||[]).push(r.no);});
  let pieces=Object.entries(byF).map(([f,nos])=>{const units=[];const size=c.type==='group'?Math.max(1,+c.groupMax):1;for(let i=0;i<nos.length;i+=size)units.push(nos.slice(i,i+size));return{field:f,units};});
  while(pieces.length<R){pieces.sort((a,b)=>b.units.length-a.units.length);const p=pieces[0];if(p.units.length<2)break;const h=Math.ceil(p.units.length/2);pieces.splice(0,1,{field:p.field,units:p.units.slice(0,h)},{field:p.field,units:p.units.slice(h)});}
  pieces.sort((a,b)=>b.units.length-a.units.length);
  const rooms=Array.from({length:R},(_,i)=>({name:`${i+1}면접실`,start:c.start,items:[],load:0}));
  pieces.forEach(p=>{const r=rooms.reduce((a,b)=>b.load<a.load?b:a);p.units.forEach(u=>r.items.push({kind:'s',id:'s'+Math.random().toString(36).slice(2,8),field:p.field,members:u}));r.load+=sum(p.units.map(u=>unitLen(j,u.length)+c.rest));});
  // 점심 자동 배치: 11:30~13:30 구간 고려, 세션이 점심 기준 시각을 크게 넘기면 그 앞에 삽입, 오전 조기 종료 시 생략
  rooms.forEach(r=>{
    let cur=T(r.start);const out=[];let placed=!c.lunch;
    r.items.forEach((it,idx)=>{
      const len=unitLen(j,it.members.length);
      if(!placed&&cur>=T('11:30')&&cur+len>T(c.lunchStart)+20){out.push({kind:'lunch',id:'l'+idx,start:HM(Math.min(cur,T('13:30'))),len:+c.lunchLen});cur=Math.max(cur,T('11:30'))+(+c.lunchLen);placed=true;}
      out.push(it);cur+=len+(+c.rest);
    });
    r.items=out;delete r.load;
  });
  j.sched={rooms};
  numberSchedule(j);
}
function numberSchedule(j){
  // 면접번호·조 번호: 시간표(계획) 순서 기준
  const all=[];j.sched.rooms.forEach((r,ri)=>timeline(j,r,false).forEach(x=>{if(x.kind==='s')all.push({x,ri});}));
  all.sort((a,b)=>a.x.s-b.x.s||a.ri-b.ri);
  const cnt={},gcnt={};
  all.forEach(({x})=>{gcnt[x.field]=(gcnt[x.field]||0)+1;x.it.label=j.cfg.type==='group'?`${x.field} ${gcnt[x.field]}조`:x.field;x.members.forEach(no=>{cnt[x.field]=(cnt[x.field]||0)+1;app(j,no).ino=x.field+pad(cnt[x.field]);});});
}
function timeline(j,room,actual){
  const c=j.cfg;let cur=T(room.start);const out=[];
  room.items.forEach(it=>{
    if(it.kind==='lunch'||it.kind==='break'){const s=Math.max(cur,T(it.start));out.push({kind:it.kind,it,s,e:s+it.len});cur=s+it.len;return;}
    const attend=actual?it.members.filter(no=>app(j,no).status!=='불참').length:it.members.length;
    const len=c.type==='group'?Math.min(c.groupMaxMin,attend*c.perMin):(actual&&attend===0?c.dur:c.dur);
    const planLen=unitLen(j,it.members.length);
    let s=cur;
    if(actual){const arr=Math.min(...it.members.map(no=>T(arriveOf(j,no))||0));if(arr)s=Math.max(cur,arr+10);}
    const delay=actual?sum(it.members.map(no=>+app(j,no).delay||0)):0;
    const e=s+len+delay;
    out.push({kind:'s',it,field:it.field,members:it.members,s,e,len,planLen,delay,attend,label:it.label});
    cur=e+(len>0?+c.rest:0);
  });
  return out;
}
function planOf(j){const m={};if(!j.sched)return m;j.sched.rooms.forEach(r=>timeline(j,r,false).forEach(x=>{if(x.kind==='s')x.members.forEach(no=>m[no]={s:x.s,e:x.e,room:r.name,label:x.label});}));return m;}
function arriveOf(j,no){if(j.arrive[no])return j.arrive[no];const p=planOf(j)[no];return p?HM(p.s-(+j.cfg.arrive)):'';}
function roomOf(j,no){if(!j.sched)return null;for(const r of j.sched.rooms)for(const it of r.items)if(it.kind==='s'&&it.members.includes(no))return r;return null;}

  ${late.length?`<button class="cd-row" data-act="tab" data-t="conduct"><span class="st err">행동 강령 미완료 ${late.length}건</span><span class="go">확인${ic('chev','s14')}</span></button>`:''}

    <div class="tools"><label class="search">${ic('search','s14')}<input placeholder="이름·수험번호·면접번호" data-inp="q" value="${esc(S.q)}"></label><button class="qrbtn" data-act="tab" data-t="checkin">${ic('qr','s14')}QR 체크인</button></div>

}
function sessRows(list,showRoom){
  const q=S.q.trim();
  return list.map(o=>{
    if(o.x.kind!=='s'){if(q)return '';const it=o.x.it;return `<div class="block" data-act="editBlk" data-r="${o.ri}" data-i="${o.room.items.indexOf(it)}"><span>${o.x.kind==='lunch'?'점심시간':'휴식 및 평정'}</span><b>${HM(o.x.s)}–${HM(o.x.e)}</b><span class="ed">${ic('edit','s14')}조기 종료 반영</span></div>`;}
    const x=o.x,p=o.p;const mem=x.members.filter(no=>{if(!q)return true;const pp=P(no);return (pp.name+no+A(no).ino).includes(q);});
    if(!mem.length)return '';
    const shift=sh0(x);const isNow=x.s<=S.now&&x.e>S.now,done=x.e<=S.now;
    return `<div class="sess ${isNow?'now':''} ${done?'done':''}"><div class="sess-h"><span class="tm">${HM(x.s)}${shift>0?`<span class="dly">+${shift}</span>`:shift<0?`<span class="shr">${shift}</span>`:''}</span><span class="lb">${showRoom?o.room.name+' · ':''}${x.label} · ${x.attend}/${x.members.length}명 · ${x.len}분${!done?` · 대기 ${HM(x.s-10)}`:''}</span>${x.len!==x.planLen?'<span class="rc">재산정</span>':''}${isNow?'<span class="nowtag">진행 중</span>':''}</div>
      ${mem.map(no=>{const a=A(no),pp=P(no);return `<div class="prow ${a.status==='불참'?'absent':''}" data-act="open" data-no="${no}"><span class="no">${J.arrive[no]}</span><div class="who"><div class="l1">${a.ino}<span>${esc(pp.name)}</span></div><div class="l2">${no}${ORG.useDevice&&a.device?` · 기기 ${a.device}`:''}${a.inR?' · 입실':''}${a.outR?' · 퇴실':''}${a.delay?` · <i>DELAY +${a.delay}</i>`:''}${a.note?` · ${esc(a.note)}`:''}</div></div><span class="st ${statusCls(a.status)}">${stLabel(a.status)}</span></div>`;}).join('')}</div>`;
  }).join('');
}
function boardList(){
  let list=[];
  if(S.room==='all'){J.sched.rooms.forEach((rm,ri)=>{const tl=timeline(J,rm,true),pl=timeline(J,rm,false);tl.forEach((x,i)=>{if(x.kind==='s')list.push({x,p:pl[i],room:rm,ri});});});list.sort((a,b)=>a.x.s-b.x.s);}
  else{const rm=J.sched.rooms[S.room];const tl=timeline(J,rm,true),pl=timeline(J,rm,false);list=tl.map((x,i)=>({x,p:pl[i],room:rm,ri:S.room}));}
  const h=sessRows(list,S.room==='all');
  return h.trim()?h:`<div class="empty">검색 결과 없음</div>`;
}

/* ===== QR 체크인 (PRD 9.3·9.4) ===== */
function nextCandidate(){return R().map(r=>r.no).filter(no=>{const s=A(no).status;return s!=='접수'&&s!=='불참';}).sort((a,b)=>T(J.arrive[a])-T(J.arrive[b]))[0];}
function pgCheckin(){
  const c=S.ck;
  const head=`<div class="ttl">QR 체크인</div><div class="sub">신분증 확인 후 QR을 스캔하면 바로 출석 처리돼요</div>`;
  if(c.step==='result'){const no=c.no,a=A(no),pp=P(no),so=sessionOf(no);const r=c.res;
    return head+`<div class="res ${r==='ok'?'':'warn'}"><div class="ic">${ic(r==='ok'?'check':'alert')}</div>
      <div class="lab">${r==='ok'?`출석 처리 완료 · ${a.ck.how}`:r==='dup'?`이미 접수됨 · ${a.ck.at}`:'불참 처리된 지원자'}</div>
      <div class="ino">${a.ino}</div><div class="nm">${esc(pp.name)}</div><div class="meta">${no} · ${pp.field} · ${so.room.name} ${so.x.label}</div></div>
      ${r==='absent'?`<div class="callout warn">${ic('alert','s14')}<span>불참 처리 이력 있음 · 현장 도착 확인 시 접수로 변경</span></div>`:''}
      <div class="card" style="padding:2px 16px">
        <div class="kv"><span class="k">도착시간</span><span class="v">${J.arrive[no]}</span></div>
        <div class="kv"><span class="k">대기실 이동</span><span class="v">${HM(so.x.s-10)}</span></div>
      </div>
      ${ORG.useDevice&&r!=='absent'?`<div class="flabel">전자기기 보관번호</div><input class="input" inputmode="numeric" placeholder="번호 입력" value="${esc(a.device)}" data-f="device" data-no="${no}">`:''}
      <div class="btns" style="margin-top:18px">${r==='absent'?`<button class="btn ghost" data-act="ckReset">취소</button><button class="btn" data-act="ckRevive" data-no="${no}">접수로 변경</button>`:`<button class="btn ghost" data-act="open" data-no="${no}">상세</button><button class="btn" data-act="ckReset">다음 지원자</button>`}</div>`;}
  if(c.step==='manual'){const q=c.mq.trim();
    const list=R().filter(r=>{const rm=roomOf(J,r.no);return (c.mroom==='all'||rm===J.sched.rooms[c.mroom])&&(!q||(r.name+r.no+A(r.no).ino).includes(q))&&(c.mall||!['접수','불참'].includes(A(r.no).status));}).sort((a,b)=>T(J.arrive[a.no])-T(J.arrive[b.no]));
    return `<div class="appbar"><button class="iconbtn" style="margin-left:-8px" data-act="ckScan" aria-label="뒤로">${ic('back','s22')}</button><b style="font-size:17px">수동 선택</b></div>
    <div class="callout pri">${ic('info','s14')}<span>QR이 인식되지 않을 때 신분증과 대조해 직접 선택해 주세요</span></div>
    <div class="seg">${J.sched.rooms.map((rm,i)=>`<button class="${c.mroom===i?'on':''}" data-act="mroom" data-i="${i}">${rm.name}</button>`).join('')}<button class="${c.mroom==='all'?'on':''}" data-act="mroom" data-i="all">전체</button></div>
    <div class="tools"><label class="search">${ic('search','s14')}<input placeholder="이름·수험번호" data-inp="ck.mq" value="${esc(c.mq)}"></label></div>
    <div class="toggle" data-act="mall" style="border:0;padding:6px 0 4px;font-size:13px;color:var(--tx2)"><span>접수·불참 포함 전체 보기</span><span class="cbox ${c.mall?'on':''}"></span></div>
    ${list.map(r=>{const a=A(r.no);return `<div class="prow" data-act="ckPick" data-no="${r.no}"><span class="no">${J.arrive[r.no]}</span><div class="who"><div class="l1">${a.ino}<span>${esc(r.name)}</span></div><div class="l2">${r.no} · ${roomOf(J,r.no).name}</div></div><span class="st ${statusCls(a.status)}">${stLabel(a.status)}</span></div>`;}).join('')||'<div class="empty">대상 없음</div>'}`;}
  const fail=c.step==='fail';
  const recent=R().filter(r=>A(r.no).ck).sort((a,b)=>T(A(b.no).ck.at)-T(A(a.no).ck.at)).slice(0,5);
  const nx=nextCandidate();
  return head+`
  <div class="idchk ${c.id?'on':''}" data-act="ckId"><span class="cbox ${c.id?'on':''}"></span><div><div class="t">신분증 육안 확인 완료</div><div class="d">사진과 얼굴, 이름을 대조한 뒤 체크해 주세요</div></div></div>
  <div class="vf ${c.id&&!fail?'':'off'}"><div class="box"><i></i><i></i><i></i><i></i>${c.id&&!fail?'<div class="line"></div>':''}</div><div class="cap">${fail?'QR을 인식하지 못했어요':c.id?'지원자 QR을 사각형 안에 맞춰 주세요':'신분증을 확인하면 스캔이 시작돼요'}</div></div>
  ${fail?`<div class="callout err" style="margin-top:12px">${ic('alert','s14')}<span><b>인식 실패</b> · 지원자 화면 밝기를 높이거나 명단에서 직접 선택해 주세요</span></div>`:''}
  <button class="btn soft" style="margin-top:12px" data-act="ckManual">QR 없이 명단에서 선택</button>
  <div class="demo-chips"><button class="demo-chip" data-act="ckScanDo" ${c.id&&nx?'':'disabled'}>${ic('spark','s14')}시연 · QR 인식</button><button class="demo-chip" data-act="ckFail" ${c.id?'':'disabled'}>${ic('spark','s14')}시연 · 인식 실패</button><button class="demo-chip" data-act="ckDup" ${c.id?'':'disabled'}>${ic('spark','s14')}시연 · 중복 스캔</button></div>
  <div class="sec"><div class="sec-h">최근 체크인<span class="meta">${R().filter(r=>A(r.no).ck).length}명</span></div>
    <div class="recent">${recent.map(r=>`<div class="r"><span class="tm">${A(r.no).ck.at}</span><b>${A(r.no).ino}</b><span>${esc(r.name)}</span><span class="how">${A(r.no).ck.how}</span></div>`).join('')}</div></div>
`;
}
function checkin(no,how){
  const a=A(no);
  if(a.status==='접수'&&a.ck){S.ck.res='dup';}
  else if(a.status==='불참'){S.ck.res='absent';}
  else{a.status='접수';a.ck={at:HM(S.now),how};S.ck.res='ok';
    if(ORG.useDevice&&!a.device){const mx=Math.max(0,...R().map(r=>+A(r.no).device||0));a.device=String(mx+1);}}
  S.ck.no=no;S.ck.step='result';
}

/* ===== 행동 강령 (PRD 9.8) ===== */
function pgConduct(){
  const list=CONDUCT.filter(c=>S.cdFilter==='전체'||c.who===S.cdFilter).slice().sort((a,b)=>T(a.t)-T(b.t));
  const open=list.filter(c=>!c.done),fin=list.filter(c=>c.done);const late=open.filter(c=>T(c.t)<S.now);
  let nowPlaced=false;
  const row=c=>{const i=CONDUCT.indexOf(c);const late=!c.done&&T(c.t)<S.now,soon=!c.done&&!late&&T(c.t)-S.now<=10;
    return `<div class="titem ${c.done?'fin':''} ${late?'late':''} ${soon?'soon':''}"><span class="tchk ${c.done?'on':''}" data-act="cd" data-i="${i}"></span><span class="tm">${c.t}</span><div class="bd"><div class="do">${esc(c.txt)}</div><div class="who">${c.who}${c.done&&c.at?` · ${c.at} 완료`:''}</div></div>${c.done?'<span class="st">완료</span>':late?'<span class="st err">미완료</span>':soon?'<span class="st pri">곧</span>':'<span class="st">예정</span>'}</div>`;};
  return `<div class="ttl">행동 강령</div><div class="sub">시간에 맞춰 할 일을 알려드려요 · 10분 전에 미리 알림</div>
  <div class="sum"><div class="big">${late.length?`미완료 <em class="err">${late.length}건</em>`:`남은 일 <em>${open.length}건</em>`}</div><div class="pbar"><i style="width:${list.length?fin.length/list.length*100:0}%"></i></div></div>
  ${late.length?`<div class="callout err" style="margin-top:14px">${ic('alert','s14')}<span>시간이 지난 할 일이 있어요 · <b>본부에도 함께 표시돼요</b></span></div>`:''}
  <div class="chips" style="margin:16px 0 4px">${['전체','접수','인솔'].map(k=>`<button class="chip ${S.cdFilter===k?'on':''}" data-act="cdf" data-k="${k}">${k}</button>`).join('')}</div>
  <div class="card">${open.map(c=>{let pre='';if(!nowPlaced&&T(c.t)>=S.now){pre=`<div class="nowline">지금 ${HM(S.now)}</div>`;nowPlaced=true;}return pre+row(c);}).join('')}${!nowPlaced?`<div class="nowline">지금 ${HM(S.now)}</div>`:''}</div>
  ${fin.length?`<div class="card"><div class="fhead" data-act="showDone" style="border:0;margin:0"><span>완료 ${fin.length}</span>${ic(S.showDone?'down':'chev','s14')}</div>${S.showDone?fin.map(row).join(''):''}</div>`:''}`;
}
function sheetNoti(){
  const late=lateConduct(),soon=soonConduct();
  const items=[...late.map(c=>({k:'재알림',cls:'err',x:c.txt,s:`${c.t} · 시점 경과 미완료`})),...soon.map(c=>({k:T(c.t)===S.now?'시점 도달':'사전 알림',cls:'pri',x:c.txt,s:`${c.t} · ${T(c.t)-S.now}분 후`})),
    ...ISSUES.filter(i=>!i.done).map(i=>({k:'이슈',cls:'mute',x:i.txt,s:`${i.t} · ${i.room}`}))];
  return `<div class="grab"></div><div class="sh-title">알림</div><div class="noti">${items.map(n=>`<div class="n"><span class="k ${n.cls}">${n.k}</span><div class="x">${esc(n.x)}<small>${n.s}</small></div></div>`).join('')||'<div class="empty">새 알림 없음</div>'}</div>
  <button class="btn soft" style="margin-top:14px" data-act="tab" data-t="conduct">행동 강령 보기</button>`;
}

/* ===== 이슈 (PRD 9.9) ===== */
function chatItems(){
  const items=CHAT.map(c=>({k:'m',t:c.t,c})).concat(ISSUES.map(i=>({k:'i',t:i.t,i})));
  items.sort((a,b)=>T(a.t)-T(b.t));
  return S.chatFilter==='issue'?items.filter(x=>x.k==='i'):items;
}
function pgChat(){
  const open=ISSUES.filter(i=>!i.done).length;
  const body=chatItems().map(x=>{
    if(x.k==='i'){const i=x.i,k=ISSUES.indexOf(i);return `<div class="cissue ${i.done?'done':''}"><div class="ci-top"><span class="ci-b">이슈 · ${i.room}</span>${i.done?'<span class="st">해결</span>':`<button class="ci-act" data-act="resolve" data-i="${k}">해결 처리</button>`}</div><div class="ci-tx">${esc(i.txt)}</div>${i.photo&&i.photo!=='mock'?`<img class="ph" src="${i.photo}" alt="첨부 사진">`:i.photo?`<div class="ci-ph">${ic('camera','s14')}사진 1장</div>`:''}<div class="ci-m">${i.t} · ${i.by}</div></div>`;}
    const c=x.c,me=c.who==='ME';return `<div class="bub ${me?'me':''}">${me?'':`<div class="who">${esc(c.who)}</div>`}<div class="msg">${esc(c.txt)}</div><div class="tm">${c.t}</div></div>`;
  }).join('');
  return `<div class="chatpage">
    <div class="chead"><div><div class="ct">현장 채팅</div><div class="cm">운영팀 7명</div></div>
      <div class="seg" style="width:auto"><button class="${S.chatFilter!=='issue'?'on':''}" data-act="chatF" data-v="all">전체</button><button class="${S.chatFilter==='issue'?'on':''}" data-act="chatF" data-v="issue">이슈 ${open}</button></div></div>
    <div class="chatlist" id="chatlist">${body||'<div class="empty">이슈 없음</div>'}</div>
    <div class="chatbar"><button class="ibtn" data-act="newIssue">${ic('flag','s14')}이슈</button><input class="cfield" id="cmsg" placeholder="메시지 입력" autocomplete="off"><button class="csend" data-act="send" aria-label="보내기">${ic('arrowup')}</button></div>
  </div>`;
}
function pgIssue(){
  const open=ISSUES.filter(i=>!i.done),done=ISSUES.filter(i=>i.done);
  const card=i=>{const k=ISSUES.indexOf(i);return `<div class="iss ${i.done?'':'open'}"><div class="t">${esc(i.txt)}</div><div class="m"><span>${i.t}</span><span>${i.room}</span><span>${i.by}</span>${i.photo?`<span>${ic('camera','s14')}사진</span>`:''}<span class="ml"></span>${i.done?'<span class="st ok">해결</span>':`<button class="call" style="margin:0;border:0" data-act="resolve" data-i="${k}">해결 처리</button>`}</div>${i.photo&&i.photo!=='mock'?`<img class="ph" src="${i.photo}" alt="첨부 사진">`:''}</div>`;};
  return `<div class="ttl">이슈</div><div class="sub">채팅 대신 간단 등록 · 텍스트 + 사진 · 마스터 관리자 현장 운영 화면 실시간 반영</div>
  <button class="btn" data-act="newIssue">${ic('plus','s14')}이슈 등록</button>
  <div class="sec"><div class="sec-h">미해결<span class="meta">${open.length}건</span></div>${open.map(card).join('')||'<div class="empty">미해결 이슈 없음</div>'}</div>
  ${done.length?`<div class="sec"><div class="sec-h">해결<span class="meta">${done.length}건</span></div>${done.map(card).join('')}</div>`:''}`;
}
function sheetIssue(){
  const d=S.issueDraft;
  return `<div class="grab"></div><div class="sh-title">이슈 등록</div>
  <div class="flabel">위치</div><div class="chips">${J.sched.rooms.map(r=>r.name).concat(['대기실','공통']).map(k=>`<button class="chip ${d.room===k?'on':''}" data-act="isRoom" data-k="${k}">${k}</button>`).join('')}</div>
  ${d.no?`<div class="flabel">관련 지원자</div><div class="kv" style="border:0;padding:0"><span>${A(d.no).ino} · ${esc(P(d.no).name)}</span><button class="call" style="border:0" data-act="isNoClear">해제</button></div>`:''}
  <div class="flabel">내용</div><textarea class="input" id="is-x" placeholder="예) 2면접실 평가위원 마이크 불량">${esc(d.txt)}</textarea>
  <div class="flabel">사진 첨부</div><div class="photo-pick">${d.photo?`<img src="${d.photo}" alt="첨부 사진"><button class="call" style="border:0" data-act="isPhotoClear">삭제</button>`:`<div class="add" data-act="isPhoto">${ic('camera')}촬영·선택</div>`}</div>
  <div class="btns" style="margin-top:20px"><button class="btn ghost" data-act="closeSheet">취소</button><button class="btn" data-act="saveIssue">등록</button></div>`;
}

/* ===== 마이 ===== */

  <div class="sec"><div class="sec-h">근무 기록</div>

  <div class="sec"><div class="sec-h">계정</div>

function sheetSign(i){return `<div class="grab"></div><div class="sh-title">전자근로계약서 서명</div><div class="sub" style="margin-bottom:12px">${J.org} · 면접 운영 단기 근로 · 시급 30,000원</div><canvas class="signpad" id="pad" width="704" height="300"></canvas><div class="note">손가락 또는 마우스로 서명</div><div class="btns" style="margin-top:16px"><button class="btn ghost" data-act="padClear">다시 쓰기</button><button class="btn" data-act="signDone" data-i="${i}">서명 완료</button></div>`;}

/* ===== 렌더 ===== */
const TABS=[['board','운영보드','board'],['checkin','체크인','qr'],['conduct','행동 강령','list'],['chat','채팅','chat'],['my','마이','user']];
function pgLogin(){
  return `<div class="page olog">
    <div class="ol-top">${SYM}</div>
    <h1>현장 운영 로그인</h1>
    <p class="ol-s">문자로 받은 아이디와 임시 비밀번호를 입력해 주세요</p>
    <div class="flabel">아이디</div><input class="input" id="lg-id" placeholder="예) KPA25-S01" autocomplete="off" value="${esc(S.lgId)}">
    <div class="flabel">비밀번호</div><input class="input" id="lg-pw" type="password" placeholder="임시 비밀번호">
    ${S.loginErr?`<div class="ol-err">${ic('alert','s14')}${S.loginErr}</div>`:''}
    <button class="btn" style="margin-top:22px" data-act="login">로그인</button>
    <div class="demo-chips"><button class="demo-chip" data-act="demoFill">${ic('spark','s14')}시연용 계정 입력</button></div>
    <div class="lg-foot">계정 안내를 받지 못했다면 채용 담당자에게 문의해 주세요</div>
  </div>`;
}
function render(keep){
  const m=$('#main');
  $('#frame').classList.toggle('pre',!S.auth);
  if(!S.auth){m.innerHTML=pgLogin();$('#tabbar').style.display='none';$('#sbT').textContent=HM(S.now);$('#demoT').textContent=HM(S.now);renderSheet();return;}
  $('#tabbar').style.display='';const y=keep?(m.querySelector('.page')||{}).scrollTop:0;
  if(S.tab==='chat'){const draft=($('#cmsg')||{}).value||'';m.innerHTML=pgChat();const cl=$('#chatlist');cl.scrollTop=cl.scrollHeight;$('#cmsg').value=draft;}
  else{const h={board:pgBoard,checkin:pgCheckin,conduct:pgConduct,issue:pgIssue,my:pgMy}[S.tab]();
  m.innerHTML=`<div class="page">${h}</div>`;if(keep)m.querySelector('.page').scrollTop=y;}
  const late=lateConduct().length,iss=ISSUES.filter(i=>!i.done).length;
  $('#tabbar').innerHTML=TABS.map(([k,l,i])=>`<button class="tab ${S.tab===k?'on':''}" data-act="tab" data-t="${k}">${ic(i,'s22'+(S.tab===k?' fill':''))}<span class="lb">${l}</span>${k==='conduct'&&late?`<span class="bd">${late}</span>`:k==='chat'&&iss?`<span class="bd" style="background:var(--warn)">${iss}</span>`:''}</button>`).join('');
  $('#sbT').textContent=HM(S.now);$('#demoT').textContent=HM(S.now);
  renderSheet();
}
function renderSheet(){
  const L=$('#layer');const prev=L.querySelector('.sheet');const sy=prev?prev.scrollTop:0;
  L.querySelectorAll('.dim').forEach(d=>d.remove());
  if(!S.sheet)return;
  const s=S.sheet;const h=s.type==='app'?sheetApp(s.no):s.type==='blk'?sheetBlock(s.ri,s.i):s.type==='noti'?sheetNoti():s.type==='issue'?sheetIssue():sheetSign(s.i);
  L.insertAdjacentHTML('afterbegin',`<div class="dim ${prev?'':'anim'}" data-act="dim"><div class="sheet secure">${h}</div></div>`);
  const sh=L.querySelector('.sheet');if(prev)sh.scrollTop=sy;
  if(s.type==='sign')initPad();
}
const $=s=>document.querySelector(s);

/* 서명 패드 */
let padInk=false;
function initPad(){const c=$('#pad');if(!c)return;const x=c.getContext('2d');x.lineWidth=4;x.lineCap='round';x.strokeStyle='#0F1E45';padInk=false;let d=false;
  const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height];};
  c.onpointerdown=e=>{d=true;const[a,b]=pos(e);x.beginPath();x.moveTo(a,b);};
  c.onpointermove=e=>{if(!d)return;const[a,b]=pos(e);x.lineTo(a,b);x.stroke();padInk=true;};
  c.onpointerup=c.onpointerleave=()=>d=false;}

/* ===== 이벤트 ===== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;const no=t.dataset.no;
  switch(a){
    case 'demoFill':$('#lg-id').value='KPA25-S01';$('#lg-pw').value='onsite25!';break;
    case 'login':{const id=$('#lg-id').value.trim().toUpperCase(),pw=$('#lg-pw').value;S.lgId=id;
      if(!id||!pw){S.loginErr='아이디와 비밀번호를 입력해 주세요';render();break;}
      if(id.split('-')[0]!=='KPA25'){S.loginErr='등록되지 않은 아이디예요';render();break;}
      if(id!=='KPA25-S01'||pw!=='onsite25!'){S.loginErr='아이디 또는 비밀번호가 맞지 않아요';render();break;}
      S.auth=true;S.loginErr='';S.tab='board';render();toast(`${ME.name} · ${J.name}`);break;}
    case 'logout':S.auth=false;S.lgId='';S.sheet=null;render();break;
    case 'dim':if(e.target===t){S.sheet=null;renderSheet();}break;
    case 'closeSheet':S.sheet=null;render(true);break;
    case 'dlgClose':closeDlg();break;
    case 'clock':S.now=Math.max(T('08:00'),Math.min(T('18:00'),S.now+ +t.dataset.d));render(true);{const s=soonConduct().find(c=>T(c.t)-S.now<=10);if(s)toast(`${T(s.t)===S.now?'지금 할 일':'10분 후'} · ${s.txt}`);}break;
    case 'tab':S.tab=t.dataset.t;S.sheet=null;render();break;
    case 'noti':S.sheet={type:'noti'};renderSheet();break;
    case 'room':S.room=t.dataset.i==='all'?'all':+t.dataset.i;render(true);break;
    case 'open':S.sheet={type:'app',no};renderSheet();break;
    case 'setSt':{const ap=A(no),v=t.dataset.v;if(ap.status===v)break;
      if(v==='불참'){dialog('불참 처리',`${ap.ino} ${esc(P(no).name)} <br>불참으로 처리하면 해당 조 면접시간이 자동으로 줄어들어요`,'불참 처리','doAbsent',true,`data-no="${no}"`);break;}
      setStatus(no,v);break;}
    case 'doAbsent':closeDlg();setStatus(no,'불참');break;
    case 'tgl':{const ap=A(no);ap[t.dataset.k]=!ap[t.dataset.k];if(t.dataset.k==='outR'&&ap.outR&&ORG.useDevice&&ap.device)toast(`퇴실 · 전자기기 ${ap.device}번 반환 확인`);render(true);break;}
    case 'dly':{const ap=A(no);setDelay(no,Math.max(0,(+ap.delay||0)+ +t.dataset.d));break;}
    case 'issueFor':S.issueDraft={room:sessionOf(no).room.name,txt:'',photo:null,no};S.sheet={type:'issue'};renderSheet();break;
    case 'editBlk':S.sheet={type:'blk',ri:+t.dataset.r,i:+t.dataset.i};renderSheet();break;
    case 'saveBlk':{const rm=J.sched.rooms[+t.dataset.r],it=rm.items[+t.dataset.i];const os=it.start,ol=it.len;it.start=$('#bk-s').value||it.start;it.len=Math.max(0,+$('#bk-l').value||0);J.history.unshift({at:HM(S.now),txt:`${rm.name} ${it.kind==='lunch'?'점심':'휴식'} ${os}/${ol}분 → ${it.start}/${it.len}분 · ${ME.name}`});S.sheet=null;render(true);toast('시간 변경 · 이후 일정에 반영됐어요');break;}
    /* 체크인 */
    case 'ckId':S.ck.id=!S.ck.id;if(S.ck.step==='fail')S.ck.step='scan';render(true);break;
    case 'ckScanDo':{const n=nextCandidate();if(!n)break;checkin(n,'QR');render();break;}
    case 'ckFail':S.ck.step='fail';render(true);break;
    case 'ckDup':{const last=R().filter(r=>A(r.no).ck).sort((a,b)=>T(A(b.no).ck.at)-T(A(a.no).ck.at))[0];if(last){checkin(last.no,'QR');render();}break;}
    case 'ckManual':S.ck.step='manual';render();break;
    case 'ckScan':S.ck.step='scan';render();break;
    case 'mroom':S.ck.mroom=t.dataset.i==='all'?'all':+t.dataset.i;render(true);break;
    case 'mall':S.ck.mall=!S.ck.mall;render(true);break;
    case 'ckPick':{const ap=A(no),pp=P(no);dialog('수동 출석 처리',`${ap.ino} · ${esc(pp.name)} · ${no}<br>신분증과 대조했다면 출석 처리해 주세요`,'출석 처리','ckPickDo',false,`data-no="${no}"`);break;}
    case 'ckPickDo':closeDlg();checkin(no,'수동');render();break;
    case 'ckRevive':setStatus(no,'접수',true);A(no).ck={at:HM(S.now),how:'수동'};S.ck.res='ok';render();break;
    case 'ckReset':S.ck={id:false,step:'scan',no:null,res:null,mq:'',mroom:'all',mall:false};render();break;
    /* 행동 강령 */
    case 'cd':{const c=CONDUCT[+t.dataset.i];c.done=!c.done;c.at=c.done?HM(S.now):null;render(true);break;}
    case 'cdf':S.cdFilter=t.dataset.k;render(true);break;
    case 'showDone':S.showDone=!S.showDone;render(true);break;
    /* 이슈 */
    case 'newIssue':S.issueDraft={room:J.sched.rooms[0].name,txt:'',photo:null,no:null};S.sheet={type:'issue'};renderSheet();break;
    case 'isRoom':S.issueDraft.txt=$('#is-x').value;S.issueDraft.room=t.dataset.k;renderSheet();break;
    case 'isNoClear':S.issueDraft.txt=$('#is-x').value;S.issueDraft.no=null;renderSheet();break;
    case 'isPhoto':S.issueDraft.txt=$('#is-x').value;$('#photoIn').value='';$('#photoIn').click();break;
    case 'isPhotoClear':S.issueDraft.txt=$('#is-x').value;S.issueDraft.photo=null;renderSheet();break;
    case 'saveIssue':{const d=S.issueDraft;d.txt=$('#is-x').value.trim();if(!d.txt){toast('내용을 입력해 주세요',true);break;}
      ISSUES.unshift({t:HM(S.now),txt:(d.no?`${A(d.no).ino} · `:'')+d.txt,room:d.room,by:ME.name,photo:d.photo,done:false});S.sheet=null;S.tab='chat';S.chatFilter='all';render();toast('이슈 등록 · 본부에 공유됐어요');break;}
    case 'chatF':S.chatFilter=t.dataset.v;render();break;
    case 'send':sendMsg();break;
    case 'resolve':ISSUES[+t.dataset.i].done=true;render(true);toast('해결 처리');break;
    /* 마이 */
    case 'clockOut':WORK.out=WORK.out?'':HM(S.now);render(true);toast(WORK.out?`퇴근 기록 ${WORK.out} · 정산 반영`:'퇴근 기록 취소');break;
    case 'upload':WORK.docs[+t.dataset.i][1]=true;render(true);toast(`${WORK.docs[+t.dataset.i][0]} 제출`);break;
    case 'sign':S.sheet={type:'sign',i:+t.dataset.i};renderSheet();break;
    case 'padClear':initPad();$('#pad').getContext('2d').clearRect(0,0,704,300);break;
    case 'signDone':if(!padInk){toast('서명을 입력해 주세요',true);break;}WORK.docs[+t.dataset.i][1]=true;S.sheet=null;render(true);toast('전자근로계약서 서명 완료');break;
  }
});
function sendMsg(){const el=$('#cmsg');const v=el.value.trim();if(!v)return;CHAT.push({t:HM(S.now),who:'ME',txt:v});el.value='';render();
  if(!S.replied){S.replied=true;setTimeout(()=>{CHAT.push({t:HM(S.now),who:'본부 · 김민경',txt:'확인했습니다. 진행 상황 운영보드로 보고 있을게요.'});if(S.tab==='chat')render();},1400);}}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&['lg-id','lg-pw'].includes(e.target.id)){e.preventDefault();document.querySelector('[data-act=login]').click();return;}if(e.key==='Enter'&&e.target.id==='cmsg'&&!e.isComposing){e.preventDefault();sendMsg();}});
function setStatus(no,v,silent){
  const ap=A(no);const so=sessionOf(no);const before=so.x.len;ap.status=v;
  if(v==='접수'&&!ap.ck)ap.ck={at:HM(S.now),how:'수동'};
  if(v!=='접수')ap.ck=v==='불참'||v===''||v==='접수예정'||v==='연락중'?null:ap.ck;
  if(v==='불참'){ap.inR=false;ap.device='';}
  const after=sessionOf(no).x.len;
  if(!silent)toast(v==='불참'&&before!==after?`불참 처리 · ${so.x.label} 면접시간 ${before}분 → ${after}분`:`${ap.ino} ${stLabel(v)}`);
  render(true);
}
function setDelay(no,v){
  const ap=A(no);const rm=sessionOf(no).room;const lastBefore=timeline(J,rm,true).filter(x=>x.kind==='s').pop().e;
  ap.delay=v;const lastAfter=timeline(J,rm,true).filter(x=>x.kind==='s').pop().e;
  toast(`${ap.ino} 지연 ${v}분 · ${rm.name} 종료 예정 ${HM(lastAfter)}`);render(true);
}
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='is-x'&&S.issueDraft){S.issueDraft.txt=t.value;return;}
  if(t.dataset.inp){const k=t.dataset.inp;const pos=t.selectionStart;if(k==='q')S.q=t.value;else S.ck.mq=t.value;render(true);const el=document.querySelector(`[data-inp="${k}"]`);if(el){el.focus();el.setSelectionRange(pos,pos);}return;}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='photoIn'&&t.files[0]){const r=new FileReader();r.onload=()=>{S.issueDraft.photo=r.result;renderSheet();};r.readAsDataURL(t.files[0]);return;}
  if(t.dataset.f){const no=t.dataset.no,ap=A(no);
    if(t.dataset.f==='delay'){setDelay(no,Math.max(0,+t.value||0));return;}
    ap[t.dataset.f]=t.value.trim();if(t.dataset.f==='device'&&ap.device)toast(`전자기기 보관번호 ${ap.device}번`);render(true);}
});

/* 캡처 방지 (운영관리자 화면 필수) */
(function(){const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='220' height='120'><text x='6' y='76' transform='rotate(-22 110 60)' font-family='sans-serif' font-size='11' fill='rgba(15,30,69,0.05)'>${ME.name} · 운영관리자 · ONSITE</text></svg>`;document.documentElement.style.setProperty('--wm',`url("data:image/svg+xml,${encodeURIComponent(svg)}")`);})();
window.addEventListener('blur',()=>document.body.classList.add('shield'));
window.addEventListener('focus',()=>document.body.classList.remove('shield'));
document.addEventListener('contextmenu',e=>{if(e.target.closest('.secure')){e.preventDefault();toast('개인정보 보호를 위해 저장할 수 없어요',true);}});

render();
</script>
