<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONSITE · 평가자</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22512%22%20height%3D%22512%22%20viewBox%3D%220%200%20512.00%20512.00%22%3E%3Crect%20width%3D%22512%22%20height%3D%22512%22%20rx%3D%22139%22%20fill%3D%22%232466E0%22%2F%3E%3Cg%20transform%3D%22translate%28256%20256%29%20scale%281.75%29%20translate%28-88.3%20-80%29%22%3E%3Ccircle%20cx%3D%2260%22%20cy%3D%2280%22%20r%3D%2240%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2234%22%2F%3E%3Cpath%20d%3D%22M88.3%2051.7%20L143.9%20107.3%20Q156.6%20120%20156.6%20102%20L156.6%2040%22%20fill%3D%22none%22%20stroke%3D%22%23FFFFFF%22%20stroke-width%3D%2234%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E">
<link rel="stylesheet" href="fonts/wanted-sans/WantedSansVariable.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
/* =========================================================
   ONSITE 공통 토큰 v2  (마스터·평가자·운영자·지원자 공통)
   - 회색 계열 + 포인트 블루 1개 + 상태색 3개(점·텍스트 전용)
   - 그라디언트·컬러 그림자 없음 / 카드 최소화
   ========================================================= */
:root{
  --pri:#2466E0;--pri-h:#1D56C4;--pri-weak:#EEF3FE;--pri-line:#C9D8F7;--navy:#0F1E45;--sky:#7FA6F0;
  --tx:#0F1E45;--tx2:#5A6684;--tx3:#98A2B8;
  --line:#ECEEF3;--line2:#DFE3EB;
  --bg:#FFFFFF;--bg-sub:#F5F7FB;--hover:#EEF1F7;
  --ok:#1F9254;--warn:#B8740F;--err:#E5383B;
  --err-weak:#FDF1F1;--warn-weak:#FDF6EA;
  --r:10px;--r-sm:6px;
  --sh-pop:0 12px 32px -8px rgba(22,22,29,.18),0 2px 6px rgba(22,22,29,.06);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:"Wanted Sans Variable","Wanted Sans",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;line-height:1.5;color:var(--tx);background:var(--bg);letter-spacing:-0.01em;-webkit-font-smoothing:antialiased;}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit;}
button{cursor:pointer;background:none;border:0;}
svg.i{width:16px;height:16px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
svg.i.s14{width:14px;height:14px;} svg.i.s18{width:18px;height:18px;}

/* ---------- 레이아웃 ---------- */
.app{display:flex;min-height:100vh;}
.nav{width:240px;flex-shrink:0;background:var(--bg-sub);border-right:1px solid var(--line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.nav-logo{height:60px;display:flex;align-items:center;padding:0 20px;}
.nav-logo .logo-svg{height:26px;width:auto;display:block;}
.nav-body{flex:1;padding:4px 10px 12px;overflow-y:auto;}
.nav-job{display:block;width:100%;text-align:left;padding:10px;border-radius:var(--r-sm);margin-bottom:14px;}
.nav-job:hover{background:var(--hover);}
.nav-job .nj-org{font-size:11.5px;color:var(--tx3);display:block;margin-bottom:3px;}
.nav-job .nj-name{font-size:13px;font-weight:600;color:var(--tx);line-height:1.4;display:block;}
.nav-job .nj-meta{font-size:11.5px;color:var(--tx2);margin-top:4px;display:block;}
.nav-lbl{font-size:11px;font-weight:600;color:var(--tx3);padding:0 10px 6px;}
.nav-item{width:100%;display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;color:var(--tx2);margin-bottom:1px;text-align:left;}
.nav-item:hover{background:var(--hover);color:var(--tx);}
.nav-item.active{background:var(--pri-weak);color:var(--pri);font-weight:600;}
.nav-item .tail{margin-left:auto;font-size:12px;color:var(--tx3);font-weight:500;display:flex;}
.nav-item.active .tail{color:var(--pri);}
.nav-foot{border-top:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:10px;cursor:pointer;}
.nav-foot:hover{background:var(--hover);}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--line);color:var(--tx2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;font-weight:700;}
.nav-foot .nm{font-size:13px;font-weight:600;} .nav-foot .rl{font-size:11.5px;color:var(--tx3);}

.main{flex:1;min-width:0;padding:36px 40px 80px;max-width:1440px;}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:28px;}
.phead h1{font-size:24px;font-weight:700;letter-spacing:-0.025em;line-height:1.3;margin-bottom:6px;}
.phead p{font-size:13.5px;color:var(--tx2);}
.phead .pr{display:flex;gap:8px;align-items:center;flex-shrink:0;}
.hmeta{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--tx3);}
.hmeta + .hmeta::before{content:'';width:1px;height:10px;background:var(--line2);margin-right:4px;}

/* ---------- 섹션 (박스 없이 위계) ---------- */
.sec{margin-top:40px;}
.sec:first-child{margin-top:0;}
.sec-h{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:32px;}
.sec-h h2{font-size:15px;font-weight:700;letter-spacing:-0.015em;}
.sec-h .meta{font-size:12.5px;color:var(--tx3);}
.sp{flex:1;}
.cols{display:grid;gap:48px;align-items:start;}
.muted{color:var(--tx2);} .faint{color:var(--tx3);}
.note{font-size:12px;color:var(--tx3);margin-top:10px;line-height:1.5;}
.strong{font-weight:600;}

/* 숫자 요약 (아이콘 타일 없이) */
.kpis{display:flex;gap:0;margin-bottom:36px;}
.kpi{padding:0 32px;border-left:1px solid var(--line);}
.kpi:first-child{padding-left:0;border-left:0;}
.kpi .lb{font-size:12.5px;color:var(--tx3);margin-bottom:4px;}
.kpi .vl{font-size:24px;font-weight:700;letter-spacing:-0.02em;font-variant-numeric:tabular-nums;line-height:1.2;}
.kpi .vl small{font-size:13px;color:var(--tx3);font-weight:500;margin-left:3px;}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;border-radius:var(--r-sm);font-size:13px;font-weight:600;border:1px solid var(--line2);background:#fff;color:var(--tx);white-space:nowrap;transition:background .12s;}
.btn:hover{background:var(--hover);}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;}
.btn.pri:hover{background:var(--pri-h);}
.btn.ghost{border-color:transparent;background:none;color:var(--tx2);}
.btn.ghost:hover{background:var(--hover);color:var(--tx);}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;}
.btn.xs{height:26px;padding:0 9px;font-size:12px;font-weight:500;}
.btn.block{width:100%;}
.btn[disabled]{opacity:.4;pointer-events:none;}

/* 상태: 점 + 텍스트 */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--tx2);white-space:nowrap;}
.st::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--tx3);flex-shrink:0;}
.st.pri{color:var(--pri);} .st.pri::before{background:var(--pri);}
.st.ok{color:var(--ok);} .st.ok::before{background:var(--ok);}
.st.warn{color:var(--warn);} .st.warn::before{background:var(--warn);}
.st.err{color:var(--err);} .st.err::before{background:var(--err);}
.st.off{color:var(--tx3);}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:5px;background:var(--bg-sub);color:var(--tx2);border:1px solid var(--line);white-space:nowrap;}

/* 입력 */
.input,.textarea{width:100%;border:1px solid var(--line2);border-radius:var(--r-sm);background:#fff;padding:0 12px;height:36px;font-size:13px;outline:none;transition:.12s;}
.textarea{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.55;}
.input:focus,.textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(36,102,224,.12);}
.input[disabled],.textarea[disabled]{background:var(--bg-sub);color:var(--tx2);}
.field{margin-bottom:14px;} .field label{display:block;font-size:12.5px;color:var(--tx2);margin-bottom:6px;font-weight:500;}
.search{position:relative;} .search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--tx3);} .search .input{padding-left:32px;height:32px;font-size:12.5px;background:var(--bg-sub);border-color:transparent;}
.search .input:focus{background:#fff;}

/* 표: 바깥 테두리 없이 가로선만 */
table{width:100%;border-collapse:collapse;}
.tbl{border-top:1px solid var(--line2);}
.tbl th{text-align:left;font-size:12px;font-weight:500;color:var(--tx3);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;}
.tbl td{font-size:13.5px;padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;}
.tbl th:first-child,.tbl td:first-child{padding-left:4px;}
.tbl tbody tr.click{cursor:pointer;} .tbl tbody tr.click:hover td{background:var(--bg-sub);}
.tbl tbody tr.sel td{background:var(--pri-weak);}
.tbl td.num,.tbl th.num{text-align:center;font-variant-numeric:tabular-nums;}
.tbl td.r,.tbl th.r{text-align:right;}

/* 콜아웃 (노션 스타일) */
.callout{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:8px;font-size:13px;background:var(--bg-sub);color:var(--tx2);margin-bottom:24px;}
.callout b{color:var(--tx);font-weight:600;}
.callout.pri{background:var(--pri-weak);color:var(--pri);} .callout.pri b{color:var(--pri);}
.callout.warn{background:var(--warn-weak);color:var(--warn);} .callout.warn b{color:var(--warn);}
.callout.err{background:var(--err-weak);color:var(--err);} .callout.err b{color:var(--err);}
.callout.ok b{color:var(--ok);}

/* 패널 (주요 작업 영역에만 테두리) */
.panel{border:1px solid var(--line2);border-radius:var(--r);padding:20px;background:#fff;}
.panel-h{display:flex;align-items:center;gap:8px;margin-bottom:16px;}
.panel-h h3{font-size:15px;font-weight:700;}

/* 탭 */
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:24px;}
.tab{padding:10px 0;font-size:13.5px;font-weight:500;color:var(--tx3);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:6px;}
.tab:hover{color:var(--tx);}
.tab.active{color:var(--tx);font-weight:600;border-bottom-color:var(--tx);}
.tab .cnt{font-size:12px;color:var(--tx3);font-weight:500;}
.seg{display:inline-flex;background:var(--bg-sub);border-radius:7px;padding:2px;gap:2px;}
.seg button{height:26px;padding:0 11px;border-radius:5px;font-size:12.5px;font-weight:500;color:var(--tx2);}
.seg button.on{background:#fff;color:var(--tx);font-weight:600;box-shadow:0 1px 2px rgba(22,22,29,.08);}

/* 조 흐름 (박스 대신 상단 진행선) */
.flow{display:flex;gap:28px;margin-bottom:32px;}
.fg{flex:1;text-align:left;padding-top:12px;position:relative;}
.fg .bar{position:absolute;top:0;left:0;right:0;height:3px;border-radius:2px;background:var(--line);overflow:hidden;}
.fg .bar i{display:block;height:100%;background:var(--tx3);}
.fg.on .bar i{background:var(--pri);}
.fg .t1{display:flex;align-items:center;gap:8px;margin-bottom:2px;}
.fg .gn{font-size:15px;font-weight:700;}
.fg.on .gn{color:var(--pri);}
.fg .t2{font-size:12.5px;color:var(--tx2);font-variant-numeric:tabular-nums;}
.fg .t3{font-size:12px;color:var(--tx3);margin-top:2px;}
.fg:hover .gn{text-decoration:underline;text-underline-offset:3px;}
.fbreak{width:80px;flex-shrink:0;padding-top:12px;border-top:3px dotted var(--line2);font-size:12px;color:var(--tx3);line-height:1.45;}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--pri);}
.live i{width:6px;height:6px;border-radius:50%;background:var(--pri);animation:pulse 1.6s infinite;}
@keyframes pulse{50%{opacity:.35;}}

/* 평가 3단 */
.ev3{display:grid;grid-template-columns:196px minmax(0,1fr) 360px;gap:32px;align-items:start;}
.sticky{position:sticky;top:24px;}
.plist{display:flex;flex-direction:column;gap:1px;}
.prow{width:100%;text-align:left;padding:9px 10px;border-radius:var(--r-sm);}
.prow:hover{background:var(--hover);}
.prow.on{background:var(--pri-weak);}
.prow.abs{cursor:not-allowed;opacity:.55;}
.prow .r1{display:flex;align-items:center;justify-content:space-between;gap:6px;}
.prow .pid{font-size:13.5px;font-weight:600;}
.prow.on .pid{color:var(--pri);}
.prow .r2{font-size:12px;color:var(--tx3);margin-top:1px;display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;}

/* 마스킹 문서 */
.doc{border:1px solid var(--line2);border-radius:var(--r);padding:24px 26px;background:#fff;position:relative;}
.doc .dh{display:grid;grid-template-columns:auto 1fr auto 1fr;white-space:nowrap;gap:10px 16px;font-size:13px;align-items:center;}
.doc .dh .k{color:var(--tx3);font-size:12.5px;}
.doc .hr{border-top:1px solid var(--line);margin:18px 0 16px;}
.doc h5{font-size:12.5px;color:var(--tx3);font-weight:600;margin:18px 0 6px;}
.doc h5:first-of-type{margin-top:0;}
.doc ul{list-style:none;} .doc li{font-size:13.5px;padding:3px 0;display:flex;gap:8px;}
.doc li .per{color:var(--tx3);font-size:12.5px;margin-left:auto;white-space:nowrap;}
.doc p{font-size:13.5px;line-height:1.75;color:var(--tx);}
.mk{white-space:nowrap;display:inline-flex;align-items:center;gap:3px;vertical-align:1px;font-size:11.5px;font-weight:500;color:var(--tx3);padding:0 7px;border-radius:4px;background:#EEF0F3;line-height:1.7;}
.mk svg{width:10px;height:10px;}
.photo-mk{width:64px;height:80px;border-radius:6px;background:#EEF0F3;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--tx3);gap:4px;flex-shrink:0;}

/* 질문 가이드 */
.qitem{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.qitem:last-child{border-bottom:0;}
.qchk{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px;background:#fff;transition:.12s;}
.qchk.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.qchk svg{width:12px;height:12px;stroke-width:2.6;}
.qtx{flex:1;font-size:13.5px;line-height:1.55;}
.qtx.done{color:var(--tx3);text-decoration:line-through;text-decoration-color:var(--line2);}
.qtag{font-size:11.5px;font-weight:500;color:var(--tx3);margin-right:8px;}
details.ban{margin-top:8px;}
details.ban summary{list-style:none;cursor:pointer;padding:8px 0;font-size:12.5px;font-weight:500;color:var(--tx2);display:inline-flex;align-items:center;gap:6px;}
details.ban summary::-webkit-details-marker{display:none;}
details.ban summary:hover{color:var(--tx);}
details.ban .bl{padding:4px 0 6px;display:flex;flex-wrap:wrap;gap:6px;}

/* 점수 */
.crit{padding:14px 0;border-bottom:1px solid var(--line);}
.crit:first-of-type{padding-top:0;}
.crit .ch{display:flex;align-items:baseline;gap:6px;margin-bottom:2px;}
.crit .cn{font-size:14px;font-weight:600;}
.crit .cw{font-size:12px;color:var(--tx3);}
.crit .clv{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--pri);font-variant-numeric:tabular-nums;}
.crit .cd{font-size:12px;color:var(--tx3);margin-bottom:10px;}
.lv{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;}
.lv button{height:38px;border-radius:var(--r-sm);border:1px solid var(--line2);background:#fff;font-size:13.5px;font-weight:600;color:var(--tx2);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;transition:.1s;}
.lv button small{font-size:10px;font-weight:500;color:var(--tx3);margin-top:3px;}
.lv button:hover{border-color:var(--pri-line);color:var(--pri);}
.lv button.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.lv button.on small{color:rgba(255,255,255,.8);}
.lv button[disabled]{pointer-events:none;}
.total{display:flex;align-items:baseline;justify-content:space-between;padding:16px 0;margin-bottom:6px;}
.total .tl{font-size:13px;font-weight:600;}
.total .tl span{display:block;font-size:12px;color:var(--tx3);font-weight:400;margin-top:2px;}
.total .tv{font-size:28px;font-weight:700;color:var(--pri);font-variant-numeric:tabular-nums;letter-spacing:-0.02em;}
.total .tv small{font-size:13px;color:var(--tx3);font-weight:500;}
.cc{display:flex;justify-content:space-between;font-size:12px;color:var(--tx3);margin-top:5px;}
.cc .req{color:var(--warn);font-weight:600;}
.hl{background:var(--err-weak);color:var(--err);border-radius:3px;padding:0 2px;font-weight:600;}
.chk-line{display:flex;gap:8px;font-size:12.5px;line-height:1.5;color:var(--tx3);margin-bottom:16px;}
.chk-line.on{color:var(--err);}
.chk-line b{font-weight:600;}
.foot-act{display:flex;gap:8px;margin-top:18px;}
.foot-act .btn{flex:1;height:40px;}
.savest{font-size:12px;color:var(--tx3);text-align:right;margin-top:8px;min-height:18px;}

/* 교육 */
.mod{border-bottom:1px solid var(--line);}
.mod:first-child{border-top:1px solid var(--line);}
.mod-h{display:flex;align-items:center;gap:14px;padding:16px 4px;cursor:pointer;}
.mod-h:hover{background:var(--bg-sub);}
.mod-n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);color:var(--tx3);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mod.done .mod-n{border-color:var(--pri);background:var(--pri);color:#fff;}
.mod-t{flex:1;} .mod-t b{font-size:14px;font-weight:600;display:block;} .mod-t span{font-size:12.5px;color:var(--tx3);}
.chev{color:var(--tx3);display:flex;transition:transform .15s;}
.mod-b{padding:2px 4px 20px 42px;font-size:13.5px;color:var(--tx);line-height:1.7;}
.mod-b ul{padding-left:16px;margin:4px 0 12px;} .mod-b li{margin-bottom:3px;}
.wt{width:100%;border-collapse:collapse;margin:10px 0 12px;font-size:12.5px;}
.wt td,.wt th{border-bottom:1px solid var(--line);padding:8px 10px 8px 0;text-align:left;} .wt th{color:var(--tx3);font-weight:500;border-top:1px solid var(--line2);}
.prog{height:4px;border-radius:2px;background:var(--line);overflow:hidden;} .prog i{display:block;height:100%;background:var(--pri);transition:.3s;}
.quiz{padding:14px 0;border-bottom:1px solid var(--line);}
.quiz:last-child{border-bottom:0;}
.quiz .qq{font-size:13.5px;margin-bottom:10px;}
.quiz .qa{display:flex;gap:6px;align-items:center;}
.ox{width:44px;height:30px;border-radius:6px;border:1px solid var(--line2);font-weight:700;font-size:13px;color:var(--tx2);background:#fff;}
.ox:hover{background:var(--hover);}
.ox.on.ok{background:var(--pri);border-color:var(--pri);color:#fff;}
.ox.on.bad{background:var(--err-weak);border-color:var(--err-weak);color:var(--err);}
.quiz .fb{font-size:12.5px;margin-left:8px;}
.lead{font-size:13.5px;line-height:1.7;color:var(--tx2);margin-bottom:14px;}

/* 서명 */
.sig{position:relative;border:1px dashed var(--line2);border-radius:var(--r-sm);background:var(--bg-sub);height:150px;touch-action:none;}
.sig canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;}
.sig .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--tx3);font-size:12.5px;pointer-events:none;}
.sig.inked .ph{display:none;}
.sig.inked{border-style:solid;background:#fff;}
.sig.lock{pointer-events:none;}
.sig-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:12px;color:var(--tx3);}
.check{display:flex;align-items:flex-start;gap:10px;padding:10px 0;font-size:13.5px;}
.check .ck{width:18px;height:18px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--line2);color:transparent;margin-top:1px;}
.check .ck.on{background:var(--pri);border-color:var(--pri);color:#fff;}
.check .ck.x{border-color:var(--warn);color:var(--warn);}
.check .ck svg{width:11px;height:11px;stroke-width:2.8;}
.check .cs{font-size:12px;color:var(--tx3);}
.cbx{display:flex;align-items:center;gap:10px;padding:12px 0;cursor:pointer;font-size:13.5px;font-weight:500;border-top:1px solid var(--line);margin-top:8px;}
.cbx .qchk{margin:0;}
.receipt{border-top:1px solid var(--line);padding-top:12px;font-size:13px;}
.receipt div{display:flex;justify-content:space-between;padding:4px 0;} .receipt span{color:var(--tx3);}
.sigimg{height:70px;display:block;margin:10px auto 0;}

/* 토글·키값 */
.tg{width:36px;height:20px;border-radius:10px;background:var(--line2);position:relative;transition:.2s;flex-shrink:0;}
.tg::after{content:'';position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:.2s;}
.tg.on{background:var(--pri);} .tg.on::after{left:18px;}
.kv{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:13.5px;gap:10px;}
.kv:first-child{border-top:1px solid var(--line2);}
.kv .k{color:var(--tx3);} .kv .v{font-weight:500;}
.docrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.docrow:first-child{border-top:1px solid var(--line2);}
.docrow .dt{flex:1;min-width:0;} .docrow .dt b{font-size:13.5px;font-weight:600;display:block;} .docrow .dt span{font-size:12px;color:var(--tx3);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.empty{padding:40px 16px;text-align:center;color:var(--tx3);font-size:13px;border-top:1px solid var(--line2);}

/* 잠금 */
.locked{max-width:420px;margin:80px auto;text-align:center;}
.locked .li{color:var(--tx3);display:flex;justify-content:center;margin-bottom:14px;}
.locked .li svg{width:28px;height:28px;}
.locked h2{font-size:18px;margin-bottom:6px;} .locked p{font-size:13.5px;color:var(--tx2);margin-bottom:20px;}

/* 모달 */
.ov{position:fixed;inset:0;background:rgba(22,24,32,.36);display:flex;align-items:flex-start;justify-content:center;padding:64px 20px;z-index:60;overflow-y:auto;animation:fade .15s;}
@keyframes fade{from{opacity:0}}
.modal{background:#fff;border-radius:12px;width:100%;max-width:500px;box-shadow:var(--sh-pop);animation:up .18s;}
.modal.wide{max-width:760px;}
@keyframes up{from{transform:translateY(8px);opacity:0}}
.mh{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 4px;}
.mh b{font-size:16px;font-weight:700;}
.mh button{color:var(--tx3);width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;}
.mh button:hover{background:var(--hover);color:var(--tx);}
.mb{padding:14px 22px 20px;font-size:13.5px;line-height:1.6;}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:0 22px 20px;}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--tx);color:#fff;font-size:13px;padding:11px 16px;border-radius:8px;display:flex;align-items:center;gap:8px;z-index:80;box-shadow:var(--sh-pop);animation:up .2s;}
.toast.red{background:var(--err);}

/* 캡처 방지 */
.secure{position:relative;-webkit-user-select:none;user-select:none;}
.secure.wm::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:var(--wm);border-radius:inherit;z-index:2;}
body.shield .secure{filter:blur(9px);}
.secure.sticky{position:sticky;}
.shield-ov{display:none;position:fixed;inset:0;z-index:90;background:rgba(255,255,255,.6);backdrop-filter:blur(2px);align-items:center;justify-content:center;}
body.shield .shield-ov{display:flex;}
.shield-ov .box{background:#fff;border:1px solid var(--line2);border-radius:12px;box-shadow:var(--sh-pop);padding:22px 26px;text-align:center;font-size:13px;color:var(--tx2);}
.shield-ov .box b{display:block;color:var(--tx);font-size:15px;margin-bottom:4px;}
@media print{.secure{visibility:hidden!important;}}

.row-between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.mt8{margin-top:8px;}.mt12{margin-top:12px;}.mt16{margin-top:16px;}.mt24{margin-top:24px;}.mb12{margin-bottom:12px;}

.app.pre{display:block;}
.app.pre .nav{display:none;}
.app.pre .main{padding:0;max-width:none;}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;background:#fff;}
.login{width:100%;max-width:400px;}
.login .lg-logo .logo-svg{height:26px;width:auto;display:block;margin-bottom:36px;}
.login h1{font-size:28px;font-weight:800;letter-spacing:-0.03em;margin-bottom:6px;}
.login .lg-s{font-size:14px;color:var(--tx2);margin-bottom:28px;}
.input.lg{height:48px;font-size:15px;}
.btn.lg{height:50px;font-size:15px;}
.lg-err{display:flex;align-items:center;gap:6px;color:var(--err);font-size:13px;font-weight:600;margin:-4px 0 12px;}
.lg-help-x{margin-top:28px;padding-top:20px;border-top:1px solid var(--line);font-size:12.5px;color:var(--tx2);display:grid;gap:6px;}
.lg-help b{color:var(--tx);margin-right:6px;}

/* ===== v8 테마 · 박스 없이 타이포·여백·구분선으로 위계 · 클린 화이트 + 비비드 블루 1색 + 레드(문제만) ===== */
:root{
  --pri:#1F6BFF;--pri-h:#1557E6;--pri-weak:#EBF2FF;--pri-line:#C7DAFF;--sky:#8DB4FF;--navy:#191F28;
  --tx:#191F28;--tx2:#4E5968;--tx3:#8B95A1;--line:#EEF0F3;--line2:#E2E5EA;
  --bg:#FFFFFF;--canvas:#F4F5F7;--bg-sub:#F7F8FA;--hover:#F2F4F6;
  --ok:#1F6BFF;--ok-weak:#EBF2FF;--warn:#4E5968;--warn-weak:#F2F4F6;--err:#F04452;--err-weak:#FFEEEF;
  --card-sh:0 1px 2px rgba(25,31,40,.04),0 4px 16px rgba(25,31,40,.05);
}
body{color:var(--tx);}
.st{padding:3px 10px 3px 8px;border-radius:999px;background:#F2F4F6;color:var(--tx2);font-weight:600;line-height:1.45;}
.st::before{background:currentColor;}
.st.pri,.st.ok{background:var(--pri-weak);color:var(--pri);}
.st.warn{background:#F2F4F6;color:var(--tx);}
.st.err{background:var(--err-weak);color:var(--err);}
.st.off,.st.mute{background:#F2F4F6;color:var(--tx3);}
.callout{background:var(--bg-sub);color:var(--tx2);}
.callout.ok,.callout.ok b,.callout.pri,.callout.pri b{background:var(--pri-weak);color:var(--pri);}
.callout.warn,.callout.warn b{background:#F2F4F6;color:var(--tx);}
.callout.err,.callout.err b{background:var(--err-weak);color:var(--err);}
.btn.pri,.btn:not(.ghost):not(.soft):not(.sm):not(.xs){}

/* PC: 흰 페이지 · 박스 없음 · 크기/굵기/여백/구분선으로 위계 */
body,.app,.main{background:#fff;}
.nav{background:#F7F8FA;border-right:1px solid var(--line);}
.nav-item{color:var(--tx2);font-weight:500;}
.nav-item:hover{background:#EEF0F3;color:var(--tx);}
.nav-item.on,.nav-item.active{background:#fff;color:var(--tx);font-weight:700;box-shadow:0 1px 2px rgba(25,31,40,.08);}
.nav-item.on svg,.nav-item.active svg{color:var(--pri);}
.nav-job .n,.nav-job .nj-name{color:var(--tx);font-weight:700;}
.phead{padding-bottom:28px;margin-bottom:32px;border-bottom:1px solid var(--line);}
.phead h1{font-size:30px;font-weight:800;letter-spacing:-0.035em;}
.phead p{color:var(--tx2);font-size:14px;}
/* 요약 숫자: 박스 없이 크게 · 첫 숫자만 블루 */
.kpis{margin-bottom:44px;}
.kpi{padding:0 36px;border-left:1px solid var(--line2);}
.kpi .lb{color:var(--tx2);font-size:13px;font-weight:600;margin-bottom:4px;}
.kpi .vl{font-size:34px;font-weight:800;letter-spacing:-0.035em;color:var(--tx);line-height:1.15;}
.kpi .vl small{font-size:14px;color:var(--tx3);font-weight:600;}
.kpi:first-child .vl{color:var(--pri);}
.kpi .vl.err{color:var(--err);} .kpi .vl.warn{color:var(--tx);}
/* 섹션 제목 */
.sec{margin-top:52px;}
.sec-h{margin-bottom:14px;}
.sec-h h2{font-size:19px;font-weight:800;letter-spacing:-0.025em;}
.sec-h .meta{font-size:13px;color:var(--tx3);font-weight:600;}
.cols{gap:56px;}
.cols>aside{border-left:1px solid var(--line);padding-left:32px;margin-left:-24px;}
.cols>aside.panel,.cols>aside.sticky.panel{border-left:0;margin-left:0;}
/* 표: 테두리 없이 헤더 띠 하나 */
.tbl{border-top:0;}
.tbl th{background:var(--bg-sub);color:var(--tx2);font-weight:600;border-bottom:0;padding:10px;}
.tbl th:first-child{border-radius:8px 0 0 8px;padding-left:12px;}
.tbl th:last-child{border-radius:0 8px 8px 0;}
.tbl td:first-child{padding-left:12px;}
.tbl td{color:var(--tx);padding:13px 10px;}
.tbl tbody tr.click:hover td{background:var(--bg-sub);}
.tbl tbody tr.sel td,.tbl tbody tr.on td{background:var(--pri-weak);}
/* 작업 영역(입력·확정)만 옅은 면 */
.panel{border:0;background:var(--bg-sub);border-radius:14px;}
.empty{border-top:0;background:var(--bg-sub);border-radius:12px;}
.search .input{background:var(--bg-sub);}
.seg{background:#EEF0F3;}
.seg button{white-space:nowrap;}
.btn{font-weight:700;}
.doc{border:1px solid var(--line);}
.callout{border-radius:10px;}
.tag.pri,.tag.ai{background:var(--pri-weak);color:var(--pri);border-color:transparent;}
.step .bar{background:var(--line2);} .step.done .bar{background:var(--pri-line);} .step.on .bar{background:var(--pri);}


/* 시연 도우미 (4개 화면 공통) */
.demo-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px;}
.demo-chip{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 12px;border:1px dashed #B9C3D3;border-radius:15px;background:#fff;color:#4E5968;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;}
.demo-chip:hover{border-color:var(--pri);color:var(--pri);}
.demo-chip[disabled]{opacity:.4;pointer-events:none;}
.demo-chip svg{width:14px;height:14px;}
.lg-foot{margin-top:28px;padding-top:18px;border-top:1px solid var(--line);font-size:13px;color:var(--tx2);text-align:center;line-height:1.6;}
.lg-foot a{color:var(--pri);font-weight:600;text-decoration:none;cursor:pointer;}
/* 면접관 교육 */
.course-h{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px;}
.course-k{font-size:12.5px;font-weight:700;color:var(--pri);margin-bottom:4px;}
.course-t{font-size:22px;font-weight:800;letter-spacing:-0.03em;margin-bottom:4px;}
.course-p{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.cp-n{font-size:30px;font-weight:800;color:var(--pri);letter-spacing:-0.03em;line-height:1;}
.cp-n small{font-size:15px;margin-left:2px;}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;display:block;}
.prog i{display:block;height:100%;background:var(--pri);border-radius:3px;transition:width .3s;}
.player{position:relative;aspect-ratio:16/8;border-radius:18px;background:#EBF2FF;overflow:hidden;display:flex;flex-direction:column;}
.player .pl-in{flex:1;display:flex;flex-direction:column;justify-content:center;padding:32px 40px;position:relative;}
.pl-k{font-size:13px;font-weight:700;color:var(--pri);}
.pl-t{font-size:30px;font-weight:800;letter-spacing:-0.035em;margin-top:6px;max-width:70%;line-height:1.25;}
.pl-done{display:inline-flex;align-items:center;gap:4px;margin-top:12px;font-size:13px;font-weight:700;color:var(--pri);}
.pl-btn{position:absolute;right:40px;top:50%;transform:translateY(-50%);width:76px;height:76px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(31,107,255,.3);transition:transform .15s;}
.pl-btn:hover{transform:translateY(-50%) scale(1.05);}
.pl-btn svg{width:30px;height:30px;}
.player.done .pl-btn{background:#fff;color:var(--pri);box-shadow:0 4px 14px rgba(25,31,40,.08);}
.pl-bar{height:4px;background:rgba(31,107,255,.15);margin:0 40px;border-radius:2px;overflow:hidden;}
.pl-bar i{display:block;height:100%;background:var(--pri);}
.pl-time{display:flex;justify-content:space-between;padding:8px 40px 18px;font-size:12px;color:var(--tx2);font-variant-numeric:tabular-nums;font-weight:600;}
.lesson-h{margin:28px 0 16px;} .lesson-h h2{font-size:20px;font-weight:800;letter-spacing:-0.025em;margin-bottom:4px;}
.lesson-b{font-size:14px;line-height:1.7;}
.lesson-b .wt{width:100%;margin-bottom:16px;}
.lesson-b .muted{margin-top:12px;font-size:13px;}
.lv-guide{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.lv-guide div{display:flex;flex-direction:column;align-items:center;padding:10px 4px;border-radius:10px;background:var(--bg-sub);font-size:12.5px;color:var(--tx2);}
.lv-guide b{font-size:18px;color:var(--tx);}
.lv-guide div:last-child{background:var(--pri-weak);color:var(--pri);} .lv-guide div:last-child b{color:var(--pri);}
.steps-ol{list-style:none;counter-reset:s;display:grid;gap:14px;}
.steps-ol li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;column-gap:12px;}
.steps-ol li::before{content:counter(s);grid-row:span 2;width:28px;height:28px;border-radius:50%;background:var(--pri-weak);color:var(--pri);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;}
.steps-ol b{font-size:14.5px;} .steps-ol span{color:var(--tx2);font-size:13.5px;}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:28px;}
.cmp h6{font-size:13px;font-weight:800;margin-bottom:8px;} .cmp h6.ok{color:var(--pri);} .cmp h6.no{color:var(--err);}
.cmp ul{list-style:none;display:grid;gap:8px;} .cmp li{padding:10px 12px;border-radius:10px;background:var(--bg-sub);font-size:13.5px;}
.cmp div:last-child li{background:var(--err-weak);}
.lesson-nav{display:flex;justify-content:space-between;margin-top:32px;padding-top:20px;border-top:1px solid var(--line);}
.curri{border-left:1px solid var(--line);padding-left:24px;}
.cur-h{font-size:13px;font-weight:700;color:var(--tx2);margin-bottom:8px;}
.cur-row{width:100%;display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:10px;text-align:left;margin-bottom:2px;}
.cur-row:hover{background:var(--bg-sub);}
.cur-row.on{background:var(--pri-weak);}
.cur-row.lock{opacity:.5;cursor:default;}
.cr-n{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--tx2);flex-shrink:0;}
.cr-n.done{background:var(--pri);border-color:var(--pri);color:#fff;}
.cur-row.on .cr-n:not(.done){border-color:var(--pri);color:var(--pri);}
.cr-t{flex:1;font-size:14px;font-weight:600;} .cur-row.on .cr-t{color:var(--pri);}
.cr-d{font-size:12.5px;color:var(--tx3);}
.qz-top{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;color:var(--tx2);margin-bottom:28px;}
.qz-prog{display:flex;gap:6px;} .qz-prog i{width:28px;height:6px;border-radius:3px;background:var(--line);}
.qz-prog i.cur{background:var(--pri-line);} .qz-prog i.ok{background:var(--pri);} .qz-prog i.no{background:var(--err);}
.qz-q{font-size:15px;color:var(--tx2);margin-bottom:22px;line-height:1.6;}
.qz-q b{display:block;font-size:24px;font-weight:800;color:var(--tx);letter-spacing:-0.03em;line-height:1.4;margin-top:6px;}
.qz-opts{display:grid;gap:10px;}
.qz-opts.oxg{grid-template-columns:1fr 1fr;}
.qz-o{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;border:1.5px solid var(--line2);background:#fff;text-align:left;font-size:15px;font-weight:600;transition:.12s;}
.qz-o:hover:not([disabled]){border-color:var(--pri);background:var(--pri-weak);}
.qz-opts.oxg .qz-o{flex-direction:column;padding:22px;gap:6px;font-size:14px;color:var(--tx2);}
.ox-big{font-size:34px;font-weight:800;color:var(--tx);line-height:1;}
.qz-n{width:28px;height:28px;border-radius:8px;background:var(--bg-sub);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--tx2);flex-shrink:0;}
.qz-o.ok{border-color:var(--pri);background:var(--pri-weak);} .qz-o.ok .ox-big,.qz-o.ok .qz-n{color:var(--pri);}
.qz-o.no{border-color:var(--err);background:var(--err-weak);} .qz-o.no .ox-big,.qz-o.no .qz-n{color:var(--err);}
.qz-o.ans{border-color:var(--pri);border-style:dashed;}
.qz-o[disabled]{cursor:default;}
.qz-fb{display:flex;gap:8px;align-items:flex-start;margin-top:16px;padding:14px 16px;border-radius:12px;font-size:14px;line-height:1.55;}
.qz-fb.ok{background:var(--pri-weak);color:var(--pri);} .qz-fb.no{background:var(--err-weak);color:var(--err);}
.qz-fb span{color:var(--tx);} .qz-fb b{margin-right:6px;} .qz-fb.ok b{color:var(--pri);} .qz-fb.no b{color:var(--err);}
.qz-end,.cert{text-align:center;padding:40px 20px;}
.qz-score{font-size:56px;font-weight:800;letter-spacing:-0.04em;color:var(--err);line-height:1;} .qz-score.pass{color:var(--pri);}
.qz-score span{font-size:22px;color:var(--tx3);margin-left:4px;}
.qz-end h3,.cert h3{font-size:22px;font-weight:800;margin:16px 0 6px;letter-spacing:-0.025em;}
.qz-dots{display:flex;gap:8px;justify-content:center;margin:22px 0 26px;}
.qz-dots span{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;}
.qz-dots .ok{background:var(--pri-weak);color:var(--pri);} .qz-dots .no{background:var(--err-weak);color:var(--err);}
.cert-ic{width:76px;height:76px;border-radius:50%;background:var(--pri-weak);color:var(--pri);display:flex;align-items:center;justify-content:center;margin:0 auto;}
.cert-ic svg{width:40px;height:40px;}
.cert-list{display:inline-grid;gap:8px;text-align:left;margin:22px 0 28px;font-size:14px;}
.cert-list div{display:flex;align-items:center;gap:8px;} .cert-list svg{color:var(--pri);}
.sign-v{max-width:560px;}
.sign-v h3{font-size:20px;font-weight:800;margin-bottom:6px;}

svg.i.ph{fill:currentColor;stroke:none;}

function pgTraining(){
  const T=S.training;
  const nL=LESSONS.filter(l=>T.prog[l.id]>=100).length;const qp=quizPassed();

  const cur=LESSONS.find(l=>l.id===T.view);
  let main;
  if(cur)main=`${playerView(cur)}
    <div class="lesson-h"><h2>${cur.t}</h2><span class="muted">${cur.sum}</span></div>
    <div class="lesson-b">${lessonBody(cur.id)}</div>
    <div class="lesson-nav">${LESSONS.indexOf(cur)>0?`<button class="btn ghost" data-act="tView" data-v="${LESSONS[LESSONS.indexOf(cur)-1].id}">${ic('back','s14')}이전 강의</button>`:'<span></span>'}
      ${LESSONS.indexOf(cur)<LESSONS.length-1?`<button class="btn ${T.prog[cur.id]>=100?'pri':''}" data-act="tView" data-v="${LESSONS[LESSONS.indexOf(cur)+1].id}">다음 강의${ic('arrow','s14')}</button>`:`<button class="btn ${lessonsDone()?'pri':''}" data-act="tView" data-v="quiz" ${lessonsDone()?'':'disabled'}>확인 퀴즈 풀기${ic('arrow','s14')}</button>`}</div>`;
  else if(T.view==='quiz')main=quizView();
  else main=signView();
  const row=(id,n,t,d,state,locked)=>`<button class="cur-row ${T.view===id?'on':''} ${locked?'lock':''}" data-act="tView" data-v="${id}" ${locked?'disabled':''}>
    <span class="cr-n ${state==='done'?'done':''}">${state==='done'?ic('check','s14'):locked?ic('lock','s14'):n}</span><span class="cr-t">${t}</span><span class="cr-d">${d}</span></button>`;
  return `
  <div class="course-h">
    <div><div class="course-k">필수 교육</div><h2 class="course-t">공정한 평가를 위한 면접관 교육</h2><div class="muted">강의 4개 · 약 15분 · 확인 퀴즈 ${QUIZ.length}문항 · 이수 후 평가 시작</div>
    ${T.done?'':`<div class="demo-chips" style="justify-content:flex-start;margin-top:12px"><button class="demo-chip" data-act="demoTrain">${ic('spark','s14')}시연용 교육 이수 처리</button></div>`}</div>
    <div class="course-p"><div class="cp-n">${pct}<small>%</small></div><div class="prog" style="width:180px"><i style="width:${pct}%"></i></div><div class="muted" style="font-size:12.5px">${doneN} / ${total} 완료</div></div>
  </div>
  <div class="cols tr-cols" style="grid-template-columns:minmax(0,1fr) 320px">
    <div class="tr-main">${main}</div>
    <aside class="curri sticky">
      <div class="cur-h">커리큘럼</div>
      ${LESSONS.map((l,k)=>row(l.id,k+1,l.t,l.d,T.prog[l.id]>=100?'done':'',false)).join('')}
      ${row('quiz','Q','확인 퀴즈',QUIZ.length+'문항',qp?'done':'',!lessonsDone())}
      ${row('sign','✓','이수 서명','',T.done?'done':'',!qp)}
    </aside>
  </div>`;
}
let plTimer=null;
function playLesson(id){
  const T=S.training;const L=LESSONS.find(l=>l.id===id);
  if(T.prog[id]>=100){T.prog[id]=0;}
  if(T.playing===id){clearInterval(plTimer);T.playing=null;render();return;}
  clearInterval(plTimer);T.playing=id;render();
  plTimer=setInterval(()=>{T.prog[id]=Math.min(100,(T.prog[id]||0)+2.5);
    const b=$('#plbar'),tm=$('#pltime');if(b)b.style.width=T.prog[id]+'%';if(tm)tm.textContent=mmss(L.sec*T.prog[id]/100);
    if(T.prog[id]>=100){clearInterval(plTimer);T.playing=null;toast(`${L.t} 수강 완료`);render();}},100);
}

/* ================= 3. 평가 진행 ================= */
function lockedView(){return `<div class="locked"><div class="li">${ic('lock')}</div><h2>면접관 교육 이수 필요</h2><p>표준 교육 · 블라인드 교육 이수 서명 완료 후 이용 가능</p><button class="btn pri" data-act="go" data-p="training">면접관 교육으로 이동</button><div class="demo-chips"><button class="demo-chip" data-act="demoTrain">${ic('spark','s14')}시연용 교육 이수 처리</button></div></div>`;}
function pgEval(){
  if(!S.training.done)return lockedView();
  const c=cnt();
  return `
  ${S.fin.done?`<div class="callout">${ic('lock')}<span><b>평가 확정 완료</b> · ${S.fin.at} · 점수·코멘트 수정 불가 (열람 전용)</span></div>`:''}
  <div class="tabs">
    <button class="tab ${S.evTab==='input'?'active':''}" data-act="evTab" data-t="input">평가 입력</button>
    <button class="tab ${S.evTab==='summary'?'active':''}" data-act="evTab" data-t="summary">평가 현황 <span class="cnt">${c.sub}/${c.all}</span></button>
  </div>
  ${S.evTab==='input'?evInput():evSummary()}`;
}
function evInput(){

  <div class="sec-h" style="margin-bottom:14px"><h2>${JOBS[0].room}</h2><span class="meta">조별 면접 · 최대 5인 · 최대 50분 · 인당 10분</span><span class="sp"></span><span class="live"><i></i>3조 진행 중</span></div>
  <div class="flow">
    ${GROUPS.map((x,i)=>{const f=grpInfo(x);return `${i===2?`<div class="fbreak">점심<br>12:00–13:00</div>`:''}

      <span class="bar"><i style="width:${f.tot?f.done/f.tot*100:0}%"></i></span>
      <div class="t1"><span class="gn">${x.id}</span>${f.state==='진행 중'?'<span class="st pri">진행 중</span>':'<span class="st off">종료</span>'}</div>
      <div class="t2">${x.start}–${f.end} · ${f.sess}분 · 참석 ${f.att}/${f.n}명</div>
      <div class="t3">제출 ${f.done}/${f.tot}${f.att<f.n?` · <span style="color:var(--warn)">불참 ${f.n-f.att} 반영</span>`:''}</div>
    </button>`;}).join('')}
  </div>

  <div class="ev3">
    <div class="sticky">
      <div class="sec-h" style="margin-bottom:8px"><h2>${q?'검색 결과':S.grp+' 지원자'}</h2><span class="meta">${list.length}명</span></div>
      <div class="search mb12">${ic('search','s14')}<input class="input" placeholder="면접번호 검색" data-inp="search" value="${esc(S.search)}"></div>
      <div class="plist">${list.length?list.map(a=>`<button class="prow ${a.id===S.sel?'on':''} ${a.absent?'abs':''}" data-act="${a.absent?'absentTip':'selApp'}" data-id="${a.id}">
        <div class="r1"><span class="pid">${a.id}</span>${stChip(a)}</div>
        <div class="r2"><span>${a.group} · ${a.order}번</span><span>${a.absent?'평가 제외':(filled(a)||a.status!=='none')?total(a).toFixed(1)+'점':'—'}</span></div></button>`).join(''):`<div class="empty">검색 결과 없음</div>`}</div>
      <div class="note">면접 순번 확정 · 불참자는 평가 대상 제외</div>
    </div>

    <div>
      <div class="sec-h"><h2>입사지원서</h2><span class="meta">${ap.id} · ${ap.group} ${ap.order}번</span><span class="sp"></span><button class="btn xs" data-act="viewResume" data-id="${ap.id}">${ic('eye','s14')}전체 보기</button></div>
      <div class="doc secure wm">
        <div style="display:flex;gap:20px;align-items:center">
          <div class="photo-mk">${ic('lock','s14')}사진</div>
          <div class="dh" style="flex:1">
            <span class="k">성명</span><span>${MK('성명')}</span><span class="k">생년월일</span><span>${MK('생년월일')}</span>
            <span class="k">지원분야</span><span class="strong">${ap.field}</span><span class="k">최종학력</span><span>${MK('학교명')}</span>
          </div>
        </div>
        <div class="hr"></div>
        <h5>주요 경력</h5><ul>${ap.exp.map(e=>`<li><span>${e[0]} — ${e[1]}</span><span class="per">${e[2]}</span></li>`).join('')}</ul>
        <h5>자격 사항</h5><ul><li>${ap.cert.join(' · ')}</li></ul>
      </div>
      <div class="note">개인 식별 정보는 가려져 있어요 · 화면 캡처는 제한돼요</div>

      <section class="sec" style="margin-top:36px">
        <div class="sec-h"><h2>질문 가이드</h2><span class="meta">AI 초안 · 평가자 재량 활용</span><span class="sp"></span>
          <div class="seg"><button class="${S.qTab==='common'?'on':''}" data-act="qTab" data-t="common">공통 질문</button><button class="${S.qTab==='resume'?'on':''}" data-act="qTab" data-t="resume">지원서 기반</button></div></div>
        <div id="qlist" style="border-top:1px solid var(--line2)">${qList(ap)}</div>
        <details class="ban"><summary>${ic('down','s14')}블라인드 금지 질문 유형</summary><div class="bl">${BAN_TYPES.map(b=>`<span class="tag">${b}</span>`).join('')}</div></details>
        <div class="field mt16" style="margin-bottom:0"><label>면접 메모 <span class="faint">· 평가 미반영 · 본인만 열람</span></label>
          <textarea class="textarea" style="min-height:76px" data-inp="memo" placeholder="답변 요지, 추가 확인 사항 메모" ${S.fin.done?'disabled':''}>${esc(ap.memo)}</textarea></div>
      </section>
    </div>

    <div class="panel sticky secure" id="scoreCard">${scoreCard(ap)}</div>
  </div>`;
}
function qList(ap){
  const L=S.qTab==='common'?COMMON_Q.map((x,i)=>({k:'c'+i,c:x.c,q:x.q})):ap.extraQ.map((q,i)=>({k:'r'+i,q}));
  return L.map(x=>{const on=ap.asked[x.k];const cn=x.c?CRIT.find(c=>c.id===x.c).name:'지원서';return `<div class="qitem"><button class="qchk ${on?'on':''}" data-act="ask" data-k="${x.k}" ${S.fin.done?'disabled':''}>${on?ic('check'):''}</button><div class="qtx ${on?'done':''}"><span class="qtag">${cn}</span>${esc(x.q)}</div></div>`;}).join('');
}
function scoreCard(ap){
  const lock=S.fin.done||ap.status==='submitted';
  const hits=scanBan(ap.comment+' '+ap.memo);
  const ext=CRIT.some(c=>ap.scores[c.id]===1||ap.scores[c.id]===5);
  return `
  <div class="panel-h"><h3>항목별 평가</h3><span class="faint" style="font-size:13px">${ap.id}</span><span class="sp"></span>${stChip(ap)}</div>
  ${ap.status==='submitted'&&!S.fin.done?`<div class="callout ok" style="margin-bottom:16px;padding:10px 12px">${ic('check','s14')}<span>제출 완료 · ${ap.savedAt.slice(11)}</span><span class="sp"></span><button class="btn xs" data-act="reopen">수정</button></div>`:''}
  ${CRIT.map(c=>{const v=ap.scores[c.id];return `<div class="crit">
    <div class="ch"><span class="cn">${c.name}</span><span class="cw">${c.w}점</span><span class="clv">${v?`${LV[v-1]} · ${(c.w*v/5).toFixed(1)}`:''}</span></div>
    <div class="cd">${c.d}</div>
    <div class="lv">${[1,2,3,4,5].map(n=>`<button class="${v===n?'on':''}" data-act="score" data-c="${c.id}" data-v="${n}" ${lock?'disabled':''} title="${LV[n-1]}">${n}<small>${LV[n-1]}</small></button>`).join('')}</div></div>`;}).join('')}
  <div class="total"><div class="tl">합계<span>${CRIT.filter(c=>ap.scores[c.id]).length}/${CRIT.length} 항목 입력 · 가점 별도</span></div><div class="tv" id="tv">${total(ap).toFixed(1)}<small> / 100</small></div></div>
  <div class="field" style="margin-bottom:12px"><label>코멘트 ${ext?'<span style="color:var(--warn);font-weight:600">· 최고·최저 등급 근거 필수</span>':''}</label>
    <textarea class="textarea" data-inp="comment" placeholder="평가 근거를 직무 역량 중심으로 작성" ${lock?'disabled':''}>${esc(ap.comment)}</textarea>
    <div class="cc"><span id="ccReq" class="${ext&&ap.comment.trim().length<15?'req':''}">${ext?'최소 15자':'선택 입력 · 권장 15자 이상'}</span><span id="ccN">${ap.comment.length}자</span></div></div>
  <div class="chk-line ${hits.length?'on':''}" id="warnbox">${warnHTML(hits)}</div>
  ${S.fin.done?'':`<div class="foot-act"><button class="btn" data-act="saveDraft" ${lock?'disabled':''}>임시 저장</button><button class="btn pri" data-act="submit" ${lock?'disabled':''}>제출</button></div>`}
  <div class="savest" id="savest">${ap.status==='draft'?'임시 저장 · '+ap.savedAt.slice(11):''}</div>`;
}
function warnHTML(h){return h.length?`${ic('alert','s14')}<span><b>블라인드 위반 소지 표현</b> · ${h.map(w=>`'${w}'`).join(', ')} · 직무 무관 개인정보 언급 여부 확인 필요</span>`
  :`${ic('shield','s14')}<span>코멘트·메모 블라인드 표현 자동 점검 · 출신·가족·나이·성별 등</span>`;}

function evSummary(){
  const c=cnt();const L=evalables();const subs=L.filter(a=>a.status==='submitted');

    <div class="sec-h"><h2>내가 평가한 지원자 점수</h2><span class="meta">${S.me.name} 위원 · 본인 평가분만 표시</span></div>
    <div class="tbl"><table>
      <thead><tr><th>면접번호</th><th>조</th>${CRIT.map(c=>`<th class="num">${c.name}</th>`).join('')}<th class="num">합계</th><th>코멘트</th><th>상태</th><th></th></tr></thead>

        <td class="muted" style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12.5px">${a.absent?'불참 · 평가 제외':esc(a.comment)||'—'}</td>
        <td>${stChip(a)}</td>
        <td class="r">${a.absent?'':`<button class="btn xs" data-act="goApp" data-id="${a.id}">${S.fin.done?'열람':a.status==='submitted'?'수정':a.status==='draft'?'이어서':'평가'}</button>`}</td></tr>`).join('')}</tbody>
    </table></div>
    <div class="note">전체 지원자 제출 완료 시 전자서명 단계에서 확정 가능 · 확정 후 수정 불가</div>
  </section>`;
}

/* ================= 4. 전자서명 ================= */
function pgSign(){
  if(!S.training.done)return lockedView();
  const c=cnt();const allSub=c.sub===c.all;const F=S.fin;
  const L=evalables();
  const warns=L.filter(a=>scanBan(a.comment).length).length;
  const can=allSub&&F.agree&&F.ink&&!F.done;
  return `
  ${F.done?`<div class="callout ok">${ic('check')}<span><b>평가 확정 완료</b> · ${F.at} · 확정 번호 ${F.code}</span></div>`
  :!allSub?`<div class="callout warn">${ic('alert')}<span><b>미제출 ${c.all-c.sub}건</b> · 전체 지원자 평가 제출 후 확정 가능</span><span class="sp"></span><button class="btn sm" data-act="goFirstPending">평가 진행으로 이동</button></div>`
  :`<div class="callout pri">${ic('check')}<span>전체 ${c.all}명 제출 완료 · 점수 검증 후 서명으로 확정</span></div>`}
  <div class="cols" style="grid-template-columns:minmax(0,1fr) 360px">
    <section class="secure wm">
      <div class="sec-h"><h2>점수 검증</h2><span class="meta">불참 1명 제외 · ${c.all}명</span></div>
      <div class="tbl"><table><thead><tr><th>면접번호</th><th>조</th><th class="num">제출 점수</th><th>제출 시각</th><th>검증</th></tr></thead><tbody>
      ${L.map(a=>{const w=scanBan(a.comment).length;const ok=a.status==='submitted'&&filled(a);return `<tr class="click" data-act="goApp" data-id="${a.id}">
        <td class="strong">${a.id}</td><td class="muted">${a.group}</td><td class="num strong">${a.status==='none'?'<span class="faint">—</span>':total(a).toFixed(1)}</td>
        <td class="muted">${a.status==='submitted'?a.savedAt.slice(11):'—'}</td>
        <td>${ok?(w?'<span class="st err">표현 확인</span>':'<span class="st ok">검증</span>'):a.status==='draft'?'<span class="st warn">임시 저장</span>':'<span class="st">미제출</span>'}</td></tr>`;}).join('')}
      </tbody></table></div>
      <div class="note">행 선택 시 해당 지원자 평가 화면으로 이동 · 확정 전까지 수정 가능</div>
    </section>
    <div class="panel sticky">
      <div class="panel-h"><h3>평가 확정</h3></div>
      <div class="check"><span class="ck on">${ic('check')}</span><div>면접관 교육 이수<div class="cs">${S.training.at}</div></div></div>
      <div class="check"><span class="ck ${allSub?'on':'x'}">${ic(allSub?'check':'alert')}</span><div>전체 지원자 제출<div class="cs">${c.sub} / ${c.all}명</div></div></div>
      <div class="check"><span class="ck ${warns?'x':'on'}">${ic(warns?'alert':'check')}</span><div>블라인드 표현 점검<div class="cs">${warns?`확인 필요 ${warns}건 · 경고 이력 기록`:'이상 없음'}</div></div></div>
      ${F.done?`
        <div class="receipt mt16"><div><span>평가자</span><b>${S.me.name} (${S.me.role})</b></div><div><span>확정 인원</span><b>${c.all}명</b></div><div><span>확정 시각</span><b>${F.at}</b></div><div><span>확정 번호</span><b>${F.code}</b></div>
        <img class="sigimg" src="${F.sig}" alt="서명"></div>
        <div class="note">확정 후 점수·코멘트 수정 불가 · 결과 집계는 마스터 관리자 진행</div>`
      :`
      <label class="cbx" data-act="agree"><span class="qchk ${F.agree?'on':''}">${F.agree?ic('check'):''}</span>제출 점수·코멘트 이상 없음 확인</label>
      <div class="sig ${F.ink?'inked':''}" id="sigF"><canvas></canvas><div class="ph">평가자 서명 영역</div></div>
      <div class="sig-foot"><span>${S.me.name} · ${DATE}</span><button class="btn xs ghost" data-act="clearSig" data-s="F">지우기</button></div>
      <button class="btn pri block mt16" style="height:40px" data-act="finalize" ${can?'':'disabled'}>서명 후 평가 확정</button>
      <div class="note">${!allSub?'전체 제출 완료 필요':!F.agree?'점수 이상 없음 확인 필요':!F.ink?'서명 입력 필요':'확정 후 점수·코멘트 수정 불가'}</div>`}

/* 서명 패드 */
function initSig(){
  document.querySelectorAll('.sig').forEach(box=>{
    if(box.classList.contains('lock'))return;
    const key=box.id==='sigT'?'T':'F';
    const cv=box.querySelector('canvas');const r=box.getBoundingClientRect();const dpr=window.devicePixelRatio||1;
    cv.width=r.width*dpr;cv.height=r.height*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
    ctx.lineWidth=2.2;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#0F1E45';
    const store=key==='T'?S.training:S.fin;
    if(store._img){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,r.width,r.height);im.src=store._img;}
    let draw=false,last=null,len=0;
    const pos=e=>{const b=cv.getBoundingClientRect();return[e.clientX-b.left,e.clientY-b.top];};
    cv.onpointerdown=e=>{draw=true;last=pos(e);cv.setPointerCapture(e.pointerId);};
    cv.onpointermove=e=>{if(!draw)return;const p=pos(e);ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(...p);ctx.stroke();len+=Math.hypot(p[0]-last[0],p[1]-last[1]);last=p;};
    cv.onpointerup=()=>{if(!draw)return;draw=false;store._img=cv.toDataURL();if(len>20&&!store.ink){store.ink=true;box.classList.add('inked');render();}};
  });
}

    <div class="doc" style="border:0;padding:0">
      <div style="display:flex;gap:20px;margin-bottom:6px;align-items:center">
        <div class="photo-mk" style="width:76px;height:96px">${ic('lock','s14')}사진</div>
        <div class="dh" style="flex:1">
          <span class="k">성명</span><span>${MK('성명')}</span><span class="k">생년월일</span><span>${MK('생년월일')}</span>
          <span class="k">연락처</span><span>${MK('연락처')}</span><span class="k">주소</span><span>${MK('주소')}</span>
          <span class="k">지원분야</span><span class="strong">${ap.field}</span><span class="k">면접번호</span><span class="strong">${ap.id} · ${ap.group}</span>
        </div>
      </div>
      <div class="hr"></div>
      <h5>학력 사항</h5><ul><li>${MK('학교명')} ${MK('전공 외 식별 정보')} · 경영학 전공</li></ul>
      <h5>주요 경력</h5><ul>${ap.exp.map(e=>`<li><span>${e[0]} — ${e[1]}</span><span class="per">${e[2]}</span></li>`).join('')}</ul>
      <h5>자격 사항</h5><ul>${ap.cert.map(c=>`<li>${c}</li>`).join('')}</ul>
      <h5>자기소개서 · 지원 동기 및 역량</h5><p>${ap.intro}</p>
    </div>
    <div class="note">마스킹 항목: 성명 · 생년월일 · 연락처 · 주소 · 사진 · 학교명 · 가족관계 · 지역 · 캡처·복사 제한 · 열람 기록 저장</div>`});
}

/* ================= 캡처 방지 ================= */
window.addEventListener('blur',()=>{if(['eval','sign'].includes(S.page)||$('.modal .secure'))document.body.classList.add('shield');});
window.addEventListener('focus',()=>document.body.classList.remove('shield'));
document.addEventListener('keyup',e=>{if(e.key==='PrintScreen'){try{navigator.clipboard.writeText('');}catch(_){}toast('캡처 제한 · 개인정보·평가정보 보호 영역',true);}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['p','s'].includes(e.key.toLowerCase())){e.preventDefault();toast('인쇄·저장 제한 · 개인정보·평가정보 보호',true);}});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.secure')){e.preventDefault();toast('보호 영역 · 우클릭 제한',true);}});
document.addEventListener('copy',e=>{if(e.target.closest&&e.target.closest('.secure')&&!['TEXTAREA','INPUT'].includes(e.target.tagName)){e.preventDefault();toast('보호 영역 · 복사 제한',true);}});

document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!S.auth&&['lg-id','lg-pw'].includes(e.target.id)){e.preventDefault();document.querySelector('[data-act=login]').click();}});
render();
</script>
</body>
</html>
